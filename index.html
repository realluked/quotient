!function(){const e=[],t={},a=(e,t,a,n)=>Array.from({length:(n||60)+1},(s,i)=>{const o=t+(a-t)*i/(n||60);return[o,e(o)]});e.push({id:"num",tab:"E1",title:"Number",units:[{code:"1.1\u20131.2",title:"Types of number & sets",sub:"Primes, factors, HCF, LCM and Venn diagrams",lessons:["N1","N2","N3"],guide:["Integers are whole numbers, including negatives and 0. Natural numbers are 0, 1, 2, 3\u2026","A prime has exactly two factors: 1 and itself. 1 is not prime. 2 is the only even prime.","Rational numbers can be written as a fraction of two integers: all terminating and recurring decimals. \u221a2, \u221a5 and \u03c0 are irrational.","The reciprocal of a number is 1 \xf7 the number: the reciprocal of {{2//3}} is {{3//2}}.","Prime factors: use a factor tree, then write in index form, like 360 = 2\xb3 \xd7 3\xb2 \xd7 5.","HCF: multiply the primes the numbers share. LCM: multiply every prime in the Venn diagram.",'Set notation: \u2208 is "is in", A \u2229 B is "in both", A \u222a B is "in A or B or both", A\u2032 is "not in A", n(A) is "how many in A".',{s:1,t:"Venn diagrams can have three sets: fill in the middle (all three) first, then work outwards."}]},{code:"1.3\u20131.7",title:"Powers, roots & indices",sub:"Order of operations and the index laws",lessons:["N4","N5"],guide:["Order of operations: brackets, then indices (powers and roots), then \xd7 and \xf7, then + and \u2212.","Learn squares to 15\xb2 = 225, cubes 1\xb3 to 5\xb3 and 10\xb3 = 1000.","a\u1d50 \xd7 a\u207f = a\u1d50\u207a\u207f. a\u1d50 \xf7 a\u207f = a\u1d50\u207b\u207f. (a\u1d50)\u207f = a\u1d50\u207f.",'a\u2070 = 1 for any non-zero a. a\u207b\u207f = {{1//a\u207f}}: a negative power means "one over".',{s:1,t:"a^{{{1//n}}} is the nth root of a. a^{{{m//n}}} = (\u207f\u221aa)\u1d50: root first, then power."}]},{code:"1.4\u20131.6",title:"Fractions & decimals",sub:"Calculating without a calculator",lessons:["N6","N7"],guide:["Add and subtract fractions using a common denominator. Never add the denominators.","Multiply: top \xd7 top and bottom \xd7 bottom. Divide: keep, flip, change (multiply by the reciprocal).","Turn mixed numbers into top-heavy fractions before multiplying or dividing.","A fraction in its simplest form gives a terminating decimal only if the denominator's prime factors are 2s and 5s.",{s:1,t:"Recurring decimal to fraction: let x = the decimal, multiply by 10, 100 or 1000 to line up the repeat, subtract, then solve."}]},{code:"1.8\u20131.10",title:"Standard form & accuracy",sub:"Big and small numbers, rounding, estimating and bounds",lessons:["N8","N9","N10"],guide:["Standard form is A \xd7 10\u207f where 1 \u2264 A < 10 and n is an integer.","Significant figures start at the first non-zero digit. Zeros at the front of 0.0045 don't count.","To estimate, round every number to 1 significant figure first.","Limits of accuracy: half a unit either side. 7.4 to 1 d.p. means 7.35 \u2264 x < 7.45.",{s:1,t:"Biggest a + b: UB + UB. Biggest a \u2212 b: UB \u2212 LB. Biggest a \xf7 b: UB \xf7 LB. Smallest: swap them."}]},{code:"1.11\u20131.12",title:"Ratio & rates",sub:"Sharing, scales, speed, density and best buys",lessons:["N11","N12"],guide:["To share in a ratio: add the parts, find one part, then multiply.","Map scale 1 : 50 000 means 1 cm on the map is 50 000 cm = 500 m in real life.","Speed = distance \xf7 time. Density = mass \xf7 volume. Pressure = force \xf7 area.","Change minutes to hours by dividing by 60: 45 minutes = 0.75 hours.","Best buy: compare the cost of the same amount, like the price per 100 g."]},{code:"1.13",title:"Percentages",sub:"Change, interest and reverse percentages",lessons:["N13","N14"],guide:["Increase by 15%: \xd7 1.15. Decrease by 15%: \xd7 0.85.","Percentage change = {{change//original}} \xd7 100.","Simple interest = {{P \xd7 R \xd7 T//100}}. Compound interest: P \xd7 (1 + {{r//100}})\u207f.",{s:1,t:"Reverse percentage: divide by the multiplier. After a 20% rise, original = new \xf7 1.2."}]},{code:"1.17\u20131.18",s:1,title:"Growth, decay & surds",sub:"Exponential change and exact roots",lessons:["N15","N16"],guide:["Exponential growth or decay: amount = start \xd7 (multiplier)\u207f.","Depreciation of 12% a year: multiplier 0.88.","\u221aa \xd7 \u221ab = \u221a{ab}. Simplify a surd by taking out the biggest square factor: \u221a{48} = 4\u221a{3}.","Rationalise: multiply top and bottom by the surd. For a \u2212 \u221ab, multiply by a + \u221ab."]},{code:"1.14\u20131.16",title:"Time, money & calculators",sub:"Timetables, time zones, currency and calculator skills",lessons:["N17"],guide:["There are 60 minutes in an hour, so 2.5 hours is 2 hours 30 minutes, not 2 hours 50 minutes.","Currency: multiply by the rate to go one way, divide to go back.","On a calculator, put brackets round the top and bottom of a fraction."]}]}),Object.assign(t,{N1:{name:"Types of number",ex:[{type:"teach",title:"The number families",text:"Exam questions use these words without explaining them, so know each one exactly.",table:[["Word","Meaning","Examples"],["Integer","A whole number, positive, negative or zero","\u22123, 0, 12"],["Prime","Exactly two factors: 1 and itself","2, 3, 5, 7, 11"],["Factor","Divides into the number exactly","Factors of 12: 1, 2, 3, 4, 6, 12"],["Multiple","In the number's times table","Multiples of 4: 4, 8, 12\u2026"],["Square number","An integer times itself","1, 4, 9, 16, 25"],["Cube number","An integer cubed","1, 8, 27, 64, 125"],["Reciprocal","1 \xf7 the number","Reciprocal of 5 is {{1//5}}"]],warn:"1 is not a prime number: it only has one factor."},{type:"teach",title:"Rational or irrational?",text:"A rational number can be written as a fraction {{a//b}} where a and b are integers. An irrational number can't.",bullets:["Rational: 7, \u2212{{2//3}}, 0.25, 0.3\u0307 (recurring decimals are rational too).","Irrational: \u221a{2}, \u221a{10}, \u03c0. Their decimals go on forever without repeating.","Square roots of square numbers are rational: \u221a{49} = 7."],we:{q:"Is \u221a{2} \xd7 \u221a{8} rational or irrational?",s:["\u221a{2} \xd7 \u221a{8} = \u221a{16}","\u221a{16} = 4","4 = {{4//1}}, so it is rational."],a:"Rational"}},{type:"multi",q:"Which of these are prime numbers?",options:["2","9","15","17","21","23","27","1"],correct:[0,3,5],why:"9 = 3 \xd7 3, 15 = 3 \xd7 5, 21 = 3 \xd7 7 and 27 = 3 \xd7 9. 1 has only one factor, so it isn't prime."},{type:"mc",q:"What is the reciprocal of {{2//3}}?",options:["{{3//2}}","\u2212{{2//3}}","{{1//3}}","1.5 \xd7 {{2//3}}"],a:0,why:"Reciprocal means 1 \xf7 the number. Flipping a fraction gives its reciprocal."},{type:"multi",q:"Which of these are irrational?",options:["\u221a{7}","\u03c0","\u221a{9}","0.25","{{1//3}}","\u221a{12}","\u221a{3} \xd7 \u221a{3}"],correct:[0,1,5],why:"\u221a{9} = 3, and \u221a{3} \xd7 \u221a{3} = 3. 0.25 = {{1//4}} and {{1//3}} are fractions. \u221a{7}, \u03c0 and \u221a{12} can't be written as fractions."},{type:"mc",q:"Which number is a multiple of 7 and also a factor of 84?",options:["28","35","49","56"],a:0,why:"84 \xf7 28 = 3, so 28 is a factor of 84, and 28 = 4 \xd7 7. The others are multiples of 7 but don't divide into 84."},{type:"num",q:"What is the reciprocal of 0.25?",a:4,work:["0.25 = {{1//4}}","The reciprocal of {{1//4}} is 4."]},{type:"match",q:"Match each number to the best description.",pairs:[["49","Square number"],["27","Cube number"],["29","Prime number"],["\u221a{5}","Irrational"],["\u22124","Negative integer"]]},{type:"mc",q:"From the list 12, 15, 16, 21, 25, 27, which number is both a square number and odd?",options:["25","16","27","15"],a:0,why:"The square numbers in the list are 16 and 25. Only 25 is odd."}]},N2:{name:"Primes, HCF & LCM",ex:[{type:"teach",title:"Product of prime factors",text:"Every whole number above 1 can be written as primes multiplied together. A factor tree finds them.",list:["Split the number into any two factors, like 360 = 10 \xd7 36.","Keep splitting until every branch ends in a prime. Circle the primes.","Write the primes in order, using powers for repeats."],we:{q:"Write 360 as a product of its prime factors.",s:["360 = 10 \xd7 36","10 = 2 \xd7 5 and 36 = 6 \xd7 6 = 2 \xd7 3 \xd7 2 \xd7 3","Primes: 2, 2, 2, 3, 3, 5"],a:"2\xb3 \xd7 3\xb2 \xd7 5"}},{type:"expr",q:"Write 84 as a product of its prime factors.",a:"2^2*3*7",form:"prime",show:"2\xb2 \xd7 3 \xd7 7",hint:"Use \xd7 between factors and powers like 2^2 (or 2 \xd7 2).",work:["84 = 2 \xd7 42","42 = 2 \xd7 21 = 2 \xd7 3 \xd7 7","84 = 2\xb2 \xd7 3 \xd7 7"]},{type:"teach",title:"HCF and LCM with a Venn diagram",text:"Put the prime factors of both numbers in a Venn diagram. Shared primes go in the middle.",svg:{k:"venn",sets:["60","72"],v:{a:"5",ab:"2, 2, 3",b:"2, 3"},U:""},bullets:["60 = 2\xb2 \xd7 3 \xd7 5 and 72 = 2\xb3 \xd7 3\xb2.","HCF (highest common factor) = the middle: 2 \xd7 2 \xd7 3 = 12.","LCM (lowest common multiple) = everything: 5 \xd7 2 \xd7 2 \xd7 3 \xd7 2 \xd7 3 = 360."],warn:"The HCF can't be bigger than the smaller number, and the LCM can't be smaller than the bigger number."},{type:"num",q:"Find the highest common factor (HCF) of 36 and 60.",a:12,work:["36 = 2\xb2 \xd7 3\xb2","60 = 2\xb2 \xd7 3 \xd7 5","Shared: 2\xb2 \xd7 3 = 12"]},{type:"num",q:"Find the lowest common multiple (LCM) of 12 and 18.",a:36,work:["12 = 2\xb2 \xd7 3","18 = 2 \xd7 3\xb2","LCM = 2\xb2 \xd7 3\xb2 = 36"]},{type:"num",q:"Bus A leaves the station every 12 minutes and bus B every 15 minutes. Both leave at 9:00. After how many minutes do they next leave together?",a:60,unit:"minutes",work:["This is the LCM of 12 and 15.","12 = 2\xb2 \xd7 3, 15 = 3 \xd7 5","LCM = 2\xb2 \xd7 3 \xd7 5 = 60 minutes"]},{type:"fill",q:"A = 2\xb3 \xd7 3 \xd7 5 and B = 2 \xd7 3\xb2 \xd7 7. Find the HCF and the LCM of A and B.",t:"HCF = @   LCM = @",a:[6,2520],work:["HCF: shared primes, lowest powers: 2 \xd7 3 = 6","LCM: every prime, highest powers: 2\xb3 \xd7 3\xb2 \xd7 5 \xd7 7 = 2520"]},{type:"expr",q:"Write 360 as a product of prime factors in index form.",a:"2^3*3^2*5",form:"prime",show:"2\xb3 \xd7 3\xb2 \xd7 5",work:["360 = 2 \xd7 2 \xd7 2 \xd7 3 \xd7 3 \xd7 5","= 2\xb3 \xd7 3\xb2 \xd7 5"]},{type:"mc",q:"The HCF of two numbers is 6 and their LCM is 36. One number is 12. What is the other?",options:["18","24","30","6"],a:0,why:"HCF \xd7 LCM = the two numbers multiplied: 6 \xd7 36 = 216, and 216 \xf7 12 = 18. Check: HCF(12, 18) = 6 and LCM = 36."}]},N3:{name:"Sets & Venn diagrams",ex:[{type:"teach",title:"Set notation",text:"A set is a collection of things, written in curly brackets: A = {2, 4, 6}.",table:[["Symbol","Meaning"],["\u2130","The universal set: everything in the question"],["x \u2208 A","x is an element of A"],["A \u2229 B","Intersection: in A and in B"],["A \u222a B","Union: in A or B or both"],["A\u2032","Complement: not in A"],["n(A)","The number of elements in A"],["\u2205","The empty set"],["A \u2286 B","A is a subset of B: everything in A is also in B"]]},{type:"teach",title:"Reading the regions",text:"Each region of a two-set Venn diagram has a name. The numbers show how many elements are in each region.",svg:{k:"venn",v:{a:"7",ab:"3",b:"5",o:"2"},shade:["ab"]},bullets:["Shaded: A \u2229 B, which has 3 elements.","n(A) = 7 + 3 = 10.","n(A \u222a B) = 7 + 3 + 5 = 15.","n(A\u2032) = everything outside A = 5 + 2 = 7."]},{type:"mc",q:"Which set is shaded?",svg:{k:"venn",shade:["a","b","ab"]},options:["A \u222a B","A \u2229 B","A\u2032","(A \u2229 B)\u2032"],a:0,why:"Everything in A or B or both is shaded: that is the union."},{type:"mc",q:"Which set is shaded?",svg:{k:"venn",shade:["a"]},options:["A \u2229 B\u2032","A \u2229 B","A \u222a B","B\u2032"],a:0,why:"The region is in A but not in B: A and (not B)."},{type:"num",q:"Use the Venn diagram. Find n(A \u222a B)\u2032.",svg:{k:"venn",v:{a:"9",ab:"4",b:"6",o:"3"}},a:3,work:["(A \u222a B)\u2032 is everything outside both circles.","That is the 3 outside."]},{type:"list",q:"\u2130 = {1, 2, 3, \u2026, 10}, A = {even numbers} and B = {multiples of 3}. List the elements of A \u222a B.",a:[2,3,4,6,8,9,10],show:"2, 3, 4, 6, 8, 9, 10",work:["A = {2, 4, 6, 8, 10}","B = {3, 6, 9}","A \u222a B: everything in either, written once: {2, 3, 4, 6, 8, 9, 10}"]},{type:"num",q:"In a class of 30, 18 students study French, 15 study Spanish and 5 study neither. How many study both?",a:8,work:["Students studying at least one language: 30 \u2212 5 = 25",'French + Spanish = 18 + 15 = 33 counts the "both" group twice.',"Both = 33 \u2212 25 = 8"]},{type:"teach",s:1,title:"Three sets",text:"With three sets, start in the middle and work outwards, subtracting as you go.",svg:{k:"venn",n:3,v:{a:"4",b:"3",c:"5",ab:"2",ac:"1",bc:"2",abc:"1",o:"6"}},bullets:["The centre is A \u2229 B \u2229 C.","A \u2229 B includes the centre: here n(A \u2229 B) = 2 + 1 = 3.","Add every number for n(\u2130): here 24."]},{type:"num",s:1,q:"Use the three-set diagram. Find n(A \u2229 C).",svg:{k:"venn",n:3,v:{a:"4",b:"3",c:"5",ab:"2",ac:"1",bc:"2",abc:"1",o:"6"}},a:2,work:["A \u2229 C is the overlap of A and C, including the centre.","1 + 1 = 2"]},{type:"mc",q:"\u2130 = {integers from 1 to 12} and P = {prime numbers}. What is n(P)?",options:["5","6","4","7"],a:0,why:"The primes up to 12 are 2, 3, 5, 7 and 11."}]},N4:{name:"Powers, roots & order",ex:[{type:"teach",title:"Order of operations",text:"Work out a calculation in this order. Multiply and divide left to right; add and subtract left to right.",list:["Brackets","Indices: powers and roots","Division and multiplication","Addition and subtraction"],we:{q:"Work out 5 + 3 \xd7 (8 \u2212 2)\xb2 \xf7 4",s:["Brackets: 8 \u2212 2 = 6","Indices: 6\xb2 = 36","\xd7 and \xf7 from left to right: 3 \xd7 36 = 108, then 108 \xf7 4 = 27","Add: 5 + 27"],a:"32"}},{type:"num",q:"Work out 3 + 4 \xd7 2\xb2.",a:19,work:["Indices first: 2\xb2 = 4","Then multiply: 4 \xd7 4 = 16","Then add: 3 + 16 = 19"]},{type:"num",q:"Work out \u221a{144} + 2\xb3.",a:20,work:["\u221a{144} = 12","2\xb3 = 8","12 + 8 = 20"]},{type:"teach",title:"Powers to know by heart",text:"These come up all the time, especially without a calculator.",table:[["n","1","2","3","4","5","10","11","12","13","14","15"],["n\xb2","1","4","9","16","25","100","121","144","169","196","225"],["n\xb3","1","8","27","64","125","1000","","","","",""]],warn:"0.3\xb2 = 0.09, not 0.9. Square the 3 to get 9, and there are two decimal places: 0.3 \xd7 0.3 = 0.09."},{type:"num",q:"Work out 0.3\xb2.",a:.09,tol:0,work:["3 \xd7 3 = 9","0.3 \xd7 0.3 has two decimal places: 0.09"]},{type:"mc",q:"What is \u22123\xb2?",options:["\u22129","9","\u22126","6"],a:0,why:"Indices come before the minus sign: \u2212(3\xb2) = \u22129. Only (\u22123)\xb2 = 9."},{type:"num",q:"Work out \u221b{125} \u2212 \u221b{8}.",a:3,work:["\u221b{125} = 5 because 5 \xd7 5 \xd7 5 = 125","\u221b{8} = 2","5 \u2212 2 = 3"]},{type:"order",q:"Put these in order of size, smallest first.",items:["6.9","7","\u221a{50}","2\xb3"],short:1,why:"\u221a{50} is just over 7 (7\xb2 = 49), and 2\xb3 = 8."},{type:"mc",q:"Where do brackets go to make 2 + 3 \xd7 4 = 20?",options:["(2 + 3) \xd7 4","2 + (3 \xd7 4)","2 + 3 \xd7 (4)","No brackets are needed"],a:0,why:"(2 + 3) \xd7 4 = 5 \xd7 4 = 20. Without brackets, the answer is 2 + 12 = 14."}]},N5:{name:"Laws of indices",ex:[{type:"teach",title:"Three laws",text:"When the base is the same, you can combine powers without working them out.",table:[["Law","Example"],["Multiply: add the powers","5\xb3 \xd7 5\u2074 = 5\u2077"],["Divide: subtract the powers","7\u2079 \xf7 7\xb2 = 7\u2077"],["Power of a power: multiply","(3\xb2)\u2075 = 3\xb9\u2070"]],warn:"The laws only work when the bases match. 2\xb3 \xd7 3\xb2 can't be combined like this."},{type:"expr",q:"Simplify 3\u2074 \xd7 3\u2075, giving your answer as a power of 3.",a:"3^9",form:"pow",show:"3\u2079",hint:"Type 3^9.",work:["Multiply: add the powers.","4 + 5 = 9, so 3\u2079"]},{type:"expr",q:"Simplify (5\xb2)\xb3 \xf7 5\u2074, giving your answer as a power of 5.",a:"5^2",form:"pow",show:"5\xb2",work:["(5\xb2)\xb3 = 5\u2076","5\u2076 \xf7 5\u2074 = 5\xb2"]},{type:"teach",title:"Zero and negative powers",text:'Any number (except 0) to the power 0 is 1. A negative power means "one over".',bullets:["7\u2070 = 1","2\u207b\xb9 = {{1//2}}","2\u207b\xb3 = {{1//2\xb3}} = {{1//8}}","({{2//3}})\u207b\xb2 = ({{3//2}})\xb2 = {{9//4}}: flip the fraction, then square."],we:{q:"Why is a\u2070 = 1?",s:["a\xb3 \xf7 a\xb3 = a\u2070 by the division law.","But anything divided by itself is 1.","So a\u2070 = 1."]}},{type:"num",q:"Work out 4\u207b\xb2.",a:"1/16",hint:"Give your answer as a fraction or a decimal.",work:["4\u207b\xb2 = {{1//4\xb2}}","= {{1//16}}"]},{type:"num",q:"Work out 7\u2070 + 2\u207b\xb9.",a:1.5,work:["7\u2070 = 1","2\u207b\xb9 = {{1//2}}","1 + {{1//2}} = 1{{1//2}}"]},{type:"teach",s:1,title:"Fractional powers",text:"The bottom of the fraction is a root. The top is a power.",bullets:["16^{{{1//2}}} = \u221a{16} = 4","8^{{{1//3}}} = \u221b{8} = 2","8^{{{2//3}}} = (\u221b{8})\xb2 = 2\xb2 = 4","27^{\u2212{{1//3}}} = {{1//\u221b27}} = {{1//3}}"],we:{q:"Work out 16^{{{3//4}}}.",s:["The 4 on the bottom means the fourth root: \u2074\u221a{16} = 2 (2 \xd7 2 \xd7 2 \xd7 2 = 16).","The 3 on top means cube it: 2\xb3 = 8."],a:"8"},warn:"Root first, then power: the numbers stay small."},{type:"num",s:1,q:"Work out 16^{{{3//4}}}.",a:8,work:["\u2074\u221a{16} = 2","2\xb3 = 8"]},{type:"num",s:1,q:"Work out 25^{\u2212{{1//2}}}.",a:"1/5",work:["25^{{{1//2}}} = \u221a{25} = 5","The minus sign means one over: {{1//5}}"]},{type:"num",s:1,q:"Find n when 2\u207f = {{1//32}}.",a:-5,work:["32 = 2\u2075","{{1//32}} = 2\u207b\u2075","n = \u22125"]}]},N6:{name:"Fractions without a calculator",ex:[{type:"teach",title:"Adding and subtracting",text:"Fractions must have the same denominator before you add or subtract. Find a common denominator, change both fractions, then add the tops.",we:{q:"Work out {{2//3}} + {{3//4}}.",s:["Common denominator: 12","{{2//3}} = {{8//12}} and {{3//4}} = {{9//12}}","{{8//12}} + {{9//12}} = {{17//12}}","As a mixed number: 1{{5//12}}"],a:"1{{5//12}}"},warn:"Never add the bottoms: {{1//2}} + {{1//3}} is not {{2//5}}."},{type:"num",q:"Work out {{3//5}} + {{1//4}}.",a:"17/20",hint:"Type a fraction like 3/4.",work:["Common denominator 20","{{12//20}} + {{5//20}} = {{17//20}}"]},{type:"num",q:"Work out 5 \u2212 2{{3//8}}.",a:"21/8",hint:"Type a fraction like 3/4 or a mixed number like 2 1/2.",work:["5 = 4{{8//8}}","4{{8//8}} \u2212 2{{3//8}} = 2{{5//8}}"]},{type:"teach",title:"Multiplying and dividing",text:"Multiply straight across. To divide, keep the first fraction, flip the second, and change \xf7 to \xd7.",we:[{q:"Work out 1{{2//3}} \xd7 2{{1//4}}.",s:["Top-heavy first: {{5//3}} \xd7 {{9//4}}","Multiply across: {{45//12}}","Simplify: {{15//4}} = 3{{3//4}}"],a:"3{{3//4}}"},{q:"Work out 2{{1//2}} \xf7 {{3//4}}.",s:["{{5//2}} \xf7 {{3//4}}","Keep, flip, change: {{5//2}} \xd7 {{4//3}}","= {{20//6}} = {{10//3}} = 3{{1//3}}"],a:"3{{1//3}}"}]},{type:"num",q:"Work out 1{{2//3}} \xd7 2{{1//4}}.",a:"15/4",work:["{{5//3}} \xd7 {{9//4}} = {{45//12}}","= {{15//4}} = 3{{3//4}}"]},{type:"num",q:"Work out {{4//9}} \xf7 {{2//3}}.",a:"2/3",work:["{{4//9}} \xd7 {{3//2}} = {{12//18}}","= {{2//3}}"]},{type:"fill",q:"Work out {{1//6}} + {{3//4}}. Give your answer as a fraction in its simplest form.",t:"{{1//6}} + {{3//4}} =  @ / @",a:[11,12],work:["Common denominator 12","{{2//12}} + {{9//12}} = {{11//12}}"]},{type:"mc",q:"Which fraction is the largest?",options:["{{3//4}}","{{5//7}}","{{7//10}}","{{2//3}}"],a:0,why:"As decimals: 0.75, about 0.714, 0.7 and about 0.667."},{type:"num",q:"A tank is {{2//5}} full. After 30 litres are added it is {{4//5}} full. How many litres does the full tank hold?",a:75,unit:"litres",work:["{{4//5}} \u2212 {{2//5}} = {{2//5}} of the tank is 30 litres","{{1//5}} is 15 litres","Full tank = 5 \xd7 15 = 75 litres"]}]},N7:{name:"Decimals & recurring decimals",ex:[{type:"teach",title:"Decimals without a calculator",text:"Multiply as if there were no decimal points, then put back the total number of decimal places.",we:[{q:"Work out 0.2 \xd7 0.04.",s:["2 \xd7 4 = 8","0.2 has 1 decimal place and 0.04 has 2: 3 in total.","0.008"],a:"0.008"},{q:"Work out 4.8 \xf7 0.06.",s:["Multiply both by 100 so you divide by a whole number: 480 \xf7 6","= 80"],a:"80"}]},{type:"num",q:"Work out 0.3 \xd7 0.07.",a:.021,tol:0,work:["3 \xd7 7 = 21","3 decimal places in total: 0.021"]},{type:"num",q:"Work out 7.2 \xf7 0.08.",a:90,work:["\xd7 100: 720 \xf7 8","= 90"]},{type:"teach",title:"Terminating or recurring?",text:"Divide the top by the bottom. Some decimals stop; others repeat forever. A dot shows the digits that repeat.",bullets:["{{3//8}} = 0.375 (terminating)","{{1//3}} = 0.333\u2026 = 0.3\u0307","{{5//11}} = 0.4545\u2026 = 0.4\u03075\u0307","In its simplest form, a fraction terminates only if the denominator has no prime factors other than 2 and 5."]},{type:"mc",q:"Which fraction gives a recurring decimal?",options:["{{1//6}}","{{3//8}}","{{7//20}}","{{9//25}}"],a:0,why:"6 = 2 \xd7 3 contains a 3, so {{1//6}} = 0.16\u0307. The others have denominators made only of 2s and 5s."},{type:"mc",q:"Write {{7//8}} as a decimal.",options:["0.875","0.78","0.7\u0307","0.85"],a:0,why:"{{1//8}} = 0.125, so {{7//8}} = 7 \xd7 0.125 = 0.875."},{type:"teach",s:1,title:"Recurring decimal to fraction",text:"Call the decimal x. Multiply by 10, 100 or 1000 so the repeating parts line up, then subtract.",we:{q:"Write 0.4\u03075\u0307 as a fraction in its simplest form.",s:["x = 0.454545\u2026","Two digits repeat, so \xd7 100: 100x = 45.4545\u2026","Subtract: 100x \u2212 x = 45, so 99x = 45","x = {{45//99}} = {{5//11}}"],a:"{{5//11}}"}},{type:"num",s:1,q:"Write 0.7\u0307 as a fraction.",a:"7/9",hint:"Type a fraction like 3/4.",work:["x = 0.777\u2026, 10x = 7.777\u2026","9x = 7","x = {{7//9}}"]},{type:"num",s:1,q:"Write 0.1\u03078\u0307 as a fraction in its simplest form.",a:"2/11",work:["x = 0.1818\u2026, 100x = 18.1818\u2026","99x = 18","x = {{18//99}} = {{2//11}}"]},{type:"num",s:1,q:"Write 0.23\u0307 as a fraction. Only the 3 repeats.",a:"7/30",work:["x = 0.2333\u2026","10x = 2.333\u2026 and 100x = 23.333\u2026","100x \u2212 10x = 21, so 90x = 21","x = {{21//90}} = {{7//30}}"]}]},N8:{name:"Standard form",ex:[{type:"teach",title:"A \xd7 10\u207f",text:"Standard form writes very big or very small numbers as a number between 1 and 10, times a power of 10.",bullets:["340 000 = 3.4 \xd7 10\u2075: the point moves 5 places.","0.000 52 = 5.2 \xd7 10\u207b\u2074: small numbers have negative powers.","The first part must be at least 1 and less than 10: 34 \xd7 10\u2074 is not standard form."],we:{q:"Write 0.000 068 in standard form.",s:["Put the point after the first non-zero digit: 6.8","The point moved 5 places to the right.","It is a small number, so the power is negative."],a:"6.8 \xd7 10\u207b\u2075"}},{type:"num",q:"Write 6 700 000 in standard form.",a:67e5,form:"sf",show:"6.7 \xd7 10\u2076",hint:"Type 6.7 x 10^6.",work:["6.7 \xd7 10\u2076"]},{type:"num",q:"Write 4.2 \xd7 10\u207b\xb3 as an ordinary number.",a:.0042,tol:0,work:["Move the point 3 places left: 0.0042"]},{type:"mc",q:"Which number is written in standard form?",options:["4.7 \xd7 10\u207b\xb2","0.5 \xd7 10\xb3","12 \xd7 10\u2074","7 \xd7 100"],a:0,why:"4.7 is between 1 and 10. 0.5 and 12 aren't, and 100 is not written as a power of 10."},{type:"teach",title:"Calculating in standard form",text:"Multiply or divide the numbers and the powers of 10 separately, then tidy up.",we:{q:"Work out (3 \xd7 10\u2074) \xd7 (5 \xd7 10\u2076).",s:["3 \xd7 5 = 15","10\u2074 \xd7 10\u2076 = 10\xb9\u2070","15 \xd7 10\xb9\u2070 is not standard form: 15 = 1.5 \xd7 10\xb9","1.5 \xd7 10\xb9\xb9"],a:"1.5 \xd7 10\xb9\xb9"},warn:"To add or subtract, write both numbers out in full (or with the same power of 10) first."},{type:"num",q:"Work out (8 \xd7 10\u2079) \xf7 (4 \xd7 10\u207b\xb2). Give your answer in standard form.",a:2e11,form:"sf",show:"2 \xd7 10\xb9\xb9",work:["8 \xf7 4 = 2","10\u2079 \xf7 10\u207b\xb2 = 10\u2079\u207b\u207d\u207b\xb2\u207e = 10\xb9\xb9","2 \xd7 10\xb9\xb9"]},{type:"num",q:"Work out (6 \xd7 10\u2075) + (4 \xd7 10\u2074). Give your answer in standard form.",a:64e4,form:"sf",show:"6.4 \xd7 10\u2075",work:["600 000 + 40 000 = 640 000","= 6.4 \xd7 10\u2075"]},{type:"num",q:"Work out (2.5 \xd7 10\xb3)\xb2. Give your answer in standard form.",a:625e4,form:"sf",show:"6.25 \xd7 10\u2076",work:["2.5\xb2 = 6.25","(10\xb3)\xb2 = 10\u2076","6.25 \xd7 10\u2076"]}]},N9:{name:"Rounding & estimating",ex:[{type:"teach",title:"Decimal places and significant figures",text:"Decimal places count digits after the point. Significant figures count from the first non-zero digit.",table:[["Number","Rounded","Why"],["3.14159","3.14 (2 d.p.)","Two digits after the point"],["34 567","34 600 (3 s.f.)","Keep 3 digits, fill with zeros"],["0.004 572","0.0046 (2 s.f.)","Leading zeros don't count"]],warn:"When rounding a big number, keep its size: 34 567 to 3 s.f. is 34 600, not 346."},{type:"num",q:"Round 0.0607 to 1 significant figure.",a:.06,tol:0,work:["The first significant figure is the 6.","The next digit is 0, so it stays 0.06."]},{type:"num",q:"Round 45 670 to 2 significant figures.",a:46e3,tol:0,work:["The first two significant figures are 4 and 5.","The next digit is 6, so round up: 46 000."]},{type:"num",q:"Round 12.9963 to 2 decimal places.",a:"13.00",tol:0,hint:"Keep the zeros that show the accuracy.",work:["12.99|63: the next digit is 6, so round up.","12.99 \u2192 13.00"]},{type:"teach",title:"Estimating",text:"Round every number to 1 significant figure, then work it out. This is how you check an answer, and some questions ask for it directly.",we:{q:"Estimate {{49.7 \xd7 3.08//0.48}}.",s:["Round: {{50 \xd7 3//0.5}}","50 \xd7 3 = 150","150 \xf7 0.5 = 300"],a:"300"}},{type:"num",q:"Estimate {{61.2 \xd7 0.48//2.94}} by rounding each number to 1 significant figure.",a:10,tol:0,work:["{{60 \xd7 0.5//3}}","= {{30//3}} = 10"]},{type:"mc",q:"Which is the best estimate of \u221a{99.6}?",options:["10","50","9","100"],a:0,why:"99.6 is about 100, and \u221a{100} = 10."},{type:"num",q:"Estimate the value of 307 \xd7 0.0198.",a:6,tol:0,work:["300 \xd7 0.02","= 6"]}]},N10:{name:"Bounds",ex:[{type:"teach",title:"Limits of accuracy",text:"A rounded measurement could be up to half a unit bigger or smaller than it says.",we:{q:"A length is 7.4 cm, correct to 1 decimal place. Write down its limits.",s:["The unit is 0.1 cm, so half a unit is 0.05 cm.","Lower bound: 7.4 \u2212 0.05 = 7.35","Upper bound: 7.4 + 0.05 = 7.45"],a:"7.35 \u2264 length < 7.45"},warn:"The upper bound itself (7.45) would round up to 7.5, which is why the sign is <, not \u2264."},{type:"fill",q:"A mass is 230 g, correct to the nearest 10 g. Complete the error interval.",t:"@ \u2264 mass < @",a:[225,235],work:["Half of 10 g is 5 g.","230 \u2212 5 = 225 and 230 + 5 = 235"]},{type:"num",q:"A bag has a mass of 3.6 kg, correct to 1 decimal place. What is the lower bound of its mass?",a:3.55,unit:"kg",tol:0,work:["Half of 0.1 = 0.05","3.6 \u2212 0.05 = 3.55 kg"]},{type:"num",q:"A time is 24 seconds, correct to the nearest second. What is the upper bound?",a:24.5,unit:"s",tol:0,work:["Half of 1 second is 0.5 s","24 + 0.5 = 24.5 s"]},{type:"teach",s:1,title:"Bounds in calculations",text:"Pick the bounds that push the answer as high (or as low) as possible.",table:[["To find the biggest\u2026","use"],["a + b or a \xd7 b","UB and UB"],["a \u2212 b","UB of a, LB of b"],["a \xf7 b","UB of a, LB of b"]],we:{q:"A rectangle is 5.2 cm by 3.7 cm, both to 1 d.p. Find the upper bound of its area.",s:["Upper bounds: 5.25 cm and 3.75 cm","5.25 \xd7 3.75 = 19.6875"],a:"19.6875 cm\xb2"}},{type:"num",s:1,q:"A rectangle is 12 cm long and 8 cm wide, both to the nearest centimetre. Find the upper bound of its area.",a:106.25,unit:"cm\xb2",tol:.001,work:["Upper bounds: 12.5 cm and 8.5 cm","12.5 \xd7 8.5 = 106.25 cm\xb2"]},{type:"num",s:1,q:"A runner covers 200 m (to the nearest 10 m) in 25 s (to the nearest second). Find the lower bound of her average speed. Give your answer to 3 significant figures.",a:"7.65",unit:"m/s",work:["Lowest speed: lowest distance \xf7 highest time","195 \xf7 25.5","= 7.647\u2026 = 7.65 m/s"]},{type:"mc",s:1,q:"a and b are rounded values. To find the smallest possible value of a \u2212 b, use:",options:["lower bound of a \u2212 upper bound of b","lower bound of a \u2212 lower bound of b","upper bound of a \u2212 upper bound of b","upper bound of a \u2212 lower bound of b"],a:0,why:"Make the first number as small as possible and take away as much as possible."}]},N11:{name:"Ratio & proportion",ex:[{type:"teach",title:"Sharing in a ratio",text:"A ratio compares parts. To share an amount: add the parts, find one part, then multiply.",we:{q:"Share $120 in the ratio 3 : 5.",s:["3 + 5 = 8 parts","One part: 120 \xf7 8 = $15","3 \xd7 15 = $45 and 5 \xd7 15 = $75","Check: 45 + 75 = 120"],a:"$45 and $75"}},{type:"fill",q:"Write the ratio 18 : 24 in its simplest form.",t:"@ : @",a:[3,4],work:["The HCF of 18 and 24 is 6.","18 \xf7 6 = 3 and 24 \xf7 6 = 4"]},{type:"num",q:"Share 84 in the ratio 2 : 5. What is the larger share?",a:60,work:["2 + 5 = 7 parts","84 \xf7 7 = 12","5 \xd7 12 = 60"]},{type:"num",q:"The ratio of boys to girls in a club is 4 : 5. There are 45 girls. How many boys are there?",a:36,work:["5 parts = 45, so 1 part = 9","Boys: 4 \xd7 9 = 36"]},{type:"teach",title:"When you know the difference",text:"Sometimes you're told how much more one person gets. The difference in parts matches that amount.",we:{q:"Ali and Ben share money in the ratio 3 : 7. Ben gets $28 more than Ali. How much is shared?",s:["Difference in parts: 7 \u2212 3 = 4 parts","4 parts = $28, so 1 part = $7","Total: 10 parts = $70"],a:"$70"}},{type:"num",q:"Sweets are shared between Cara and Dev in the ratio 5 : 2. Cara gets 18 more sweets than Dev. How many sweets are there altogether?",a:42,work:["Difference: 5 \u2212 2 = 3 parts = 18","1 part = 6","Total: 7 parts = 42"]},{type:"num",q:"A recipe uses 250 g of flour for 4 people. How much flour is needed for 10 people?",a:625,unit:"g",work:["For 1 person: 250 \xf7 4 = 62.5 g","For 10 people: 62.5 \xd7 10 = 625 g"]},{type:"num",q:"A map has a scale of 1 : 25 000. Two towns are 8 cm apart on the map. How far apart are they in real life, in kilometres?",a:2,unit:"km",work:["8 \xd7 25 000 = 200 000 cm","200 000 cm = 2000 m = 2 km"]},{type:"mc",q:"Six pencils cost $4.20. How much do 10 pencils cost?",options:["$7.00","$7.20","$6.30","$8.40"],a:0,why:"One pencil costs 4.20 \xf7 6 = $0.70, so 10 cost $7.00."}]},N12:{name:"Speed, density & pressure",ex:[{type:"teach",title:"Speed",text:"Speed is distance travelled per unit of time.",eq:"speed = distance \xf7 time",bullets:["Rearranged: distance = speed \xd7 time, and time = distance \xf7 speed.","Match the units: km and hours give km/h; m and seconds give m/s.","45 minutes = {{45//60}} = 0.75 hours."],we:{q:"A car travels 120 km in 1 hour 30 minutes. Find its average speed.",s:["1 hour 30 minutes = 1.5 hours","120 \xf7 1.5 = 80"],a:"80 km/h"},warn:"1 hour 30 minutes is 1.5 hours, not 1.3 hours."},{type:"num",q:"A train travels 150 km at an average speed of 60 km/h. How long does it take, in hours?",a:2.5,unit:"hours",work:["time = distance \xf7 speed","150 \xf7 60 = 2.5 hours"]},{type:"num",q:"Change 20 m/s into km/h.",a:72,unit:"km/h",work:["In one hour: 20 \xd7 3600 = 72 000 m","72 000 m = 72 km, so 72 km/h"]},{type:"num",q:"A cyclist rides at 18 km/h for 40 minutes. How far does she travel?",a:12,unit:"km",work:["40 minutes = {{40//60}} = {{2//3}} hour","18 \xd7 {{2//3}} = 12 km"]},{type:"teach",title:"Density and pressure",text:"These work exactly like speed: one quantity divided by another.",table:[["","Formula","Units"],["Density","mass \xf7 volume","g/cm\xb3 or kg/m\xb3"],["Pressure","force \xf7 area","N/m\xb2 (pascals)"]],we:{q:"A metal block has mass 540 g and volume 200 cm\xb3. Find its density.",s:["density = mass \xf7 volume","540 \xf7 200 = 2.7"],a:"2.7 g/cm\xb3"}},{type:"num",q:"A force of 600 N acts on an area of 1.5 m\xb2. Find the pressure.",a:400,unit:"N/m\xb2",work:["pressure = force \xf7 area","600 \xf7 1.5 = 400 N/m\xb2"]},{type:"num",q:"Gold has a density of 19.3 g/cm\xb3. Find the mass of 5 cm\xb3 of gold.",a:96.5,unit:"g",work:["mass = density \xd7 volume","19.3 \xd7 5 = 96.5 g"]},{type:"mc",q:"Which is the better buy?",options:["750 g for $3.45","500 g for $2.40","They are the same value"],a:0,why:"Price per 100 g: 2.40 \xf7 5 = $0.48, and 3.45 \xf7 7.5 = $0.46. The larger pack is cheaper per gram."},{type:"num",q:"A tap fills a 300-litre tank at 12 litres per minute. How many minutes does it take to fill?",a:25,unit:"minutes",work:["300 \xf7 12 = 25 minutes"]}]},N13:{name:"Percentages",ex:[{type:"teach",title:"Multipliers",text:"The fastest way to change an amount by a percentage is to multiply by one number.",table:[["Change","Multiplier"],["Increase by 15%","1.15"],["Decrease by 15%","0.85"],["Increase by 4%","1.04"],["Decrease by 4%","0.96"],["Find 30%","0.3"]],we:{q:"Increase $80 by 15%.",s:["100% + 15% = 115%, so the multiplier is 1.15","80 \xd7 1.15 = 92"],a:"$92"}},{type:"num",q:"Increase $80 by 15%.",a:92,work:["80 \xd7 1.15 = 92"]},{type:"num",q:"Decrease 640 by 35%.",a:416,work:["100% \u2212 35% = 65%","640 \xd7 0.65 = 416"]},{type:"mc",q:"What is the multiplier for a 4% decrease?",options:["0.96","0.4","1.04","0.04"],a:0,why:"100% \u2212 4% = 96% = 0.96."},{type:"teach",title:"Percentage change",text:"Compare the change with the original amount.",eq:"percentage change = {{change//original}} \xd7 100",we:{q:"A price rises from $40 to $46. Find the percentage increase.",s:["Change: 46 \u2212 40 = $6","{{6//40}} \xd7 100 = 15"],a:"15%"},warn:"Always divide by the original (the old value), not the new one."},{type:"num",q:"A price rises from $40 to $46. Find the percentage increase.",a:15,unit:"%",work:["{{6//40}} \xd7 100 = 15%"]},{type:"num",q:"A laptop's price falls from $750 to $630. Find the percentage decrease.",a:16,unit:"%",work:["Change: 750 \u2212 630 = 120","{{120//750}} \xd7 100 = 16%"]},{type:"num",q:"Write 18 as a percentage of 72.",a:25,unit:"%",work:["{{18//72}} = {{1//4}}","= 25%"]},{type:"num",q:"Without a calculator, find 12% of 250.",a:30,work:["10% = 25","1% = 2.5, so 2% = 5","12% = 25 + 5 = 30"]}]},N14:{name:"Interest & reverse percentages",ex:[{type:"teach",title:"Simple and compound interest",text:"Simple interest is the same every year. Compound interest is paid on the interest too, so it grows faster.",table:[["Type","Total after n years"],["Simple","P + {{P \xd7 R \xd7 n//100}}"],["Compound","P \xd7 (1 + {{R//100}})\u207f"]],we:{q:"$5000 is invested at 4% per year compound interest. Find its value after 3 years.",s:["Multiplier: 1.04","5000 \xd7 1.04\xb3","= 5624.32"],a:"$5624.32"}},{type:"num",q:"$2000 is invested at 3% per year simple interest. How much interest is earned in 4 years?",a:240,unit:"$",work:["One year: 3% of 2000 = $60","Four years: 4 \xd7 60 = $240"]},{type:"num",q:"$5000 is invested at 4% per year compound interest. Find the value after 3 years.",a:"5624.32",unit:"$",work:["5000 \xd7 1.04\xb3","= 5624.32"]},{type:"num",q:"A flat is worth $180 000. Its value rises by 5% a year (compound). What is it worth after 2 years?",a:198450,unit:"$",work:["180 000 \xd7 1.05\xb2","= 198 450"]},{type:"teach",s:1,title:"Reverse percentages",text:"If you know the amount after a change, divide by the multiplier to get back to the original.",we:{q:"After a 20% increase, a price is $96. What was the original price?",s:["After the increase, $96 is 120% of the original.","Multiplier: 1.2","96 \xf7 1.2 = 80"],a:"$80"},warn:"Don't take 20% off $96. That gives $76.80, which is wrong: the 20% was of the original, not of $96."},{type:"num",s:1,q:"A jacket costs $68 in a sale with 15% off. What was the original price?",a:80,unit:"$",work:["$68 is 85% of the original.","68 \xf7 0.85 = 80"]},{type:"num",s:1,q:"A town's population rose by 8% to 6480. What was it before the rise?",a:6e3,work:["6480 \xf7 1.08 = 6000"]},{type:"num",s:1,q:"A price including 20% tax is $54. What is the price before tax?",a:45,unit:"$",work:["54 \xf7 1.2 = 45"]}]},N15:{name:"Growth & decay",s:1,ex:[{type:"teach",title:"Repeated percentage change",text:"When something grows or shrinks by the same percentage every time, multiply by the multiplier once for each step.",eq:"amount = start \xd7 (multiplier)\u207f",svg:{k:"graph",x:"years",y:"value ($)",xm:10,ym:2e4,xs:2,ys:5e3,lines:[{p:a(e=>18e3*Math.pow(.88,e),0,10)}],alt:"Graph of a value falling by 12% a year"},we:{q:"A car worth $18 000 loses 12% of its value each year. Find its value after 3 years.",s:["Multiplier: 1 \u2212 0.12 = 0.88","18 000 \xd7 0.88\xb3","= 12 266.496","Money: $12 266.50"],a:"$12 266.50"}},{type:"num",q:"A colony of 500 bacteria grows by 20% every hour. How many bacteria are there after 5 hours? Give your answer to 3 significant figures.",a:1240,tol:5,work:["500 \xd7 1.2\u2075","= 1244.16","\u2248 1240"]},{type:"num",q:"A 80 g sample loses 15% of its mass every day. Find its mass after 4 days, to 1 decimal place.",a:"41.8",unit:"g",work:["80 \xd7 0.85\u2074","= 41.76\u2026","\u2248 41.8 g"]},{type:"mc",q:"A population of 2500 falls by 6% each year. Which expression gives the population after n years?",options:["2500 \xd7 0.94\u207f","2500 \xd7 0.06\u207f","2500 \xd7 1.06\u207f","2500 \u2212 0.06n"],a:0,why:"A 6% fall leaves 94%, so multiply by 0.94 each year."},{type:"num",q:"A car loses 12% of its value each year. After how many whole years is it first worth less than half its original value?",a:6,unit:"years",work:["0.88\u2075 = 0.528 (still more than 0.5)","0.88\u2076 = 0.464 (less than 0.5)","After 6 years"]},{type:"mc",q:"\xa31000 grows to \xa31000 \xd7 1.035\u207f after n years. What is the annual interest rate?",options:["3.5%","35%","1.035%","0.35%"],a:0,why:"The multiplier 1.035 means an increase of 0.035 = 3.5% each year."}]},N16:{name:"Surds",s:1,ex:[{type:"teach",title:"Simplifying surds",text:"A surd is a root that isn't a whole number, like \u221a{2}. To simplify one, split it using the biggest square factor.",eq:"\u221a{ab} = \u221a{a} \xd7 \u221a{b}",we:{q:"Simplify \u221a{48}.",s:["Biggest square factor of 48: 16","\u221a{48} = \u221a{16} \xd7 \u221a{3}","= 4\u221a{3}"],a:"4\u221a{3}"}},{type:"expr",q:"Simplify \u221a{50}.",a:"5sqrt(2)",form:"surd",show:"5\u221a{2}",hint:"Use the \u221a key: type 5\u221a2.",work:["\u221a{50} = \u221a{25} \xd7 \u221a{2}","= 5\u221a{2}"]},{type:"teach",title:"Adding and multiplying surds",text:"You can only add or subtract the same surd, like adding the same letter.",bullets:["2\u221a{3} + 5\u221a{3} = 7\u221a{3}","\u221a{12} + \u221a{27} = 2\u221a{3} + 3\u221a{3} = 5\u221a{3}","\u221a{3} \xd7 \u221a{3} = 3","(2 + \u221a{3})\xb2 = 4 + 4\u221a{3} + 3 = 7 + 4\u221a{3}"]},{type:"expr",q:"Simplify \u221a{12} + \u221a{75}.",a:"7sqrt(3)",form:"surd",show:"7\u221a{3}",work:["\u221a{12} = 2\u221a{3}","\u221a{75} = 5\u221a{3}","2\u221a{3} + 5\u221a{3} = 7\u221a{3}"]},{type:"num",q:"Work out (3 + \u221a{2})(3 \u2212 \u221a{2}).",a:7,work:["9 \u2212 3\u221a{2} + 3\u221a{2} \u2212 2","= 7"]},{type:"expr",q:"Expand and simplify (2 + \u221a{3})\xb2.",a:"7+4sqrt(3)",form:"surd+exp",show:"7 + 4\u221a{3}",work:["(2 + \u221a{3})(2 + \u221a{3})","= 4 + 2\u221a{3} + 2\u221a{3} + 3","= 7 + 4\u221a{3}"]},{type:"teach",title:"Rationalising the denominator",text:"Get rid of a surd on the bottom of a fraction by multiplying the top and bottom by the same thing.",we:[{q:"Rationalise {{6//\u221a3}}.",s:["\xd7 {{\u221a3//\u221a3}}","{{6\u221a3//3}}","= 2\u221a{3}"],a:"2\u221a{3}"},{q:"Rationalise {{1//3 \u2212 \u221a2}}.",s:["Multiply top and bottom by 3 + \u221a{2}","Bottom: (3 \u2212 \u221a{2})(3 + \u221a{2}) = 9 \u2212 2 = 7","{{3 + \u221a2//7}}"],a:"{{3 + \u221a2//7}}"}]},{type:"expr",q:"Rationalise the denominator of {{10//\u221a5}} and simplify.",a:"2sqrt(5)",form:"rat+surd",show:"2\u221a{5}",work:["\xd7 {{\u221a5//\u221a5}}","{{10\u221a5//5}} = 2\u221a{5}"]},{type:"expr",q:"Rationalise the denominator of {{4//\u221a3 \u2212 1}} and simplify.",a:"2sqrt(3)+2",form:"rat+surd",show:"2\u221a{3} + 2",work:["\xd7 {{\u221a3 + 1//\u221a3 + 1}}","Bottom: 3 \u2212 1 = 2","Top: 4(\u221a{3} + 1)","{{4(\u221a3 + 1)//2}} = 2\u221a{3} + 2"]}]},N17:{name:"Time, money & calculators",ex:[{type:"teach",title:"Working with time",text:"Time uses 60s, not 10s, so be careful with decimals of hours.",bullets:["2.5 hours = 2 hours 30 minutes. 2.25 hours = 2 hours 15 minutes.","24-hour clock: 3:40 pm is 15:40.","Count on in stages to find a duration."],we:{q:"A flight leaves at 22:45 and takes 7 hours 50 minutes. When does it land (same time zone)?",s:["22:45 + 7 hours = 05:45 the next day","05:45 + 50 minutes = 06:35"],a:"06:35 the next day"}},{type:"fill",q:"A film starts at 19:40 and lasts 2 hours 35 minutes. What time does it finish?",t:"@ : @",a:[22,15],hint:"Use the 24-hour clock.",work:["19:40 + 2 h = 21:40","21:40 + 35 min = 22:15"]},{type:"fill",q:"A train leaves at 08:52 and arrives at 11:17. How long is the journey?",t:"@ hours @ minutes",a:[2,25],work:["08:52 to 10:52 is 2 hours","10:52 to 11:17 is 25 minutes"]},{type:"fill",q:"City B is 5 hours ahead of City A. A call is made from City A at 21:30 local time. What time is it in City B?",t:"@ : @",a:[2,30],hint:"Use the 24-hour clock.",work:["21:30 + 5 hours = 26:30","26:30 \u2212 24:00 = 02:30 the next day"]},{type:"teach",title:"Currency",text:"Multiply by the rate to convert one way. Divide by it to convert back.",we:{q:"$1 = \u20ac0.92. Change $250 into euros.",s:["250 \xd7 0.92 = 230"],a:"\u20ac230"}},{type:"num",q:"$1 = \u20ac0.92. Change \u20ac184 into dollars.",a:200,unit:"$",work:["184 \xf7 0.92 = 200"]},{type:"teach",title:"Calculator skills",text:"A calculator does exactly what you type, so add brackets to keep the order right.",bullets:["{{12.4 \u2212 3.82//1.6\xb2}}: type (12.4 \u2212 3.82) \xf7 (1.6\xb2).","Write down the full display, then round.","Use the S\u21d4D key to switch between a fraction and a decimal."]},{type:"num",q:"Use a calculator to work out {{12.4 \u2212 3.82//1.6\xb2}}. Give your answer to 3 significant figures.",a:"3.35",work:["(12.4 \u2212 3.82) \xf7 (1.6\xb2)","= 8.58 \xf7 2.56 = 3.3515\u2026","\u2248 3.35"]},{type:"num",q:"Work out \u221a{5.2\xb2 + 3.1\xb2}. Give your answer to 3 significant figures.",a:"6.05",work:["5.2\xb2 + 3.1\xb2 = 27.04 + 9.61 = 36.65","\u221a{36.65} = 6.0539\u2026","\u2248 6.05"]}]}}),e.push({id:"alg",tab:"E2",title:"Algebra",units:[{code:"2.1\u20132.2",title:"Expressions",sub:"Simplifying, substituting, expanding and factorising",lessons:["A1","A2","A3"],guide:["Collect like terms: 3a + 5b \u2212 a + 2b = 2a + 7b. x and x\xb2 are not like terms.","When you substitute a negative number, use brackets: if a = \u22123, then a\xb2 = (\u22123)\xb2 = 9.","Expand a bracket by multiplying everything inside it. Watch the signs: \u22123(2x \u2212 5) = \u22126x + 15.","Double brackets: multiply every term in the first by every term in the second (a grid helps).","Factorise by taking out the highest common factor, numbers and letters. Expand to check.",{s:1,t:"x\xb2 + bx + c = (x + p)(x + q) where p \xd7 q = c and p + q = b."},{s:1,t:"Difference of two squares: a\xb2 \u2212 b\xb2 = (a + b)(a \u2212 b)."}]},{code:"2.2",s:1,title:"Completing the square",sub:"(x + p)\xb2 + q, turning points and solving",lessons:["A4"],guide:["Halve the x coefficient: x\xb2 + 6x \u2192 (x + 3)\xb2. Then take away 3\xb2 = 9.","x\xb2 + bx + c = (x + {{b//2}})\xb2 \u2212 ({{b//2}})\xb2 + c.","The turning point of y = (x + p)\xb2 + q is (\u2212p, q).","If the x\xb2 has a number in front, take it out of the first two terms first."]},{code:"2.3",s:1,title:"Algebraic fractions",sub:"Simplifying, adding and dividing",lessons:["A5"],guide:["Factorise the top and bottom first, then cancel whole brackets, never single terms.","Add and subtract with a common denominator, just like number fractions.","Divide by flipping the second fraction and multiplying."]},{code:"2.4",title:"Indices in algebra",sub:"The index laws with letters",lessons:["A6"],guide:["x\xb3 \xd7 x\u2075 = x\u2078. x\u2077 \xf7 x\xb2 = x\u2075. (x\xb3)\u2074 = x\xb9\xb2.","Deal with numbers and letters separately: (2x\xb3)\u2074 = 2\u2074 \xd7 x\xb9\xb2 = 16x\xb9\xb2.",{s:1,t:"Solve 9\u02e3 = 27 by writing both sides as powers of 3: 3\xb2\u02e3 = 3\xb3, so 2x = 3."}]},{code:"2.5",title:"Equations & formulas",sub:"Solving, forming and rearranging",lessons:["A7","A8","A9","A10"],guide:["Do the same thing to both sides. Get the x terms on the side with more of them.","With fractions, multiply every term by the denominator (or the lowest common multiple).","Change the subject by undoing operations in reverse order.","Simultaneous equations: make one letter's coefficients match, then add or subtract to remove it.",{s:1,t:"Linear and quadratic together: substitute the linear one into the quadratic."},{s:1,t:"Quadratic equations: rearrange to = 0 first, then factorise, use the formula or complete the square."},{s:1,t:"x = {{\u2212b \xb1 \u221a(b\xb2 \u2212 4ac)//2a}} is on the formula sheet."}]},{code:"2.6\u20132.7",title:"Inequalities & sequences",sub:"Number lines, integer solutions and nth terms",lessons:["A11","A12"],guide:["Solve inequalities like equations, but flip the sign if you multiply or divide by a negative.","Number lines: an open circle means not included (< or >), a filled circle means included (\u2264 or \u2265).","Linear nth term: dn + (first term \u2212 d), where d is the common difference.",{s:1,t:"Quadratic nth term: half the second difference is the number in front of n\xb2."},{s:1,t:"Geometric (exponential) sequences multiply by the same number: nth term = a \xd7 r\u207f\u207b\xb9."}]},{code:"2.8",s:1,title:"Proportion",sub:"Direct and inverse proportion",lessons:["A13"],guide:["y \u221d x means y = kx. y \u221d x\xb2 means y = kx\xb2. y \u221d {{1//x}} means y = {{k//x}}.","Use the values you are given to find k first, then write the full equation."]}]}),Object.assign(t,{A1:{name:"Algebra basics",ex:[{type:"teach",title:"Like terms",text:"Terms with exactly the same letters (and powers) are like terms. You can add and subtract them.",bullets:["3a + 5b \u2212 a + 2b = 2a + 7b","2x\xb2 + 3x \u2212 x\xb2 + 4x = x\xb2 + 7x: x\xb2 and x are different, so keep them apart.","An expression has no = sign. An equation has an = sign and can be solved. A formula links quantities, like A = \u03c0r\xb2."],we:{q:"Simplify 5x + 3y \u2212 2x \u2212 7y.",s:["x terms: 5x \u2212 2x = 3x","y terms: 3y \u2212 7y = \u22124y"],a:"3x \u2212 4y"}},{type:"expr",q:"Simplify 4x + 3y \u2212 x + 5y.",a:"3x+8y",form:"simp",work:["4x \u2212 x = 3x","3y + 5y = 8y","3x + 8y"]},{type:"expr",q:"Simplify 2a\xb2 + 3a \u2212 a\xb2 + 4a.",a:"a^2+7a",form:"simp",keys:["a","b","x\xb2","^","\u2212"],work:["2a\xb2 \u2212 a\xb2 = a\xb2","3a + 4a = 7a","a\xb2 + 7a"]},{type:"teach",title:"Multiplying terms",text:"Multiply the numbers, then the letters. Repeated letters become powers.",bullets:["3a \xd7 4b = 12ab","2x \xd7 5x = 10x\xb2","4x \xd7 3xy = 12x\xb2y","12ab \xf7 4a = 3b"]},{type:"expr",q:"Simplify 3x \xd7 4xy.",a:"12x^2*y",form:"simp",show:"12x\xb2y",work:["3 \xd7 4 = 12","x \xd7 x = x\xb2","12x\xb2y"]},{type:"teach",title:"Substitution",text:"Replace each letter with its value. Put negative numbers in brackets so the signs come out right.",we:{q:"Find 2a\xb2 \u2212 ab when a = \u22123 and b = 4.",s:["2 \xd7 (\u22123)\xb2 \u2212 (\u22123) \xd7 4","= 2 \xd7 9 \u2212 (\u221212)","= 18 + 12"],a:"30"},warn:"(\u22123)\xb2 = 9 because a negative times a negative is positive. Typing \u22123\xb2 into a calculator gives \u22129, which is wrong."},{type:"num",q:"Find the value of 3x\xb2 + xy when x = \u22122 and y = 5.",a:2,work:["3 \xd7 (\u22122)\xb2 + (\u22122)(5)","= 3 \xd7 4 \u2212 10","= 12 \u2212 10 = 2"]},{type:"num",q:"v = u + at. Find v when u = 4, a = \u22122 and t = 6.",a:-8,work:["v = 4 + (\u22122)(6)","= 4 \u2212 12 = \u22128"]},{type:"num",q:"E = {{1//2}}mv\xb2. Find E when m = 8 and v = 3.",a:36,work:["E = 0.5 \xd7 8 \xd7 3\xb2","= 4 \xd7 9 = 36"]},{type:"mc",q:"Which of these is an identity, true for every value of x?",options:["2(x + 3) \u2261 2x + 6","2x + 3 = 9","A = \u03c0r\xb2","3x + 1"],a:0,why:"An identity (\u2261) is true whatever x is. 2x + 3 = 9 is an equation (only x = 3 works), A = \u03c0r\xb2 is a formula and 3x + 1 is an expression."},{type:"expr",q:"A rectangle is (2x + 1) cm long and x cm wide. Write an expression for its perimeter, in its simplest form.",a:"6x+2",form:"simp",work:["Perimeter = 2(2x + 1) + 2x","= 4x + 2 + 2x","= 6x + 2"]}]},A2:{name:"Expanding brackets",ex:[{type:"teach",title:"One bracket",text:"Multiply the term outside by every term inside.",we:{q:"Expand \u22123(2x \u2212 5).",s:["\u22123 \xd7 2x = \u22126x","\u22123 \xd7 \u22125 = +15"],a:"\u22126x + 15"},warn:"A negative times a negative is positive: \u22123 \xd7 \u22125 = +15."},{type:"expr",q:"Expand 4(3x \u2212 2).",a:"12x-8",form:"exp",work:["4 \xd7 3x = 12x","4 \xd7 \u22122 = \u22128"]},{type:"expr",q:"Expand and simplify 3(x + 4) \u2212 2(x \u2212 1).",a:"x+14",form:"exp+simp",work:["3x + 12 \u2212 2x + 2","= x + 14"],why:"\u22122 \xd7 \u22121 = +2."},{type:"teach",title:"Two brackets",text:"Multiply every term in the first bracket by every term in the second. A grid keeps track.",table:[["\xd7","x","+3"],["x","x\xb2","+3x"],["\u22122","\u22122x","\u22126"]],we:{q:"Expand (x + 3)(x \u2212 2).",s:["From the grid: x\xb2 + 3x \u2212 2x \u2212 6","Collect the x terms: 3x \u2212 2x = x"],a:"x\xb2 + x \u2212 6"}},{type:"expr",q:"Expand and simplify (x + 5)(x + 2).",a:"x^2+7x+10",form:"exp",work:["x\xb2 + 2x + 5x + 10","= x\xb2 + 7x + 10"]},{type:"expr",q:"Expand and simplify (2x \u2212 3)(x + 4).",a:"2x^2+5x-12",form:"exp",work:["2x\xb2 + 8x \u2212 3x \u2212 12","= 2x\xb2 + 5x \u2212 12"]},{type:"expr",q:"Expand and simplify (x \u2212 4)\xb2.",a:"x^2-8x+16",form:"exp",work:["(x \u2212 4)(x \u2212 4)","= x\xb2 \u2212 4x \u2212 4x + 16","= x\xb2 \u2212 8x + 16"],why:"(x \u2212 4)\xb2 is not x\xb2 + 16: you must multiply out both brackets."},{type:"teach",s:1,title:"Three brackets",text:"Expand two of the brackets, then multiply the answer by the third.",we:{q:"Expand (x + 1)(x + 2)(x + 3).",s:["(x + 1)(x + 2) = x\xb2 + 3x + 2","(x\xb2 + 3x + 2)(x + 3) = x\xb3 + 3x\xb2 + 3x\xb2 + 9x + 2x + 6","Collect like terms"],a:"x\xb3 + 6x\xb2 + 11x + 6"}},{type:"expr",s:1,q:"Expand and simplify (x + 1)(x \u2212 2)(x + 3).",a:"x^3+2x^2-5x-6",form:"exp",work:["(x + 1)(x \u2212 2) = x\xb2 \u2212 x \u2212 2","(x\xb2 \u2212 x \u2212 2)(x + 3) = x\xb3 + 3x\xb2 \u2212 x\xb2 \u2212 3x \u2212 2x \u2212 6","= x\xb3 + 2x\xb2 \u2212 5x \u2212 6"]}]},A3:{name:"Factorising",ex:[{type:"teach",title:"Common factors",text:"Factorising is expanding in reverse. Take out the highest common factor of every term, numbers and letters.",we:{q:"Factorise fully 6x\xb2y + 9xy.",s:["Numbers: the HCF of 6 and 9 is 3.","Letters: both terms have x and y.","Take out 3xy: 6x\xb2y \xf7 3xy = 2x and 9xy \xf7 3xy = 3","Check by expanding: 3xy(2x + 3) = 6x\xb2y + 9xy \u2713"],a:"3xy(2x + 3)"},warn:'"Factorise fully" means nothing more can come out. 2(4x + 6) isn\'t fully factorised, because 4x + 6 still has a factor of 2.'},{type:"expr",q:"Factorise fully 8x + 12.",a:"4(2x+3)",form:"fact",work:["The HCF of 8 and 12 is 4.","4(2x + 3)"]},{type:"expr",q:"Factorise fully 6x\xb2y + 9xy.",a:"3x*y(2x+3)",form:"fact",show:"3xy(2x + 3)",work:["HCF: 3xy","3xy(2x + 3)"]},{type:"expr",q:"Factorise fully 5a\xb2b \u2212 10ab\xb2.",a:"5a*b(a-2b)",form:"fact",show:"5ab(a \u2212 2b)",keys:["a","b","(",")","\u2212"],work:["HCF: 5ab","5ab(a \u2212 2b)"]},{type:"teach",s:1,title:"Quadratics",text:"To factorise x\xb2 + bx + c, find two numbers that multiply to make c and add to make b.",we:[{q:"Factorise x\xb2 + 7x + 12.",s:["Multiply to 12, add to 7: 3 and 4","(x + 3)(x + 4)"],a:"(x + 3)(x + 4)"},{q:"Factorise x\xb2 \u2212 2x \u2212 15.",s:["Multiply to \u221215, add to \u22122: \u22125 and +3","(x \u2212 5)(x + 3)"],a:"(x \u2212 5)(x + 3)"}]},{type:"expr",s:1,q:"Factorise x\xb2 + 8x + 15.",a:"(x+3)(x+5)",form:"fact",work:["3 \xd7 5 = 15 and 3 + 5 = 8","(x + 3)(x + 5)"]},{type:"expr",s:1,q:"Factorise x\xb2 \u2212 x \u2212 12.",a:"(x-4)(x+3)",form:"fact",work:["\u22124 \xd7 3 = \u221212 and \u22124 + 3 = \u22121","(x \u2212 4)(x + 3)"]},{type:"teach",s:1,title:"Two special cases",text:"Spot these patterns and they factorise in one step.",bullets:["Difference of two squares: a\xb2 \u2212 b\xb2 = (a + b)(a \u2212 b). So x\xb2 \u2212 49 = (x + 7)(x \u2212 7) and 9x\xb2 \u2212 25 = (3x + 5)(3x \u2212 5).","When x\xb2 has a number in front, like 2x\xb2 + 7x + 3, find two numbers that multiply to a \xd7 c = 6 and add to 7: 6 and 1.","Split the middle: 2x\xb2 + 6x + x + 3 = 2x(x + 3) + 1(x + 3) = (2x + 1)(x + 3)."]},{type:"expr",s:1,q:"Factorise x\xb2 \u2212 49.",a:"(x+7)(x-7)",form:"fact",work:["x\xb2 \u2212 7\xb2","= (x + 7)(x \u2212 7)"]},{type:"expr",s:1,q:"Factorise 3x\xb2 + 10x \u2212 8.",a:"(3x-2)(x+4)",form:"fact",work:["a \xd7 c = 3 \xd7 \u22128 = \u221224","Multiply to \u221224, add to 10: 12 and \u22122","3x\xb2 + 12x \u2212 2x \u2212 8 = 3x(x + 4) \u2212 2(x + 4)","= (3x \u2212 2)(x + 4)"]}]},A4:{name:"Completing the square",s:1,ex:[{type:"teach",title:"The method",text:"Completing the square writes x\xb2 + bx + c as (x + p)\xb2 + q.",list:["Halve the number in front of x.","Write (x + half)\xb2.","Take away half squared, because the bracket adds it on.","Then add the number on the end."],we:{q:"Write x\xb2 + 6x + 2 in the form (x + p)\xb2 + q.",s:["Half of 6 is 3: (x + 3)\xb2","(x + 3)\xb2 = x\xb2 + 6x + 9, which is 9 too many: subtract 9","(x + 3)\xb2 \u2212 9 + 2"],a:"(x + 3)\xb2 \u2212 7"},warn:"Subtract the square, don't add it: x\xb2 + 6x = (x + 3)\xb2 \u2212 9, not + 9. Circle the minus sign every time."},{type:"fill",q:"Write x\xb2 + 4x + 1 in the form (x + p)\xb2 + q.",t:"(x + @)\xb2 + @",a:[2,-3],work:["Half of 4 is 2: (x + 2)\xb2 = x\xb2 + 4x + 4","Take away 4: (x + 2)\xb2 \u2212 4 + 1","= (x + 2)\xb2 \u2212 3"]},{type:"fill",q:"Write x\xb2 \u2212 10x + 7 in the form (x \u2212 p)\xb2 \u2212 q.",t:"(x \u2212 @)\xb2 \u2212 @",a:[5,18],work:["Half of \u221210 is \u22125: (x \u2212 5)\xb2 = x\xb2 \u2212 10x + 25","(x \u2212 5)\xb2 \u2212 25 + 7","= (x \u2212 5)\xb2 \u2212 18"]},{type:"fill",q:"Write x\xb2 + 3x \u2212 2 in the form (x + p)\xb2 \u2212 q.",t:"(x + @)\xb2 \u2212 @",a:[1.5,4.25],work:["Half of 3 is 1.5","1.5\xb2 = 1.5 \xd7 1.5 = 2.25","(x + 1.5)\xb2 \u2212 2.25 \u2212 2 = (x + 1.5)\xb2 \u2212 4.25"],why:"1.5\xb2 is 2.25, not 3. Write the multiplication out: 1.5 \xd7 1.5."},{type:"teach",title:"Turning points and solving",text:"The completed square tells you the minimum point, and lets you solve the equation exactly.",svg:{k:"graph",xmin:-7,xm:1,ymin:-8,ym:6,xs:1,ys:2,ph:180,lines:[{p:a(e=>(e+3)*(e+3)-7,-6.6,.6)}],marks:[[-3,-7,"(\u22123, \u22127)","r"]],alt:"Graph of y = (x + 3)\xb2 \u2212 7 with its minimum point"},bullets:["y = (x + 3)\xb2 \u2212 7 has its minimum at (\u22123, \u22127): the bracket is smallest (0) when x = \u22123."],we:{q:"Solve x\xb2 + 6x + 2 = 0, leaving your answer in surd form.",s:["(x + 3)\xb2 \u2212 7 = 0, so keep the = 0 on every line","(x + 3)\xb2 = 7","x + 3 = \xb1\u221a{7}: square roots can be positive or negative","x = \u22123 \xb1 \u221a{7}"],a:"x = \u22123 \xb1 \u221a{7}"}},{type:"fill",q:"Find the turning point of y = x\xb2 \u2212 8x + 3.",t:"(@ , @)",a:[4,-13],work:["x\xb2 \u2212 8x + 3 = (x \u2212 4)\xb2 \u2212 16 + 3","= (x \u2212 4)\xb2 \u2212 13","Turning point: (4, \u221213)"]},{type:"mc",q:"Solve x\xb2 + 6x \u2212 5 = 0 by completing the square. Which answer is correct?",options:["x = \u22123 \xb1 \u221a{14}","x = 3 \xb1 \u221a{14}","x = \u22123 \xb1 \u221a{4}","x = \u22126 \xb1 \u221a{14}"],a:0,why:"(x + 3)\xb2 \u2212 9 \u2212 5 = 0, so (x + 3)\xb2 = 14 and x = \u22123 \xb1 \u221a{14}."},{type:"fill",q:"Solve x\xb2 + 6x \u2212 5 = 0. Give both answers to 2 decimal places.",t:"x = @  or  x = @",a:["0.74","-6.74"],any:1,work:["x = \u22123 \xb1 \u221a{14}","\u221a{14} = 3.741\u2026","x = 0.74 or x = \u22126.74"]},{type:"teach",title:"When x\xb2 has a number in front",text:"Take the number out of the x\xb2 and x terms first, then complete the square inside the bracket.",we:{q:"Write 2x\xb2 + 8x + 3 in the form a(x + b)\xb2 + c.",s:["2(x\xb2 + 4x) + 3","2[(x + 2)\xb2 \u2212 4] + 3","2(x + 2)\xb2 \u2212 8 + 3"],a:"2(x + 2)\xb2 \u2212 5"}},{type:"fill",q:"Write 2x\xb2 + 8x + 3 in the form a(x + b)\xb2 \u2212 c.",t:"@(x + @)\xb2 \u2212 @",a:[2,2,5],work:["2(x\xb2 + 4x) + 3","= 2[(x + 2)\xb2 \u2212 4] + 3","= 2(x + 2)\xb2 \u2212 5"]},{type:"fill",q:"Write 3x\xb2 \u2212 12x + 5 in the form a(x \u2212 b)\xb2 \u2212 c.",t:"@(x \u2212 @)\xb2 \u2212 @",a:[3,2,7],work:["3(x\xb2 \u2212 4x) + 5","= 3[(x \u2212 2)\xb2 \u2212 4] + 5","= 3(x \u2212 2)\xb2 \u2212 12 + 5 = 3(x \u2212 2)\xb2 \u2212 7"]}]},A5:{name:"Algebraic fractions",s:1,ex:[{type:"teach",title:"Simplifying",text:"Factorise the top and the bottom completely, then cancel brackets that appear in both.",we:{q:"Simplify {{x\xb2 \u2212 9//x\xb2 + 5x + 6}}.",s:["Top: (x + 3)(x \u2212 3)","Bottom: (x + 2)(x + 3)","Cancel (x + 3)"],a:"{{x \u2212 3//x + 2}}"},warn:"You can only cancel factors (whole brackets), never terms. {{x + 3//x}} does not simplify to 3."},{type:"expr",q:"Simplify {{x\xb2 + 4x//x\xb2 \u2212 16}}.",a:"x/(x-4)",form:"short",show:"{{x//x \u2212 4}}",hint:"Type a fraction with brackets, like x/(x+2).",work:["Top: x(x + 4)","Bottom: (x + 4)(x \u2212 4)","Cancel (x + 4): {{x//x \u2212 4}}"]},{type:"expr",q:"Simplify {{2x\xb2 \u2212 8//x\xb2 + x \u2212 6}}.",a:"2(x+2)/(x+3)",form:"short",show:"{{2(x + 2)//x + 3}}",work:["Top: 2(x\xb2 \u2212 4) = 2(x + 2)(x \u2212 2)","Bottom: (x + 3)(x \u2212 2)","Cancel (x \u2212 2): {{2(x + 2)//x + 3}}"]},{type:"teach",title:"Adding and subtracting",text:"Use a common denominator, exactly as with number fractions. Multiplying the two denominators always works.",we:{q:"Write {{2//x}} + {{3//x + 1}} as a single fraction.",s:["Common denominator: x(x + 1)","{{2(x + 1)//x(x + 1)}} + {{3x//x(x + 1)}}","Top: 2x + 2 + 3x = 5x + 2"],a:"{{5x + 2//x(x + 1)}}"}},{type:"expr",q:"Write {{3//x + 2}} + {{1//x}} as a single fraction.",a:"(4x+2)/(x(x+2))",form:"short",show:"{{4x + 2//x(x + 2)}}",work:["Common denominator: x(x + 2)","Top: 3x + (x + 2) = 4x + 2","{{4x + 2//x(x + 2)}}"]},{type:"expr",q:"Write {{x + 1//3}} \u2212 {{x \u2212 2//4}} as a single fraction.",a:"(x+10)/12",form:"short",show:"{{x + 10//12}}",work:["Common denominator: 12","{{4(x + 1) \u2212 3(x \u2212 2)//12}}","Top: 4x + 4 \u2212 3x + 6 = x + 10"],why:"Put the second top in a bracket: \u22123(x \u2212 2) = \u22123x + 6."},{type:"teach",title:"Multiplying and dividing",text:"Factorise, multiply across (or flip and multiply for dividing), then cancel.",we:{q:"Simplify {{2x//3}} \xd7 {{9//4x\xb2}}.",s:["Multiply across: {{18x//12x\xb2}}","Cancel 6x from top and bottom"],a:"{{3//2x}}"}},{type:"expr",q:"Simplify {{x\xb2 \u2212 1//x}} \xf7 {{x + 1//x\xb2}}.",a:"x(x-1)",form:"short",show:"x(x \u2212 1)",work:["Flip and multiply: {{(x + 1)(x \u2212 1)//x}} \xd7 {{x\xb2//x + 1}}","Cancel (x + 1) and x","= x(x \u2212 1)"]}]},A6:{name:"Indices in algebra",ex:[{type:"teach",title:"The laws with letters",text:"Use the same index laws as with numbers. Deal with the numbers and each letter separately.",table:[["Example","Answer","Why"],["x\xb3 \xd7 x\u2075","x\u2078","add the powers"],["12x\u2076 \xf7 3x\xb2","4x\u2074","12 \xf7 3 and 6 \u2212 2"],["(2x\xb3)\u2074","16x\xb9\xb2","2\u2074 = 16 and 3 \xd7 4 = 12"],["x\u2070","1","anything to the power 0"]],warn:"In (2x\xb3)\u2074 the 2 is raised to the power 4 as well: 2\u2074 = 16, not 8."},{type:"expr",q:"Simplify (3x\xb2y)\xb3.",a:"27x^6*y^3",form:"exp",show:"27x\u2076y\xb3",work:["3\xb3 = 27","(x\xb2)\xb3 = x\u2076 and y\xb3","27x\u2076y\xb3"]},{type:"expr",q:"Simplify 10a\u2077b\xb3 \xf7 2a\xb2b.",a:"5a^5*b^2",form:"exp",show:"5a\u2075b\xb2",keys:["a","b","^","\xb2"],work:["10 \xf7 2 = 5","a\u2077 \xf7 a\xb2 = a\u2075","b\xb3 \xf7 b = b\xb2"]},{type:"expr",q:"Simplify x\u2075 \xd7 x\u207b\xb2.",a:"x^3",form:"exp",show:"x\xb3",work:["5 + (\u22122) = 3","x\xb3"]},{type:"teach",s:1,title:"Negative and fractional powers",text:"The same rules work for letters.",bullets:["x\u207b\xb2 = {{1//x\xb2}}","(16x\u2078)^{{{1//2}}} = \u221a{16} \xd7 x\u2074 = 4x\u2074","(27x\u2076)^{\u2212{{1//3}}} = {{1//3x\xb2}}"]},{type:"expr",s:1,q:"Simplify (16x\u2078)^{{{1//2}}}.",a:"4x^4",form:"exp",show:"4x\u2074",pos:1,work:["\u221a{16} = 4","x\u2078 \xd7 {{1//2}} = x\u2074","4x\u2074"]},{type:"expr",s:1,q:"Simplify (8x\u2076)^{{{2//3}}}.",a:"4x^4",form:"exp",show:"4x\u2074",pos:1,work:["\u221b{8} = 2, then 2\xb2 = 4","6 \xd7 {{2//3}} = 4","4x\u2074"]},{type:"teach",s:1,title:"Solving index equations",text:"Write both sides as powers of the same number, then the powers must be equal.",we:[{q:"Solve 9\u02e3 = 27.",s:["9 = 3\xb2 and 27 = 3\xb3","3\xb2\u02e3 = 3\xb3","2x = 3"],a:"x = 1.5"},{q:"Solve 4\u02e3\u207a\xb9 = 8.",s:["4 = 2\xb2 and 8 = 2\xb3","2\xb2\u207d\u02e3\u207a\xb9\u207e = 2\xb3","2x + 2 = 3"],a:"x = 0.5"}]},{type:"num",s:1,q:"Solve 3\u02e3 = 81.",a:4,work:["81 = 3\u2074","x = 4"]},{type:"num",s:1,q:"Solve 4\u02e3 = 32.",a:2.5,work:["4\u02e3 = 2\xb2\u02e3 and 32 = 2\u2075","2x = 5, so x = 2.5"]},{type:"num",s:1,q:"Solve 2\u02e3\u207b\xb9 = {{1//8}}.",a:-2,work:["{{1//8}} = 2\u207b\xb3","x \u2212 1 = \u22123","x = \u22122"]}]},A7:{name:"Linear equations",ex:[{type:"teach",title:"Balancing",text:"An equation is a balance. Whatever you do to one side, do to the other, until x is on its own.",we:{q:"Solve 5x \u2212 7 = 3x + 9.",s:["Take 3x from both sides: 2x \u2212 7 = 9","Add 7 to both sides: 2x = 16","Divide by 2"],a:"x = 8"},warn:"Check by substituting back: 5(8) \u2212 7 = 33 and 3(8) + 9 = 33 \u2713"},{type:"num",q:"Solve 3x + 7 = 22.",a:5,hint:"Just type the number, or x = 5.",work:["3x = 15","x = 5"]},{type:"num",q:"Solve 4(2x \u2212 3) = 20.",a:4,work:["8x \u2212 12 = 20","8x = 32","x = 4"]},{type:"num",q:"Solve 7 \u2212 2x = 3x + 22.",a:-3,work:["7 = 5x + 22","\u221215 = 5x","x = \u22123"]},{type:"teach",title:"Equations with fractions",text:"Multiply every term by the denominator to clear the fractions. With two denominators, use their lowest common multiple.",we:{q:"Solve {{2x \u2212 1//3}} \u2212 {{x + 2//4}} = 1.",s:["\xd7 12: 4(2x \u2212 1) \u2212 3(x + 2) = 12","8x \u2212 4 \u2212 3x \u2212 6 = 12","5x \u2212 10 = 12, so 5x = 22"],a:"x = 4.4"}},{type:"num",q:"Solve {{x \u2212 2//5}} = 3.",a:17,work:["x \u2212 2 = 15","x = 17"]},{type:"num",q:"Solve {{x//2}} + {{x//3}} = 10.",a:12,work:["\xd7 6: 3x + 2x = 60","5x = 60","x = 12"]},{type:"num",s:1,q:"Solve {{3//x + 1}} = {{2//x \u2212 3}}.",a:11,work:["Cross-multiply: 3(x \u2212 3) = 2(x + 1)","3x \u2212 9 = 2x + 2","x = 11"]},{type:"num",q:"The angles of a triangle are x\xb0, 2x\xb0 and (3x + 30)\xb0. Find x.",svg:{k:"fig",P:{A:[0,0],B:[6,0],C:[1.6,3.2]},poly:["ABC"],angs:[["CAB","x"],["ABC","2x"],["BCA","3x + 30"]],names:!1},a:25,work:["x + 2x + 3x + 30 = 180","6x = 150","x = 25"]}]},A8:{name:"Forming & rearranging",ex:[{type:"teach",title:"Forming equations",text:"Turn the words into algebra, then solve. Use a letter for the unknown and say what it stands for.",we:{q:"I think of a number, double it and add 7. The answer is 31. What was my number?",s:["Let the number be n: 2n + 7 = 31","2n = 24"],a:"n = 12"}},{type:"num",q:"Sam is x years old. His sister is 4 years older than him, and his dad is three times Sam's age. Their ages add up to 69. How old is Sam?",a:13,unit:"years",work:["x + (x + 4) + 3x = 69","5x + 4 = 69","5x = 65, so x = 13"]},{type:"teach",title:"Changing the subject",text:"Rearrange a formula by undoing what has been done to the letter you want, in reverse order.",we:[{q:"Make u the subject of v = u + at.",s:["Take at from both sides"],a:"u = v \u2212 at"},{q:"Make r the subject of A = \u03c0r\xb2.",s:["Divide by \u03c0: r\xb2 = {{A//\u03c0}}","Square root both sides"],a:"r = \u221a{{{A//\u03c0}}}"}]},{type:"expr",q:"Make x the subject of y = 3x \u2212 5.",a:"(y+5)/3",pre:"x =",show:"{{y + 5//3}}",work:["y + 5 = 3x","x = {{y + 5//3}}"]},{type:"expr",q:"Make t the subject of v = u + at.",a:"(v-u)/a",pre:"t =",show:"{{v \u2212 u//a}}",keys:["v","u","a","(",")","/","\u2212"],work:["v \u2212 u = at","t = {{v \u2212 u//a}}"]},{type:"expr",q:"Make r the subject of A = \u03c0r\xb2.",a:"sqrt(A/\u03c0)",pre:"r =",show:"\u221a{{{A//\u03c0}}}",pos:1,keys:["A","\u03c0","\u221a","(",")","/"],work:["r\xb2 = {{A//\u03c0}}","r = \u221a{{{A//\u03c0}}}"]},{type:"teach",s:1,title:"When the subject appears twice",text:"Get every term with the subject on one side, factorise it out, then divide.",we:{q:"Make x the subject of y = {{x + 2//x \u2212 3}}.",s:["Multiply out: y(x \u2212 3) = x + 2, so xy \u2212 3y = x + 2","x terms on one side: xy \u2212 x = 3y + 2","Factorise: x(y \u2212 1) = 3y + 2"],a:"x = {{3y + 2//y \u2212 1}}"}},{type:"expr",s:1,q:"Make x the subject of ax + b = cx + d.",a:"(d-b)/(a-c)",pre:"x =",show:"{{d \u2212 b//a \u2212 c}}",keys:["a","b","c","d","(",")","/","\u2212"],work:["ax \u2212 cx = d \u2212 b","x(a \u2212 c) = d \u2212 b","x = {{d \u2212 b//a \u2212 c}}"]},{type:"expr",s:1,q:"Make x the subject of y = {{x + 2//x \u2212 3}}.",a:"(3y+2)/(y-1)",pre:"x =",show:"{{3y + 2//y \u2212 1}}",work:["xy \u2212 3y = x + 2","xy \u2212 x = 3y + 2","x(y \u2212 1) = 3y + 2","x = {{3y + 2//y \u2212 1}}"]}]},A9:{name:"Simultaneous equations",ex:[{type:"teach",title:"Elimination",text:"Two equations, two unknowns. Make the coefficients of one letter match, then add or subtract to get rid of it.",list:["Same signs: subtract. Different signs: add.","Solve for the letter that's left.","Substitute back into either equation to find the other letter.","Check in the other equation."],we:{q:"Solve 3x + 2y = 16 and x \u2212 2y = 0.",s:["+2y and \u22122y have different signs: add","4x = 16, so x = 4","4 \u2212 2y = 0, so y = 2","Check: 3(4) + 2(2) = 16 \u2713"],a:"x = 4, y = 2"}},{type:"fill",q:"Solve 2x + y = 11 and x \u2212 y = 1.",t:"x = @ ,  y = @",a:[4,3],work:["Add: 3x = 12, so x = 4","4 \u2212 y = 1, so y = 3"]},{type:"fill",q:"Solve 3x + 2y = 12 and 5x + 2y = 16.",t:"x = @ ,  y = @",a:[2,3],work:["Subtract: 2x = 4, so x = 2","6 + 2y = 12, so y = 3"]},{type:"fill",q:"Solve 4x + 3y = 25 and 2x \u2212 5y = \u22127.",t:"x = @ ,  y = @",a:[4,3],work:["Double the second: 4x \u2212 10y = \u221214","Subtract: 13y = 39, so y = 3","4x + 9 = 25, so x = 4"]},{type:"teach",title:"Word problems",text:"Choose a letter for each unknown, write two equations, then solve.",we:{q:"2 adult tickets and 3 child tickets cost $31. 1 adult and 4 child tickets cost $28. Find the price of each.",s:["2a + 3c = 31 and a + 4c = 28","Double the second: 2a + 8c = 56","Subtract: 5c = 25, so c = 5","a + 20 = 28, so a = 8"],a:"Adult $8, child $5"}},{type:"fill",q:"3 pens and 2 rulers cost $4.30. 1 pen and 2 rulers cost $2.10. Find the cost of each.",t:"pen $@ ,  ruler $@",a:["1.10","0.50"],work:["3p + 2r = 4.30 and p + 2r = 2.10","Subtract: 2p = 2.20, so p = 1.10","1.10 + 2r = 2.10, so r = 0.50"]},{type:"teach",s:1,title:"One linear, one quadratic",text:"Substitute the linear equation into the quadratic one. You get a quadratic equation with two solutions, so there are two pairs of answers.",we:{q:"Solve y = x + 1 and y = x\xb2 \u2212 5.",s:["x\xb2 \u2212 5 = x + 1","x\xb2 \u2212 x \u2212 6 = 0","(x \u2212 3)(x + 2) = 0, so x = 3 or x = \u22122","y = x + 1 gives y = 4 or y = \u22121"],a:"(3, 4) and (\u22122, \u22121)"}},{type:"list",s:1,q:"Solve y = 2x \u2212 1 and y = x\xb2 \u2212 4. Give the two values of x.",a:[3,-1],work:["x\xb2 \u2212 4 = 2x \u2212 1","x\xb2 \u2212 2x \u2212 3 = 0","(x \u2212 3)(x + 1) = 0","x = 3 or x = \u22121"]},{type:"num",s:1,q:"Using the same equations (y = 2x \u2212 1 and y = x\xb2 \u2212 4), find y when x = 3.",a:5,work:["y = 2(3) \u2212 1 = 5"]}]},A10:{name:"Quadratic equations",s:1,ex:[{type:"teach",title:"Solving by factorising",text:"Rearrange so one side is 0, factorise, then each bracket could be 0.",we:{q:"Solve x\xb2 \u2212 5x + 6 = 0.",s:["(x \u2212 2)(x \u2212 3) = 0","x \u2212 2 = 0 or x \u2212 3 = 0"],a:"x = 2 or x = 3"},warn:'Write "= 0" on every line. The method only works because something times something equals zero.'},{type:"list",q:"Solve x\xb2 + 2x \u2212 15 = 0.",a:[-5,3],work:["(x + 5)(x \u2212 3) = 0","x = \u22125 or x = 3"]},{type:"list",q:"Solve x\xb2 = 7x.",a:[0,7],work:["x\xb2 \u2212 7x = 0","x(x \u2212 7) = 0","x = 0 or x = 7"],why:"Don't divide both sides by x: you would lose the answer x = 0."},{type:"list",q:"Solve 2x\xb2 + 5x \u2212 3 = 0.",a:[.5,-3],work:["(2x \u2212 1)(x + 3) = 0","2x \u2212 1 = 0 gives x = 0.5","x + 3 = 0 gives x = \u22123"]},{type:"teach",title:"The quadratic formula",text:"When it won't factorise, use the formula. It is on the formula sheet, but you need to substitute carefully.",eq:"x = {{\u2212b \xb1 \u221a(b\xb2 \u2212 4ac)//2a}}",we:{q:"Solve 2x\xb2 \u2212 3x \u2212 4 = 0, to 2 decimal places.",s:["a = 2, b = \u22123, c = \u22124","b\xb2 \u2212 4ac = 9 \u2212 4(2)(\u22124) = 9 + 32 = 41","x = {{3 \xb1 \u221a41//4}}","x = 2.35 or x = \u22120.85"],a:"x = 2.35 or x = \u22120.85"},warn:"If b is negative, \u2212b is positive, and b\xb2 is always positive: (\u22123)\xb2 = 9."},{type:"fill",q:"Solve 3x\xb2 + 4x \u2212 2 = 0. Give your answers to 2 decimal places.",t:"x = @  or  x = @",a:["0.39","-1.72"],any:1,work:["a = 3, b = 4, c = \u22122","b\xb2 \u2212 4ac = 16 + 24 = 40","x = {{\u22124 \xb1 \u221a40//6}}","x = 0.39 or x = \u22121.72"]},{type:"fill",q:"Solve x\xb2 \u2212 6x + 4 = 0. Give your answers to 2 decimal places.",t:"x = @  or  x = @",a:["5.24","0.76"],any:1,work:["b\xb2 \u2212 4ac = 36 \u2212 16 = 20","x = {{6 \xb1 \u221a20//2}} = 3 \xb1 \u221a{5}","x = 5.24 or x = 0.76"]},{type:"num",q:"A rectangle is (x + 3) cm long and x cm wide. Its area is 40 cm\xb2. Find x.",a:5,work:["x(x + 3) = 40","x\xb2 + 3x \u2212 40 = 0","(x + 8)(x \u2212 5) = 0","x = 5 (a length can't be \u22128)"]}]},A11:{name:"Inequalities",ex:[{type:"teach",title:"Inequalities on a number line",text:"An open circle means the number is not included. A filled circle means it is.",svg:{k:"numline",min:-3,max:5,items:[{a:-1,ao:!0,b:3}]},bullets:["< less than, \u2264 less than or equal to","> greater than, \u2265 greater than or equal to","The diagram shows \u22121 < x \u2264 3."]},{type:"mc",q:"Which inequality is shown?",svg:{k:"numline",min:-4,max:4,items:[{a:-2}]},options:["x \u2265 \u22122","x > \u22122","x \u2264 \u22122","x < \u22122"],a:0,why:"A filled circle means \u22122 is included, and the arrow goes right (bigger numbers)."},{type:"mc",q:"Which inequality is shown?",svg:{k:"numline",min:-3,max:5,items:[{a:0,b:4,bo:!0}]},options:["0 \u2264 x < 4","0 < x \u2264 4","0 \u2264 x \u2264 4","0 < x < 4"],a:0,why:"Filled at 0 (included) and open at 4 (not included)."},{type:"teach",title:"Solving",text:"Solve like an equation. The only difference: if you multiply or divide by a negative number, flip the sign.",we:[{q:"Solve 7 \u2212 2x \u2265 1.",s:["\u22122x \u2265 \u22126","Divide by \u22122 and flip: x \u2264 3"],a:"x \u2264 3"},{q:"Solve \u22124 < 3x + 2 \u2264 11.",s:["Do the same to all three parts: \u22126 < 3x \u2264 9","\xf7 3: \u22122 < x \u2264 3"],a:"\u22122 < x \u2264 3"}]},{type:"mc",q:"Solve 3x \u2212 5 < 10.",options:["x < 5","x > 5","x < 15","x \u2264 5"],a:0,why:"3x < 15, so x < 5."},{type:"mc",q:"Solve 7 \u2212 2x \u2265 1.",options:["x \u2264 3","x \u2265 3","x \u2264 \u22123","x \u2265 \u22123"],a:0,why:"\u22122x \u2265 \u22126. Dividing by \u22122 flips the sign: x \u2264 3."},{type:"list",q:"List the integers n that satisfy \u22122 \u2264 n < 3.",a:[-2,-1,0,1,2],work:["\u22122 is included (\u2264) but 3 is not (<)","\u22122, \u22121, 0, 1, 2"]},{type:"list",q:"List the integers n that satisfy \u22123 < 2n + 1 \u2264 7.",a:[-1,0,1,2,3],work:["\u22124 < 2n \u2264 6","\u22122 < n \u2264 3","\u22121, 0, 1, 2, 3"]},{type:"num",q:"Find the largest integer x such that 4x + 3 < 25.",a:5,work:["4x < 22","x < 5.5","The largest integer is 5"]}]},A12:{name:"Sequences",ex:[{type:"teach",title:"The nth term of a linear sequence",text:"A linear sequence goes up (or down) by the same amount each time. That amount goes in front of n.",list:["Find the common difference d.","Write dn.","Compare dn with the sequence to find the number to add."],we:{q:"Find the nth term of 5, 8, 11, 14, \u2026",s:["The difference is 3: 3n","3n gives 3, 6, 9, 12","Each term is 2 more than 3n"],a:"3n + 2"}},{type:"expr",q:"Find the nth term of 7, 11, 15, 19, \u2026",a:"4n+3",keys:["n","+","\u2212"],work:["Difference 4: 4n gives 4, 8, 12, 16","Add 3: 4n + 3"]},{type:"expr",q:"Find the nth term of 20, 17, 14, 11, \u2026",a:"23-3n",keys:["n","+","\u2212"],work:["Difference \u22123: \u22123n gives \u22123, \u22126, \u22129","Add 23: 23 \u2212 3n"]},{type:"num",q:"The nth term of a sequence is 3n \u2212 1. Find the 50th term.",a:149,work:["3(50) \u2212 1 = 149"]},{type:"mc",q:"Is 100 a term in the sequence with nth term 4n + 1?",options:["No, because 4n = 99 gives n = 24.75, which is not a whole number","Yes, it is the 25th term","Yes, it is the 24th term","No, because the sequence goes down"],a:0,why:"Solve 4n + 1 = 100: n = 24.75. Term numbers must be whole numbers."},{type:"teach",title:"Special sequences",text:"Learn these patterns, and look for them inside other sequences.",table:[["Sequence","Terms","nth term"],["Square numbers","1, 4, 9, 16\u2026","n\xb2"],["Cube numbers","1, 8, 27, 64\u2026","n\xb3"],["Triangular numbers","1, 3, 6, 10\u2026","{{n(n + 1)//2}}"],["Powers of 2","2, 4, 8, 16\u2026","2\u207f"]],we:{q:"Find the nth term of 3, 6, 11, 18, \u2026",s:["Compare with n\xb2: 1, 4, 9, 16","Each term is 2 more"],a:"n\xb2 + 2"}},{type:"expr",q:"Find the nth term of 0, 3, 8, 15, 24, \u2026",a:"n^2-1",keys:["n","x\xb2","^","\u2212"],work:["n\xb2: 1, 4, 9, 16, 25","Each term is 1 less: n\xb2 \u2212 1"]},{type:"teach",s:1,title:"Quadratic sequences",text:"If the second differences are the same, the nth term is an\xb2 + bn + c, and a is half the second difference.",we:{q:"Find the nth term of 4, 9, 18, 31, 48, \u2026",s:["First differences: 5, 9, 13, 17. Second differences: 4, so a = 2","Take away 2n\xb2 (2, 8, 18, 32, 50): left with 2, 1, 0, \u22121, \u22122","That is \u2212n + 3"],a:"2n\xb2 \u2212 n + 3"}},{type:"expr",s:1,q:"Find the nth term of 2, 7, 14, 23, 34, \u2026",a:"n^2+2n-1",keys:["n","x\xb2","^","+","\u2212"],work:["Second difference 2, so n\xb2","Take away n\xb2: 1, 3, 5, 7, 9","That is 2n \u2212 1, so n\xb2 + 2n \u2212 1"]},{type:"expr",s:1,q:"Find the nth term of 5, 15, 45, 135, \u2026",a:"5*3^(n-1)",keys:["n","^","(",")","\xd7","\u2212"],show:"5 \xd7 3\u207f\u207b\xb9",work:["Each term is \xd7 3: geometric","First term 5, ratio 3","5 \xd7 3\u207f\u207b\xb9"]},{type:"expr",s:1,q:"Find the nth term of 2, 9, 28, 65, \u2026",a:"n^3+1",keys:["n","^","\xb3","+"],work:["Cubes: 1, 8, 27, 64","Add 1: n\xb3 + 1"]}]},A13:{name:"Direct & inverse proportion",s:1,ex:[{type:"teach",title:"Writing the equation",text:"Turn the proportion into an equation with a constant k, find k, then use the equation.",table:[["In words","Equation"],["y is proportional to x","y = kx"],["y is proportional to the square of x","y = kx\xb2"],["y is proportional to the square root of x","y = k\u221a{x}"],["y is inversely proportional to x","y = {{k//x}}"],["y is inversely proportional to x\xb2","y = {{k//x\xb2}}"]],we:{q:"y is proportional to x\xb2. y = 18 when x = 3. Find y when x = 5.",s:["y = kx\xb2","18 = k \xd7 9, so k = 2","y = 2x\xb2","y = 2 \xd7 25"],a:"y = 50"}},{type:"num",q:"y is directly proportional to x. y = 12 when x = 4. Find y when x = 10.",a:30,work:["y = kx, so 12 = 4k and k = 3","y = 3 \xd7 10 = 30"]},{type:"num",q:"y is inversely proportional to x. y = 6 when x = 4. Find y when x = 3.",a:8,work:["y = {{k//x}}, so 6 = {{k//4}} and k = 24","y = {{24//3}} = 8"]},{type:"expr",q:"y is inversely proportional to x\xb2. y = 5 when x = 2. Find a formula for y in terms of x.",a:"20/x^2",pre:"y =",show:"{{20//x\xb2}}",work:["y = {{k//x\xb2}}","5 = {{k//4}}, so k = 20","y = {{20//x\xb2}}"]},{type:"num",q:"y is proportional to \u221a{x}. y = 12 when x = 9. Find x when y = 20.",a:25,work:["y = k\u221a{x}, so 12 = 3k and k = 4","20 = 4\u221a{x}, so \u221a{x} = 5","x = 25"]},{type:"num",q:"The time to build a wall is inversely proportional to the number of workers. 6 workers take 10 days. How long do 4 workers take?",a:15,unit:"days",work:["t = {{k//w}}, so k = 6 \xd7 10 = 60","t = {{60//4}} = 15 days"]},{type:"mc",q:"Which graph shows that y is directly proportional to x?",options:["A straight line through the origin","A straight line that crosses the y-axis above 0","A curve that gets closer and closer to the x-axis","A U-shaped curve"],a:0,why:"y = kx is a straight line with gradient k that passes through (0, 0)."}]}});const n={k:"graph",x:"time (hours)",y:"distance (km)",xm:5,ym:70,xs:1,ys:10,lines:[{p:[[0,0],[2,60],[3,60],[4.5,0]]}],alt:"Distance\u2013time graph of a journey"},s={k:"graph",x:"time (s)",y:"speed (m/s)",xm:40,ym:25,xs:10,ys:5,lines:[{p:[[0,0],[10,20],[30,20],[40,0]]}],area:[[0,0],[10,20],[30,20],[40,0]],alt:"Speed\u2013time graph"},i={k:"graph",xmin:-2,xm:4,ymin:-5,ym:6,xs:1,ys:1,ph:200,lines:[{p:a(e=>e*e-2*e-3,-2,4)}],alt:"Graph of y = x\xb2 \u2212 2x \u2212 3"};e.push({id:"gra",tab:"E2\u20133",title:"Graphs",units:[{code:"3.1\u20133.3",title:"Straight lines",sub:"Coordinates, gradient and y = mx + c",lessons:["G1","G2"],guide:["Gradient = {{change in y//change in x}} = {{y\u2082 \u2212 y\u2081//x\u2082 \u2212 x\u2081}}. Uphill is positive, downhill negative, flat is 0.","y = mx + c: m is the gradient and c is where the line crosses the y-axis.","Rearrange to y = \u2026 before reading off the gradient: 2y = 6x + 8 becomes y = 3x + 4.","To find a line through two points: find m, then substitute one point to find c."]},{code:"3.4\u20133.7",title:"Parallel & perpendicular lines",sub:"Lengths, midpoints and gradients of lines",lessons:["G3"],guide:["Parallel lines have the same gradient.",{s:1,t:"Midpoint: ({{x\u2081 + x\u2082//2}}, {{y\u2081 + y\u2082//2}}). Length: \u221a{(x\u2082 \u2212 x\u2081)\xb2 + (y\u2082 \u2212 y\u2081)\xb2}."},{s:1,t:"Perpendicular gradients multiply to \u22121: if one is m, the other is \u2212{{1//m}}."}]},{code:"2.9",title:"Real-life graphs",sub:"Travel graphs and conversion graphs",lessons:["G4"],guide:["Distance\u2013time graph: the gradient is the speed. A flat section means stopped.","Speed\u2013time graph: the area underneath is the distance travelled.",{s:1,t:"The gradient of a speed\u2013time graph is the acceleration. Going down means decelerating."}]},{code:"2.10\u20132.11",title:"Graphs of functions",sub:"Quadratics, cubics, reciprocals and exponentials",lessons:["G5","G6","G7","G8"],guide:["Quadratic y = ax\xb2 + bx + c: a U shape if a > 0, an upside-down U if a < 0. It crosses the y-axis at c.","The roots are where the graph crosses the x-axis (y = 0). The line of symmetry is halfway between them.","Reciprocal y = {{k//x}}: two curves that never touch the axes. Exponential y = a\u02e3: passes through (0, 1).","To solve f(x) = k with a graph, draw y = k and read the x-values where it meets the curve.",{s:1,t:"Inequality regions: solid line for \u2264 or \u2265, dashed for < or >. Test a point such as (0, 0) to pick the side."}]},{code:"2.12",s:1,title:"Differentiation",sub:"Gradients of curves and turning points",lessons:["G9","G10"],guide:["Th
