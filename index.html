e gradient of a curve at a point is the gradient of the tangent there.","If y = ax\u207f, then {{dy//dx}} = nax\u207f\u207b\xb9. A constant on its own differentiates to 0.","Turning (stationary) points have {{dy//dx}} = 0.","If {{d\xb2y//dx\xb2}} > 0 it is a minimum; if {{d\xb2y//dx\xb2}} < 0 it is a maximum."]},{code:"2.13",s:1,title:"Functions",sub:"Notation, composite and inverse functions",lessons:["G11"],guide:["f(3) means substitute x = 3 into f(x).","fg(x) means do g first, then f.","To find f\u207b\xb9(x): write y = f(x), swap x and y, then make y the subject."]}]}),Object.assign(t,{G1:{name:"Coordinates & gradient",ex:[{type:"teach",title:"Gradient",text:"The gradient measures how steep a line is: how far it goes up for every 1 across.",eq:"gradient = {{change in y//change in x}}",svg:{k:"graph",xmin:-1,xm:6,ymin:-1,ym:12,xs:1,ys:2,ph:190,lines:[{p:[[-.3,-1.9],[5,14]]},{p:[[1,2],[4,2],[4,11]],c:"gdr"}],marks:[[1,2,"A(1, 2)","l"],[4,11,"B(4, 11)","l"]],labels:[[2.5,1,"across 3"],[4.6,6.5,"up 9","start"]],alt:"A line through A(1, 2) and B(4, 11)"},we:{q:"Find the gradient of the line through A(1, 2) and B(4, 11).",s:["Change in y: 11 \u2212 2 = 9","Change in x: 4 \u2212 1 = 3","9 \xf7 3 = 3"],a:"3"},bullets:["Positive gradient: uphill. Negative: downhill. A horizontal line has gradient 0."]},{type:"num",q:"Find the gradient of the line through (2, 5) and (6, 13).",a:2,work:["{{13 \u2212 5//6 \u2212 2}} = {{8//4}} = 2"]},{type:"num",q:"Find the gradient of the line through (\u22121, 4) and (3, \u22124).",a:-2,work:["{{\u22124 \u2212 4//3 \u2212 (\u22121)}} = {{\u22128//4}} = \u22122"]},{type:"num",q:"Find the gradient of the line.",svg:{k:"graph",xmin:-1,xm:5,ymin:-3,ym:3,xs:1,ys:1,eq:1,lines:[{p:[[-1,1.5],[5,-1.5]]}],marks:[[0,1,""],[4,-1,""]]},a:-.5,work:["It passes through (0, 1) and (4, \u22121).","{{\u22121 \u2212 1//4 \u2212 0}} = {{\u22122//4}} = \u22120.5"]},{type:"mc",q:"What is the gradient of a horizontal line?",options:["0","1","It has no gradient","\u22121"],a:0,why:"Moving along a horizontal line, y doesn't change at all, so the change in y is 0."},{type:"mc",q:"Which line is the steepest?",options:["y = \u22125x + 2","y = 3x + 1","y = 0.5x","y = 4"],a:0,why:"Steepness depends on the size of the gradient: 5 is bigger than 3, 0.5 and 0. The minus sign only says it goes downhill."},{type:"fill",q:"Find the coordinates of the point where the line y = 2x \u2212 6 crosses the x-axis.",t:"( @ , @ )",a:[3,0],work:["On the x-axis, y = 0","0 = 2x \u2212 6, so x = 3","(3, 0)"]}]},G2:{name:"y = mx + c",ex:[{type:"teach",title:"Gradient and intercept",text:"Every straight line can be written as y = mx + c.",svg:{k:"graph",xmin:-3,xm:3,ymin:-3,ym:7,xs:1,ys:1,ph:190,lines:[{p:[[-2.5,-4],[3,7]],lab:"y = 2x + 1",at:[2.4,5.8]}],marks:[[0,1,"(0, 1)","r"]],alt:"Graph of y = 2x + 1"},bullets:["m is the gradient: here every 1 across goes 2 up.","c is the y-intercept: here the line crosses the y-axis at (0, 1)."],we:{q:"Write the equation of the line with gradient 4 that crosses the y-axis at (0, \u22123).",s:["m = 4 and c = \u22123"],a:"y = 4x \u2212 3"}},{type:"fill",q:"For the line y = 5x \u2212 7, write down the gradient and the y-intercept.",t:"gradient @   y-intercept @",a:[5,-7]},{type:"teach",title:"Rearrange first",text:"You can only read m and c when the equation starts y = \u2026",we:[{q:"Find the gradient of 2y = 6x + 8.",s:["Divide everything by 2: y = 3x + 4"],a:"3"},{q:"Find the gradient of 3x + 2y = 12.",s:["2y = \u22123x + 12","y = \u22121.5x + 6"],a:"\u22121.5"}]},{type:"fill",q:"For the line 2y = 6x + 8, write down the gradient and the y-intercept.",t:"gradient @   y-intercept @",a:[3,4],work:["y = 3x + 4"]},{type:"fill",q:"For the line 3x + 2y = 12, write down the gradient and the y-intercept.",t:"gradient @   y-intercept @",a:[-1.5,6],work:["2y = \u22123x + 12","y = \u22121.5x + 6"]},{type:"teach",title:"A line through two points",text:"Find the gradient, then put one of the points into y = mx + c to find c.",we:{q:"Find the equation of the line through (1, 5) and (3, 11).",s:["m = {{11 \u2212 5//3 \u2212 1}} = 3","y = 3x + c. Use (1, 5): 5 = 3 + c","c = 2"],a:"y = 3x + 2"}},{type:"expr",q:"Find the equation of the line through (1, 5) and (3, 11).",a:"3x+2",pre:"y =",work:["m = 3","5 = 3(1) + c, so c = 2","y = 3x + 2"]},{type:"expr",q:"Find the equation of the line through (2, 1) and (6, \u22121).",a:"-0.5x+2",pre:"y =",show:"\u22120.5x + 2",work:["m = {{\u22121 \u2212 1//6 \u2212 2}} = \u22120.5","1 = \u22120.5(2) + c, so c = 2","y = \u22120.5x + 2"]},{type:"expr",q:"Find the equation of this line.",svg:{k:"graph",xmin:-1,xm:4,ymin:-5,ym:3,xs:1,ys:1,eq:1,lines:[{p:[[-.5,3],[3.5,-5]]}],marks:[[0,2,""],[3,-4,""]]},a:"-2x+2",pre:"y =",show:"\u22122x + 2",work:["It crosses the y-axis at 2, so c = 2.","Through (0, 2) and (3, \u22124): m = {{\u22126//3}} = \u22122","y = \u22122x + 2"]},{type:"mc",q:"Does the point (2, 9) lie on the line y = 4x + 1?",options:["Yes, because 4(2) + 1 = 9","No, because 4(9) + 1 \u2260 2","No, because the gradient is 4, not 9","Yes, because 2 + 9 = 11"],a:0,why:"Substitute x = 2: y = 4(2) + 1 = 9, which matches."},{type:"fill",q:"Complete the table of values for y = 3 \u2212 2x.",t:"x = \u22121: y = @    x = 0: y = @    x = 2: y = @",a:[5,3,-1],work:["3 \u2212 2(\u22121) = 5","3 \u2212 2(0) = 3","3 \u2212 2(2) = \u22121"]}]},G3:{name:"Parallel & perpendicular",ex:[{type:"teach",s:1,title:"Midpoint and length",text:"For two points, the midpoint is the average of the coordinates. The length comes from Pythagoras.",svg:{k:"grid",x:[0,8],y:[0,11],noNums:0,lines:[{p:[[1,2],[7,10]],c:"ac"},{p:[[1,2],[7,2]],c:"gdr"},{p:[[7,2],[7,10]],c:"gdr"}],pts:[[1,2,"A"],[7,10,"B","l"],[4,6,"M"]],alt:"A(1, 2) and B(7, 10) with a right-angled triangle"},we:{q:"A is (1, 2) and B is (7, 10). Find the midpoint and the length of AB.",s:["Midpoint: ({{1 + 7//2}}, {{2 + 10//2}}) = (4, 6)","Across: 7 \u2212 1 = 6. Up: 10 \u2212 2 = 8","Length = \u221a{6\xb2 + 8\xb2} = \u221a{100} = 10"],a:"(4, 6) and 10"}},{type:"fill",s:1,q:"Find the midpoint of (\u22122, 5) and (6, \u22121).",t:"( @ , @ )",a:[2,2],work:["({{\u22122 + 6//2}}, {{5 + (\u22121)//2}})","= (2, 2)"]},{type:"num",s:1,q:"Find the length of the line from (1, 1) to (4, 5).",a:5,work:["Across 3, up 4","\u221a{3\xb2 + 4\xb2} = \u221a{25} = 5"]},{type:"num",s:1,q:"Find the length of the line from (\u22123, 2) to (2, \u22124). Give your answer to 3 significant figures.",a:"7.81",work:["Across 5, down 6","\u221a{25 + 36} = \u221a{61} = 7.81\u2026"]},{type:"teach",title:"Parallel lines",text:"Parallel lines have the same gradient. Only the y-intercept changes.",we:{q:"Find the line parallel to y = 3x \u2212 1 that passes through (2, 9).",s:["Same gradient: y = 3x + c","9 = 3(2) + c, so c = 3"],a:"y = 3x + 3"}},{type:"expr",q:"Find the equation of the line parallel to y = 2x + 5 that passes through (3, 1).",a:"2x-5",pre:"y =",work:["y = 2x + c","1 = 6 + c, so c = \u22125","y = 2x \u2212 5"]},{type:"mc",q:"Which line is parallel to y = 4x \u2212 2?",options:["y = 4x + 7","y = \u22124x \u2212 2","y = {{1//4}}x \u2212 2","y = 2x + 4"],a:0,why:"Parallel lines have the same gradient: 4."},{type:"teach",s:1,title:"Perpendicular lines",text:"Perpendicular lines meet at a right angle. Their gradients multiply to make \u22121: flip the gradient and change its sign.",table:[["Gradient","Perpendicular gradient"],["2","\u2212{{1//2}}"],["\u22123","{{1//3}}"],["{{2//5}}","\u2212{{5//2}}"]],we:{q:"Find the line perpendicular to y = 2x + 1 through (4, 3).",s:["Perpendicular gradient: \u2212{{1//2}}","3 = \u2212{{1//2}}(4) + c, so c = 5"],a:"y = \u22120.5x + 5"}},{type:"num",s:1,q:"What is the gradient of a line perpendicular to y = \u22123x + 4?",a:"1/3",work:["Flip \u22123 and change the sign: {{1//3}}"]},{type:"expr",s:1,q:"Find the equation of the line perpendicular to y = 4x \u2212 1 that passes through (8, 1).",a:"-0.25x+3",pre:"y =",show:"\u2212{{1//4}}x + 3",work:["Gradient \u2212{{1//4}}","1 = \u2212{{1//4}}(8) + c = \u22122 + c","c = 3"]},{type:"expr",s:1,q:"A is (2, 1) and B is (6, 5). Find the equation of the perpendicular bisector of AB.",a:"-x+7",pre:"y =",show:"\u2212x + 7",work:["Midpoint (4, 3)","Gradient of AB: {{4//4}} = 1, so perpendicular gradient \u22121","3 = \u22124 + c, so c = 7","y = \u2212x + 7"]}]},G4:{name:"Travel & conversion graphs",ex:[{type:"teach",title:"Distance\u2013time graphs",text:"The gradient of a distance\u2013time graph is the speed. A flat section means the object has stopped.",svg:n,bullets:["0 to 2 hours: 60 km in 2 hours, so 30 km/h.","2 to 3 hours: flat, so stopped for 1 hour.","3 to 4.5 hours: back to the start (distance 0)."]},{type:"num",q:"Use the graph. How fast was the journey home, in km/h?",svg:n,a:40,unit:"km/h",work:["60 km in 1.5 hours","60 \xf7 1.5 = 40 km/h"]},{type:"num",q:"Use the graph. What was the average speed for the whole trip, there and back, including the stop?",svg:n,a:"26.7",unit:"km/h",work:["Total distance 120 km","Total time 4.5 hours","120 \xf7 4.5 = 26.7 km/h"]},{type:"teach",title:"Speed\u2013time graphs",text:"Now the line shows the speed. The area under the line is the distance travelled.",svg:s,bullets:["Split the area into triangles and rectangles.","Triangle: \xbd \xd7 base \xd7 height. Rectangle: base \xd7 height."]},{type:"num",q:"Use the speed\u2013time graph. Find the total distance travelled.",svg:s,a:600,unit:"m",work:["0\u201310 s: \xbd \xd7 10 \xd7 20 = 100 m","10\u201330 s: 20 \xd7 20 = 400 m","30\u201340 s: \xbd \xd7 10 \xd7 20 = 100 m","Total 600 m"]},{type:"num",s:1,q:"Use the speed\u2013time graph. Find the acceleration in the first 10 seconds.",svg:s,a:2,unit:"m/s\xb2",work:["gradient = {{20//10}} = 2 m/s\xb2"]},{type:"num",s:1,q:"Use the speed\u2013time graph. Find the deceleration in the last 10 seconds.",svg:s,a:2,unit:"m/s\xb2",work:["The speed falls by 20 m/s in 10 s","{{20//10}} = 2 m/s\xb2"]},{type:"teach",title:"Conversion graphs",text:"A straight line through the origin converts between two units. Go across from one axis to the line, then down (or across) to the other.",svg:{k:"graph",x:"kilometres",y:"miles",xm:80,ym:50,xs:10,ys:10,lines:[{p:[[0,0],[80,50]]}],guides:[[48,30]],alt:"Conversion graph between kilometres and miles"}},{type:"num",q:"Use the conversion graph. How many miles is 48 km?",svg:{k:"graph",x:"kilometres",y:"miles",xm:80,ym:50,xs:10,ys:10,lines:[{p:[[0,0],[80,50]]}]},a:30,unit:"miles",work:["Up from 48 km to the line, then across: 30 miles"]},{type:"num",q:"8 km is 5 miles. Change 200 km into miles.",a:125,unit:"miles",work:["200 \xf7 8 = 25 lots of 8 km","25 \xd7 5 = 125 miles"]}]},G5:{name:"Quadratic graphs",ex:[{type:"teach",title:"Parabolas",text:"The graph of y = ax\xb2 + bx + c is a smooth U-shaped curve called a parabola.",svg:Object.assign({},i,{marks:[[-1,0,"\u22121","b"],[3,0,"3","b"],[1,-4,"(1, \u22124)","r"],[0,-3,"",""]]}),bullets:["Roots (where it crosses the x-axis): x = \u22121 and x = 3.","y-intercept: c = \u22123.","Line of symmetry: halfway between the roots, x = 1.","Turning point (minimum): (1, \u22124).","If a is negative, the curve is upside down and has a maximum."]},{type:"fill",q:"Complete the table of values for y = x\xb2 \u2212 3x.",cols:["\u22121",0,1,2,3,4],a:[4,0,-2,-2,0,4],work:["(\u22121)\xb2 \u2212 3(\u22121) = 1 + 3 = 4","0 \u2212 0 = 0","1 \u2212 3 = \u22122","4 \u2212 6 = \u22122","9 \u2212 9 = 0","16 \u2212 12 = 4"],why:"Square a negative number first: (\u22121)\xb2 = +1."},{type:"list",q:"Use the graph of y = x\xb2 \u2212 2x \u2212 3 to solve x\xb2 \u2212 2x \u2212 3 = 0.",svg:i,a:[-1,3],work:["The solutions are where the curve crosses the x-axis","x = \u22121 and x = 3"]},{type:"fill",q:"Write down the coordinates of the turning point of y = x\xb2 \u2212 2x \u2212 3.",svg:i,t:"( @ , @ )",a:[1,-4]},{type:"num",q:"The graph of y = x\xb2 \u2212 6x + 5 crosses the x-axis at x = 1 and x = 5. What is the equation of its line of symmetry? Type the number: x = ?",a:3,work:["Halfway between 1 and 5","x = 3"]},{type:"num",q:"Where does y = 2x\xb2 \u2212 5x + 7 cross the y-axis? Give the y-coordinate.",a:7,work:["At x = 0: y = 0 \u2212 0 + 7 = 7"]},{type:"mc",q:"Which describes the graph of y = \u2212x\xb2 + 4?",options:["An upside-down U with a maximum at (0, 4)","A U shape with a minimum at (0, 4)","A U shape with a minimum at (0, \u22124)","A straight line through (0, 4)"],a:0,why:"The x\xb2 term is negative, so the curve opens downwards. At x = 0, y = 4."}]},G6:{name:"Other graphs",ex:[{type:"teach",title:"Recognising the shape",text:"The highest power of x tells you the family of the graph.",table:[["Equation","Shape"],["y = mx + c","Straight line"],["y = ax\xb2 + \u2026","Parabola (U or \u2229)"],["y = ax\xb3 + \u2026","Cubic: an S-shaped curve"],["y = {{k//x}}","Reciprocal: two curves in opposite corners"],["y = a\u02e3","Exponential: flat on one side, shooting up on the other"]]},{type:"mc",q:"Which equation could this graph have?",svg:{k:"graph",xmin:-3,xm:3,ymin:-4,ym:4,xs:1,ys:1,lines:[{p:a(e=>e*e*e-3*e,-2.6,2.6)}]},options:["y = x\xb3 \u2212 3x","y = x\xb2 \u2212 3","y = {{3//x}}","y = 3\u02e3"],a:0,why:"It goes down, up and down again in an S shape: a cubic."},{type:"mc",q:"Which equation could this graph have?",svg:{k:"graph",xmin:-4,xm:4,ymin:-4,ym:4,xs:1,ys:1,lines:[{p:a(e=>2/e,-4,4,161)}]},options:["y = {{2//x}}","y = 2x","y = x\xb2 + 2","y = 2\u02e3"],a:0,why:"Two separate curves that never touch the axes: a reciprocal graph."},{type:"mc",q:"Which equation could this graph have?",svg:{k:"graph",xmin:-3,xm:3,ymin:-1,ym:8,xs:1,ys:1,lines:[{p:a(e=>Math.pow(2,e),-3,3)}],marks:[[0,1,"(0, 1)","r"]]},options:["y = 2\u02e3","y = x\xb2","y = 2x + 1","y = {{1//x}}"],a:0,why:"It passes through (0, 1), stays above the x-axis and grows faster and faster: exponential."},{type:"fill",q:"Complete the table for y = {{12//x}}.",cols:[1,2,3,4,6],a:[12,6,4,3,2]},{type:"num",q:"Find the value of y = 2\u02e3 when x = 3.",a:8,work:["2\xb3 = 8"]},{type:"teach",s:1,title:"Sketching curves",text:"A sketch shows the shape and the key points, not an accurate plot.",svg:{k:"graph",xmin:-3,xm:4,ymin:-8,ym:10,xs:1,ys:2,ph:190,lines:[{p:a(e=>(e-1)*(e+2)*(e-3),-2.6,3.7)}],marks:[[-2,0,"\u22122","b"],[1,0,"1","b"],[3,0,"3","b"],[0,6,"6","r"]],alt:"Sketch of y = (x \u2212 1)(x + 2)(x \u2212 3)"},bullets:["y = (x \u2212 1)(x + 2)(x \u2212 3) has roots x = 1, \u22122 and 3.","y-intercept: put x = 0: (\u22121)(2)(\u22123) = 6.","A positive x\xb3 cubic starts low on the left and ends high on the right.","Asymptotes: y = {{1//x}} gets closer and closer to both axes; y = 2\u02e3 gets closer to y = 0."]},{type:"num",s:1,q:"Where does y = (x \u2212 1)(x + 2)(x \u2212 3) cross the y-axis?",a:6,work:["x = 0: (\u22121)(2)(\u22123) = 6"]},{type:"list",s:1,q:"Write down the roots of y = x(x \u2212 4)(x + 1).",a:[0,4,-1],work:["Each bracket can be 0: x = 0, x = 4, x = \u22121"]},{type:"mc",s:1,q:"What is the equation of the asymptote of y = 2\u02e3 + 3?",options:["y = 3","y = 0","x = 3","x = 0"],a:0,why:"2\u02e3 gets closer and closer to 0 but never reaches it, so 2\u02e3 + 3 gets closer to 3."}]},G7:{name:"Solving with graphs",ex:[{type:"teach",title:"Where graphs meet",text:"The solution of an equation is where two graphs meet. Read the x-values of the crossing points.",svg:Object.assign({},i,{lines:i.lines.concat([{p:[[-2,2],[4,2]],c:"gdr",lab:"y = 2",at:[-1.95,2.6],anchor:"start"}]),guides:[[-1.45,2],[3.45,2]]}),bullets:["x\xb2 \u2212 2x \u2212 3 = 0: where the curve meets the x-axis (y = 0).","x\xb2 \u2212 2x \u2212 3 = 2: where the curve meets the line y = 2, at about x = \u22121.4 and x = 3.4.","Simultaneous equations: where two lines (or a line and a curve) cross."]},{type:"fill",q:"Use the graph to solve x\xb2 \u2212 2x \u2212 3 = 2. Give your answers to 1 decimal place.",svg:Object.assign({},i,{lines:i.lines.concat([{p:[[-2,2],[4,2]],c:"gdr"}])}),t:"x = @  or  x = @",a:[-1.45,3.45],tol:.1,any:1,work:["Read across from y = 2 to the curve","x \u2248 \u22121.4 and x \u2248 3.4"]},{type:"fill",q:"The graph shows y = x + 1 and y = 5 \u2212 x. Use it to solve the simultaneous equations.",svg:{k:"graph",xmin:-1,xm:5,ymin:-1,ym:6,xs:1,ys:1,eq:1,lines:[{p:[[-1,0],[5,6]],lab:"y = x + 1",at:[4.2,5.6]},{p:[[-1,6],[5,0]],c:"a2",lab:"y = 5 \u2212 x",at:[4.6,1.2]}]},t:"x = @ ,  y = @",a:[2,3],work:["The lines cross at (2, 3)"]},{type:"teach",s:1,title:"Which line should you draw?",text:"If you have the graph of one equation and need to solve another, rearrange so the drawn curve is on one side. The other side is the line to draw.",we:{q:"The graph of y = x\xb2 + x \u2212 4 is drawn. Which line do you draw to solve x\xb2 \u2212 2x \u2212 1 = 0?",s:["Add 3x \u2212 3 to both sides of x\xb2 \u2212 2x \u2212 1 = 0: x\xb2 + x \u2212 4 = 3x \u2212 3","The left side is the curve you have","So draw y = 3x \u2212 3 and read where it crosses the curve"],a:"y = 3x \u2212 3"}},{type:"mc",s:1,q:"The graph of y = x\xb2 \u2212 4x + 1 is drawn. Which line should you draw to solve x\xb2 \u2212 5x + 3 = 0?",options:["y = x \u2212 2","y = 5x \u2212 3","y = \u2212x + 2","y = 2"],a:0,why:"x\xb2 \u2212 5x + 3 = 0 can be written x\xb2 \u2212 4x + 1 = x \u2212 2. The left side is the curve, so draw y = x \u2212 2."},{type:"mc",q:"How many solutions does x\xb2 \u2212 2x \u2212 3 = \u22125 have? Use the graph.",svg:i,options:["None: the line y = \u22125 is below the lowest point of the curve","One","Two","Three"],a:0,why:"The minimum of the curve is \u22124, so it never reaches \u22125."}]},G8:{name:"Inequality regions",s:1,ex:[{type:"teach",title:"Regions on a graph",text:"Each inequality is one side of a line. The region that satisfies them all is where those sides overlap.",svg:{k:"graph",xmin:0,xm:7,ymin:0,ym:7,xs:1,ys:1,eq:1,shade:[[[1,1],[1,5],[3,3]]],lines:[{p:[[1,0],[1,7]],lab:"x = 1",at:[1.1,6.6],anchor:"start"},{p:[[0,0],[7,7]],lab:"y = x",at:[6.4,6.9]},{p:[[0,6],[6,0]],lab:"x + y = 6",at:[6.3,.6]}],alt:"The region x \u2265 1, y \u2265 x, x + y \u2264 6"},list:["Draw each boundary line: solid for \u2264 or \u2265, dashed for < or >.","Test a point that is not on the line, such as (0, 0), to see which side works.","The shaded triangle shows x \u2265 1, y \u2265 x and x + y \u2264 6."]},{type:"mc",q:"Which point is in the region y < 2x?",options:["(3, 1)","(1, 3)","(0, 2)","(2, 4)"],a:0,why:"For (3, 1): is 1 < 6? Yes. (2, 4) is on the line y = 2x, which is not included because the sign is <."},{type:"mc",q:"The boundary of the region x + y > 4 should be drawn as:",options:["A dashed line, because points on it are not included","A solid line, because points on it are included","A dashed line, because it slopes downwards","A solid line, because it is an equation"],a:0},{type:"num",q:"How many points with integer coordinates satisfy x \u2265 1, y \u2265 x and x + y \u2264 6?",svg:{k:"graph",xmin:0,xm:7,ymin:0,ym:7,xs:1,ys:1,eq:1,shade:[[[1,1],[1,5],[3,3]]],lines:[{p:[[1,0],[1,7]]},{p:[[0,0],[7,7]]},{p:[[0,6],[6,0]]}]},a:9,work:["x = 1: y = 1, 2, 3, 4, 5 (5 points)","x = 2: y = 2, 3, 4 (3 points)","x = 3: y = 3 (1 point)","Total 9"]},{type:"multi",q:"The shaded region is bounded by x = 1, y = x and x + y = 6 (all solid). Which inequalities describe it?",svg:{k:"graph",xmin:0,xm:7,ymin:0,ym:7,xs:1,ys:1,eq:1,shade:[[[1,1],[1,5],[3,3]]],lines:[{p:[[1,0],[1,7]]},{p:[[0,0],[7,7]]},{p:[[0,6],[6,0]]}]},options:["x \u2265 1","y \u2265 x","x + y \u2264 6","y \u2264 x","x + y \u2265 6"],correct:[0,1,2],why:"The region is right of x = 1, above y = x and below x + y = 6."}]},G9:{name:"Differentiation",s:1,ex:[{type:"teach",title:"Gradient of a curve",text:"A curve's steepness changes as you move along it. The gradient at a point is the gradient of the tangent there: the straight line that just touches the curve.",svg:{k:"graph",xmin:-1,xm:3,ymin:-2,ym:6,xs:1,ys:1,eq:1,lines:[{p:a(e=>e*e,-1,2.4)},{p:[[-.5,-2],[3,5]],c:"a2",lab:"tangent",at:[2.9,4]}],marks:[[1,1,"(1, 1)","l"]],alt:"The tangent to y = x\xb2 at (1, 1)"},bullets:["The tangent to y = x\xb2 at (1, 1) also passes through (2, 3), so its gradient is 2.","Differentiation gives the gradient at every point without drawing."]},{type:"teach",title:"The rule",text:"Multiply by the power, then take 1 off the power.",eq:"y = ax\u207f  \u2192  {{dy//dx}} = nax\u207f\u207b\xb9",table:[["y","{{dy//dx}}"],["x\xb3","3x\xb2"],["5x\xb2","10x"],["7x","7"],["4","0"]],we:{q:"Differentiate y = 3x\u2074 \u2212 5x\xb2 + 2x \u2212 7.",s:["3x\u2074 \u2192 12x\xb3","\u22125x\xb2 \u2192 \u221210x","2x \u2192 2","\u22127 \u2192 0"],a:"{{dy//dx}} = 12x\xb3 \u2212 10x + 2"}},{type:"expr",q:"Differentiate y = 4x\xb2 \u2212 3x + 5.",a:"8x-3",pre:"{{dy//dx}} =",work:["4x\xb2 \u2192 8x","\u22123x \u2192 \u22123","5 \u2192 0"]},{type:"expr",q:"Differentiate y = 2x\u2075 \u2212 x\xb3 + 6x.",a:"10x^4-3x^2+6",pre:"{{dy//dx}} =",work:["2x\u2075 \u2192 10x\u2074","\u2212x\xb3 \u2192 \u22123x\xb2","6x \u2192 6"]},{type:"teach",title:"Gradient at a point",text:"Differentiate, then substitute the x-value.",we:{q:"Find the gradient of y = x\xb2 \u2212 4x at x = 5.",s:["{{dy//dx}} = 2x \u2212 4","At x = 5: 2(5) \u2212 4"],a:"6"}},{type:"num",q:"Find the gradient of y = x\xb3 \u2212 2x when x = 2.",a:10,work:["{{dy//dx}} = 3x\xb2 \u2212 2","3(4) \u2212 2 = 10"]},{type:"num",q:"Find the gradient of y = 5 \u2212 3x\xb2 when x = \u22121.",a:6,work:["{{dy//dx}} = \u22126x","\u22126 \xd7 (\u22121) = 6"]},{type:"num",q:"At what value of x is the gradient of y = x\xb2 \u2212 6x + 1 equal to 4?",a:5,work:["{{dy//dx}} = 2x \u2212 6","2x \u2212 6 = 4","x = 5"]}]},G10:{name:"Turning points",s:1,ex:[{type:"teach",title:"Stationary points",text:"At a turning point the curve is flat for an instant, so the gradient is 0.",list:["Differentiate.","Set {{dy//dx}} = 0 and solve for x.","Substitute x into the original equation to find y.","Decide: maximum or minimum."],we:{q:"Find the turning point of y = x\xb2 \u2212 6x + 11.",s:["{{dy//dx}} = 2x \u2212 6 = 0","x = 3","y = 9 \u2212 18 + 11 = 2"],a:"(3, 2)"}},{type:"fill",q:"Find the turning point of y = x\xb2 + 4x \u2212 1.",t:"( @ , @ )",a:[-2,-5],work:["{{dy//dx}} = 2x + 4 = 0, so x = \u22122","y = 4 \u2212 8 \u2212 1 = \u22125"]},{type:"teach",title:"Maximum or minimum?",text:"Differentiate a second time. The sign of the second derivative tells you which it is.",bullets:["{{d\xb2y//dx\xb2}} > 0: a minimum (the curve is U-shaped there).","{{d\xb2y//dx\xb2}} < 0: a maximum (\u2229-shaped).","Or check the gradient just either side of the point."],we:{q:"Find and classify the turning points of y = x\xb3 \u2212 3x.",s:["{{dy//dx}} = 3x\xb2 \u2212 3 = 0, so x\xb2 = 1 and x = \xb11","x = 1: y = \u22122. x = \u22121: y = 2","{{d\xb2y//dx\xb2}} = 6x: at x = 1 it is 6 (minimum), at x = \u22121 it is \u22126 (maximum)"],a:"Minimum (1, \u22122), maximum (\u22121, 2)"}},{type:"list",q:"Find the x-coordinates of the stationary points of y = x\xb3 \u2212 12x + 5.",a:[2,-2],work:["{{dy//dx}} = 3x\xb2 \u2212 12 = 0","x\xb2 = 4","x = 2 or x = \u22122"]},{type:"mc",q:"y = x\xb3 \u2212 12x + 5 has a stationary point at (2, \u221211). What kind is it?",options:["A minimum, because {{d\xb2y//dx\xb2}} = 12 > 0","A maximum, because {{d\xb2y//dx\xb2}} = 12 > 0","A minimum, because y is negative","A maximum, because x is positive"],a:0,why:"{{d\xb2y//dx\xb2}} = 6x = 12 at x = 2. Positive means a minimum."},{type:"num",q:"Find the maximum value of y = 8x \u2212 x\xb2.",a:16,work:["{{dy//dx}} = 8 \u2212 2x = 0, so x = 4","y = 32 \u2212 16 = 16"]}]},G11:{name:"Functions",s:1,ex:[{type:"teach",title:"Function notation",text:'f(x) = 3x \u2212 2 is a rule. f(4) means "put 4 into the rule".',bullets:["f(4) = 3(4) \u2212 2 = 10","f(\u22121) = 3(\u22121) \u2212 2 = \u22125","Solving f(x) = 13 means 3x \u2212 2 = 13, so x = 5.","The domain is the set of inputs allowed; the range is the set of outputs."]},{type:"num",q:"f(x) = x\xb2 + 1. Find f(\u22123).",a:10,work:["(\u22123)\xb2 + 1 = 9 + 1 = 10"]},{type:"num",q:"f(x) = 2x + 5. Solve f(x) = 17.",a:6,work:["2x + 5 = 17","2x = 12, so x = 6"]},{type:"teach",title:"Composite functions",text:"fg(x) means f(g(x)): do g first, then put the answer into f.",we:{q:"f(x) = 2x + 1 and g(x) = x\xb2. Find fg(3), gf(3) and fg(x).",s:["fg(3): g(3) = 9, then f(9) = 19","gf(3): f(3) = 7, then g(7) = 49","fg(x) = f(x\xb2) = 2x\xb2 + 1"],a:"19, 49 and 2x\xb2 + 1"},warn:"fg is not the same as gf. Work from the right: the function next to x goes first."},{type:"num",q:"f(x) = x + 4 and g(x) = 3x. Find fg(2).",a:10,work:["g(2) = 6","f(6) = 10"]},{type:"expr",q:"f(x) = 2x \u2212 3 and g(x) = x\xb2. Find gf(x).",a:"(2x-3)^2",pre:"gf(x) =",show:"(2x \u2212 3)\xb2",work:["f first: 2x \u2212 3","Then square it: (2x \u2212 3)\xb2"]},{type:"teach",title:"Inverse functions",text:"The inverse f\u207b\xb9 undoes f.",list:["Write y = f(x).","Swap x and y.","Make y the subject."],we:{q:"f(x) = {{x + 5//2}}. Find f\u207b\xb9(x).",s:["y = {{x + 5//2}}","Swap: x = {{y + 5//2}}","2x = y + 5, so y = 2x \u2212 5"],a:"f\u207b\xb9(x) = 2x \u2212 5"}},{type:"expr",q:"f(x) = 3x \u2212 7. Find f\u207b\xb9(x).",a:"(x+7)/3",pre:"f\u207b\xb9(x) =",show:"{{x + 7//3}}",work:["x = 3y \u2212 7","x + 7 = 3y","y = {{x + 7//3}}"]},{type:"num",q:"f(x) = 4x + 1. Find f\u207b\xb9(9).",a:2,work:["f\u207b\xb9(x) = {{x \u2212 1//4}}","f\u207b\xb9(9) = {{8//4}} = 2"],why:"Or ask: what goes into f to give 9? 4x + 1 = 9, so x = 2."},{type:"mc",q:"Which value of x must be left out of the domain of f(x) = {{1//x \u2212 3}}?",options:["3","0","\u22123","1"],a:0,why:"x = 3 makes the bottom 0, and you can't divide by 0."}]}});const o={k:"fig",P:{A:[0,2],B:[6,2],C:[0,0],D:[6,0],G:[1.889,0],H:[4.111,2],E:[1,-.8],F:[5,2.8]},seg:["AB","CD","EF"],par:{AB:1,CD:1},parAt:.88,names:!1};e.push({id:"geo",tab:"E4\u20135",title:"Shape & space",units:[{code:"4.1\u20134.6",title:"Angles & polygons",sub:"Angle facts, parallel lines, polygons and symmetry",lessons:["S1","S2","S3"],guide:["Angles on a straight line add to 180\xb0. Angles around a point add to 360\xb0. Vertically opposite angles are equal.","Angles in a triangle add to 180\xb0; in a quadrilateral, 360\xb0.","Parallel lines: alternate angles are equal (Z), corresponding angles are equal (F), co-interior angles add to 180\xb0 (C).","Sum of interior angles of an n-sided polygon = (n \u2212 2) \xd7 180\xb0. Exterior angles always add to 360\xb0.","Regular polygon: each exterior angle = {{360\xb0//n}}, and interior + exterior = 180\xb0.",'Always give a reason with each angle you find: "angles on a straight line add to 180\xb0".']},{code:"4.3\u20134.4",title:"Similarity & scale",sub:"Similar shapes, congruence, scale drawings and nets",lessons:["S4","S5"],guide:["Similar shapes have equal angles, and every length is multiplied by the same scale factor k.","Find k from a pair of matching sides: k = {{new length//old length}}.",{s:1,t:"Areas are multiplied by k\xb2, volumes by k\xb3."},"Map scale 1 : 50 000 means 1 cm on the map is 50 000 cm = 500 m in real life.","Congruent shapes are identical: same shape and same size (SSS, SAS, ASA, RHS)."]},{code:"4.7\u20134.8",title:"Circle theorems",sub:"Angles in circles, tangents and chords",lessons:["S6","S7"],guide:["The angle in a semicircle is 90\xb0.","A tangent meets the radius at 90\xb0.",{s:1,t:"The angle at the centre is twice the angle at the circumference."},{s:1,t:"Angles in the same segment are equal. Opposite angles of a cyclic quadrilateral add to 180\xb0."},{s:1,t:"Alternate segment theorem: the angle between a tangent and a chord equals the angle in the alternate segment."},{s:1,t:"Tangents from an outside point are equal in length. The perpendicular from the centre to a chord bisects the chord."}]},{code:"5.1\u20135.3",title:"Measures & area",sub:"Units, area, perimeter, circles, arcs and sectors",lessons:["S8","S9","S10"],guide:["1 m = 100 cm, so 1 m\xb2 = 100\xb2 = 10 000 cm\xb2 and 1 m\xb3 = 100\xb3 = 1 000 000 cm\xb3.","1 cm\xb3 = 1 ml, and 1000 cm\xb3 = 1 litre.","Triangle: \xbd \xd7 base \xd7 perpendicular height. Parallelogram: base \xd7 perpendicular height. Trapezium: \xbd(a + b)h.","Circle: circumference = \u03c0d = 2\u03c0r, area = \u03c0r\xb2.","Arc length = {{\u03b8//360}} \xd7 2\u03c0r. Sector area = {{\u03b8//360}} \xd7 \u03c0r\xb2."]},{code:"5.4\u20135.5",title:"Surface area & volume",sub:"Prisms, cylinders, cones, pyramids, spheres and compound solids",lessons:["S11","S12","S13"],guide:["Prism (including a cylinder): volume = area of cross-section \xd7 length.","Cylinder: V = \u03c0r\xb2h, curved surface = 2\u03c0rh.","Pyramid: V = \u2153 \xd7 base area \xd7 h. Cone: V = \u2153\u03c0r\xb2h, curved surface = \u03c0rl.","Sphere: V = {{4//3}}\u03c0r\xb3, surface = 4\u03c0r\xb2. A hemisphere is half of each (plus a flat circle \u03c0r\xb2 for a solid hemisphere).","h is the vertical height; l is the slant height. l\xb2 = r\xb2 + h\xb2."]}]}),Object.assign(t,{S1:{name:"Angle facts",ex:[{type:"teach",title:"Lines, points and triangles",text:"A few facts let you work out almost any missing angle.",svg:{k:"fig",P:{A:[-3,0],B:[3,0],O:[0,0],C:[-1.8,2.4],D:[1.8,-2.4]},seg:["AB","CD"],angs:[["COA","a"],["BOC","b"],["DOB","c"]],names:!1,alt:"Two straight lines crossing"},bullets:["Angles on a straight line add to 180\xb0: a + b = 180\xb0.","Angles around a point add to 360\xb0.","Vertically opposite angles are equal: a = c.","The angles in a triangle add to 180\xb0; in a quadrilateral, 360\xb0."],we:{q:"Two angles on a straight line are 125\xb0 and x. Find x.",s:["Angles on a straight line add to 180\xb0","x = 180 \u2212 125"],a:"55\xb0"}},{type:"num",q:"Two angles on a straight line are 118\xb0 and x. Find x.",a:62,unit:"\xb0",work:["Angles on a straight line add to 180\xb0","180 \u2212 118 = 62\xb0"]},{type:"num",q:"Three angles meet at a point: 140\xb0, 95\xb0 and x. Find x.",a:125,unit:"\xb0",work:["Angles around a point add to 360\xb0","360 \u2212 140 \u2212 95 = 125\xb0"]},{type:"num",q:"Find the angle x in the triangle.",svg:{k:"fig",P:{A:[0,0],B:[5,0],C:[3.49,3.74]},poly:["ABC"],angs:[["CAB","47\xb0"],["ABC","68\xb0"],["BCA","x"]],alt:"Triangle with angles 47\xb0, 68\xb0 and x"},a:65,unit:"\xb0",work:["Angles in a triangle add to 180\xb0","180 \u2212 47 \u2212 68 = 65\xb0"]},{type:"num",q:"An isosceles triangle has an angle of 40\xb0 between its two equal sides. Find one of the other angles.",a:70,unit:"\xb0",work:["The two base angles are equal","(180 \u2212 40) \xf7 2 = 70\xb0"]},{type:"teach",title:"Parallel lines",text:"A line crossing two parallel lines makes three pairs of angles you must know by name.",svg:Object.assign({},o,{angs:[["BHF","p"],["DGH","q"],["BHG","r"]],alt:"A line crossing two parallel lines"}),bullets:["Corresponding angles are equal (an F shape): p = q.","Alternate angles are equal (a Z shape).","Co-interior angles add to 180\xb0 (a C shape): q + r = 180\xb0."],warn:"Only use these when the lines are marked parallel with arrows."},{type:"num",q:"The lines with arrows are parallel. Find x.",svg:Object.assign({},o,{angs:[["BHF","72\xb0"],["DGH","x"]],alt:"Parallel lines with angles 72\xb0 and x"}),a:72,unit:"\xb0",work:["x and 72\xb0 are corresponding angles","Corresponding angles are equal, so x = 72\xb0"]},{type:"num",q:"The lines with arrows are parallel. Find y.",svg:Object.assign({},o,{angs:[["BHG","108\xb0"],["CGH","y"]],alt:"Parallel lines with angles 108\xb0 and y"}),a:108,unit:"\xb0",work:["y and 108\xb0 are alternate angles (a Z shape)","Alternate angles are equal, so y = 108\xb0"]},{type:"mc",q:"Two angles between parallel lines add to 180\xb0. What are they called?",options:["Co-interior angles","Alternate angles","Corresponding angles","Vertically opposite angles"],a:0,why:"Co-interior angles sit on the same side of the crossing line, between the parallel lines, and add to 180\xb0."},{type:"num",q:"The angles of a triangle are x, 2x and 3x. Find x.",a:30,unit:"\xb0",work:["x + 2x + 3x = 180","6x = 180","x = 30\xb0"]}]},S2:{name:"Polygons",ex:[{type:"teach",title:"Interior and exterior angles",text:"Split a polygon into triangles from one corner: an n-sided polygon makes n \u2212 2 triangles.",eq:"sum of interior angles = (n \u2212 2) \xd7 180\xb0",bullets:["Exterior angles of any polygon add to 360\xb0.","In a regular polygon every exterior angle is {{360\xb0//n}}.","Interior angle + exterior angle = 180\xb0."],we:{q:"Find the interior angle of a regular hexagon.",s:["Exterior angle = 360 \xf7 6 = 60\xb0","Interior angle = 180 \u2212 60"],a:"120\xb0"}},{type:"num",q:"Find the sum of the interior angles of a pentagon.",a:540,unit:"\xb0",work:["n = 5","(5 \u2212 2) \xd7 180 = 540\xb0"]},{type:"num",q:"Find the size of each interior angle of a regular decagon (10 sides).",a:144,unit:"\xb0",work:["Exterior angle = 360 \xf7 10 = 36\xb0","Interior angle = 180 \u2212 36 = 144\xb0"]},{type:"num",q:"Each exterior angle of a regular polygon is 24\xb0. How many sides does it have?",a:15,work:["n = 360 \xf7 24","= 15 sides"]},{type:"num",q:"Each interior angle of a regular polygon is 160\xb0. How many sides does it have?",a:18,work:["Exterior angle = 180 \u2212 160 = 20\xb0","n = 360 \xf7 20 = 18"]},{type:"num",q:"Four angles of a pentagon are 100\xb0, 110\xb0, 120\xb0 and 95\xb0. Find the fifth angle.",a:115,unit:"\xb0",work:["The angles of a pentagon add to 540\xb0","540 \u2212 100 \u2212 110 \u2212 120 \u2212 95 = 115\xb0"]},{type:"mc",q:"Can a regular polygon have an interior angle of 130\xb0?",options:["No: the exterior angle 50\xb0 doesn't divide into 360\xb0","Yes: it has 13 sides","Yes: it has 7 sides","No: interior angles must be less than 120\xb0"],a:0,why:"Exterior angle = 180 \u2212 130 = 50\xb0, and 360 \xf7 50 = 7.2, which isn't a whole number of sides."},{type:"num",q:"A quadrilateral has angles x, x, 2x and 2x. Find x.",a:60,unit:"\xb0",work:["Angles in a quadrilateral add to 360\xb0","6x = 360","x = 60\xb0"]}]},S3:{name:"Shapes & symmetry",ex:[{type:"teach",title:"Symmetry",text:"A line of symmetry folds a shape onto itself. The order of rotational symmetry is how many times a shape fits onto itself in one full turn.",bullets:["A regular polygon with n sides has n lines of symmetry and rotational symmetry of order n.","A shape with no rotational symmetry has order 1.",{s:1,t:"Solids have planes of symmetry: a cuboid that isn't a cube has 3, a cylinder or cone has infinitely many."}],we:{q:"A rectangle (not a square): lines of symmetry and order of rotational symmetry?",s:["It folds onto itself along the two lines through the middle of opposite sides","It looks the same twice in a full turn"],a:"2 lines, order 2"}},{type:"num",q:"How many lines of symmetry does a regular hexagon have?",a:6,work:["A regular polygon with n sides has n lines of symmetry","n = 6"]},{type:"num",q:"What is the order of rotational symmetry of a parallelogram?",a:2,work:["A parallelogram looks the same after a half turn, and again after a full turn","Order 2 (it has no lines of symmetry)"]},{type:"match",q:"Match each quadrilateral to its property.",pairs:[["Rhombus","All sides equal, diagonals cross at right angles"],["Rectangle","Diagonals equal in length and bisect each other"],["Kite","Two pairs of equal adjacent sides"],["Trapezium","Exactly one pair of parallel sides"],["Parallelogram","Opposite sides parallel, no lines of symmetry"]]},{type:"mc",q:"An angle of 200\xb0 is\u2026",options:["reflex","obtuse","acute","a right angle"],a:0,why:"Acute: less than 90\xb0. Obtuse: between 90\xb0 and 180\xb0. Reflex: between 180\xb0 and 360\xb0."},{type:"mc",q:"Which triangle has exactly one line of symmetry?",options:["Isosceles","Equilateral","Scalene","Right-angled with sides 3, 4, 5"],a:0,why:"An isosceles triangle has one line of symmetry down the middle. Equilateral has 3; scalene has none."},{type:"num",s:1,q:"A cuboid has a square base but is taller than it is wide. How many planes of symmetry does it have?",a:5,work:["2 vertical planes through the middles of opposite faces","2 vertical planes through opposite edges (the diagonals of the square)","1 horizontal plane halfway up","Total 5"]},{type:"mc",s:1,q:"How many planes of symmetry does a cone have?",options:["Infinitely many","1","2","None"],a:0,why:"Any vertical plane through the tip and the centre of the base cuts a cone into two mirror halves."}]},S4:{name:"Similar shapes",ex:[{type:"teach",title:"Scale factor",text:"Similar shapes have the same angles. Every length is multiplied by the same scale factor.",eq:"k = {{length on new shape//matching length on old shape}}",svg:{k:"fig",P:{A:[0,0],B:[2,0],C:[0,1.5],D:[4,0],E:[7,0],F:[4,2.25]},poly:["ABC","DEF"],right:["BAC","EDF"],lab:{AB:"4 cm",AC:"3 cm",DE:"6 cm",DF:"x"},names:!1,alt:"Two similar right-angled triangles"},we:{q:"The triangles are similar. Find x.",s:["k = 6 \xf7 4 = 1.5","x = 3 \xd7 1.5"],a:"4.5 cm"},warn:"Match sides carefully: the shortest side goes with the shortest side."},{type:"num",q:"A rectangle 3 cm by 5 cm is enlarged so its short side is 12 cm. How long is its long side?",a:20,unit:"cm",work:["k = 12 \xf7 3 = 4","5 \xd7 4 = 20 cm"]},{type:"num",q:"DE is parallel to BC. AD = 4 cm, AB = 10 cm and DE = 6 cm. Find BC.",svg:{k:"fig",P:{A:[2,5],B:[0,0],C:[6,0],D:[1.2,3],E:[3.6,3]},poly:["ABC"],seg:["DE"],par:{DE:1,BC:1},lab:{AD:"4",DE:"6"},pos:{A:"n",D:"w",E:"e"}},a:15,unit:"cm",work:["Triangles ADE and ABC are similar","k = AB \xf7 AD = 10 \xf7 4 = 2.5","BC = 6 \xd7 2.5 = 15 cm"]},{type:"mc",q:"Which of these does NOT prove two triangles are congruent?",options:["All three angles equal (AAA)","All three sides equal (SSS)","Two sides and the angle between them (SAS)","Right angle, hypotenuse and one side (RHS)"],a:0,why:"Equal angles prove triangles are similar, but they could still be different sizes."},{type:"teach",s:1,title:"Areas and volumes",text:"If lengths are multiplied by k, areas are multiplied by k\xb2 and volumes by k\xb3.",bullets:["Length ratio 1 : 2 gives area ratio 1 : 4 and volume ratio 1 : 8.","Going backwards: from an area ratio, square root to get k; from a volume ratio, cube root."],we:{q:"Two similar cylinders have heights 6 cm and 9 cm. The smaller has volume 160 cm\xb3. Find the larger volume.",s:["k = 9 \xf7 6 = 1.5","Volume factor = 1.5\xb3 = 3.375","160 \xd7 3.375"],a:"540 cm\xb3"},warn:"Don't multiply an area or a volume by k: square or cube it first."},{type:"num",s:1,q:"Two similar shapes have lengths in the ratio 2 : 5. The smaller has area 12 cm\xb2. Find the area of the larger.",a:75,unit:"cm\xb2",work:["k = {{5//2}} = 2.5","Area factor = 2.5\xb2 = 6.25","12 \xd7 6.25 = 75 cm\xb2"]},{type:"num",s:1,q:"Two similar shapes have areas 20 cm\xb2 and 45 cm\xb2. A side of the smaller is 4 cm. Find the matching side of the larger.",a:6,unit:"cm",work:["Area factor = 45 \xf7 20 = 2.25","k = \u221a{2.25} = 1.5","4 \xd7 1.5 = 6 cm"]},{type:"num",s:1,q:"Two similar jugs hold 0.5 litres and 4 litres. The smaller is 10 cm tall. How tall is the larger?",a:20,unit:"cm",work:["Volume factor = 4 \xf7 0.5 = 8","k = \u221b{8} = 2","10 \xd7 2 = 20 cm"]}]},S5:{name:"Scale drawings & nets",ex:[{type:"teach",title:"Map scales",text:"A scale of 1 : 50 000 means every 1 cm on the map is 50 000 cm in real life.",bullets:["Convert: 50 000 cm = 500 m = 0.5 km.","Map to real: multiply. Real to map: divide.",'Scale drawings use the same idea, often written like "1 cm represents 5 m".'],we:{q:"On a 1 : 50 000 map two towns are 7.4 cm apart. How far apart are they?",s:["7.4 \xd7 50 000 = 370 000 cm","370 000 cm = 3700 m"],a:"3.7 km"}},{type:"num",q:"A map has scale 1 : 25 000. Two points are 6 cm apart on the map. Find the real distance in km.",a:1.5,unit:"km",work:["6 \xd7 25 000 = 150 000 cm","= 1500 m = 1.5 km"]},{type:"num",q:"A road is 4.2 km long. How long is it on a map with scale 1 : 50 000? Give your answer in cm.",a:8.4,unit:"cm",work:["4.2 km = 420 000 cm","420 000 \xf7 50 000 = 8.4 cm"]},{type:"num",q:"A plan uses 1 cm to represent 5 m. A room is 23 m long. How long is it on the plan?",a:4.6,unit:"cm",work:["23 \xf7 5 = 4.6 cm"]},{type:"mc",q:"To construct a triangle with sides 7 cm, 5 cm and 4 cm, what do you need?",options:["A ruler and a pair of compasses","A protractor only","A ruler and a protractor","A set square"],a:0,why:"Draw the 7 cm side with a ruler, then use compasses set to 5 cm and 4 cm from each end. Where the arcs cross is the third corner."},{type:"mc",q:"A net is made of 2 triangles and 3 rectangles. Which solid does it fold into?",options:["Triangular prism","Square-based pyramid","Tetrahedron","Cuboid"],a:0,why:"A triangular prism has two triangle ends joined by three rectangular faces."},{type:"num",q:"How many faces does a square-based pyramid have?",a:5,work:["1 square base","4 triangular faces","5 faces altogether"]},{type:"num",s:1,q:"A map has scale 1 : 20 000. A field covers 3 cm\xb2 on the map. Find its real area in km\xb2.",a:.12,unit:"km\xb2",work:["1 cm represents 20 000 cm = 0.2 km","1 cm\xb2 represents 0.2\xb2 = 0.04 km\xb2","3 \xd7 0.04 = 0.12 km\xb2"]}]},S6:{name:"Circle theorems",ex:[{type:"teach",title:"Semicircles and tangents",text:"Two facts about circles that both tiers need.",svg:{k:"fig",P:{O:[0,0],A:[-3,0],B:[3,0],C:[1.026,2.819]},circ:[{c:"O",r:3}],poly:["ABC"],dots:["O"],right:["ACB"],alt:"Triangle in a semicircle with a right angle at C"},bullets:["The angle in a semicircle is 90\xb0: a triangle drawn on a diameter has a right angle on the circle.","A tangent touches the circle at one point, and meets the radius there at 90\xb0."],we:{q:"AB is a diameter and angle CAB = 35\xb0. Find angle CBA.",s:["Angle ACB = 90\xb0 (angle in a semicircle)","Angle CBA = 180 \u2212 90 \u2212 35"],a:"55\xb0"}},{type:"num",q:"AB is a diameter of the circle, centre O. Find x.",svg:{k:"fig",P:{O:[0,0],A:[-3,0],B:[3,0],C:[1.026,2.819]},circ:[{c:"O",r:3}],poly:["ABC"],dots:["O"],angs:[["CAB","35\xb0"],["ABC","x"]]},a:55,unit:"\xb0",work:["Angle ACB = 90\xb0 (angle in a semicircle)","x = 180 \u2212 90 \u2212 35 = 55\xb0"]},{type:"num",q:"PT is a tangent to the circle at T, and O is the centre. Angle TOP = 52\xb0. Find angle OPT.",svg:{k:"fig",P:{O:[0,0],T:[0,3],P:[3.84,3]},circ:[{c:"O",r:3}],ln:[{s:"TP",ext:.6,ext2:.15}],seg:["OT","OP"],right:["OTP"],angs:[["TOP","52\xb0"],["OPT","x"]],dots:["O"]},a:38,unit:"\xb0",work:["Angle OTP = 90\xb0 (tangent meets radius at 90\xb0)","x = 180 \u2212 90 \u2212 52 = 38\xb0"]},{type:"mc",q:"A triangle has one side along a diameter and its third corner on the circle. What can you say?",options:["The angle at the corner on the circle is 90\xb0","It is equilateral","It is isosceles","Its angles add to 360\xb0"],a:0,why:"The angle in a semicircle is a right angle."},{type:"teach",s:1,title:"The angle at the centre",text:"The angle at the centre is twice the angle at the circumference, when both stand on the same arc.",svg:{k:"fig",P:{O:[0,0],A:[-2.598,-1.5],B:[2.598,-1.5],C:[0,3]},circ:[{c:"O",r:3}],seg:["OA","OB","CA","CB"],angs:[["AOB","2x"],["ACB","x"]],dots:["O"],alt:"Angle at the centre and angle at the circumference on the same arc"},bullets:["Angles in the same segment are equal: they stand on the same chord from the same side."],we:{q:"Angle AOB at the centre is 110\xb0. Find angle ACB at the circumference.",s:["The angle at the centre is twice the angle at the circumference","110 \xf7 2"],a:"55\xb0"}},{type:"num",s:1,q:"O is the centre. Angle ACB = 64\xb0. Find angle AOB.",a:128,unit:"\xb0",svg:{k:"fig",P:{O:[0,0],A:[-2.598,-1.5],B:[2.598,-1.5],C:[0,3]},circ:[{c:"O",r:3}],seg:["OA","OB","CA","CB"],angs:[["ACB","64\xb0"],["AOB","y"]],dots:["O"]},work:["The angle at the centre is twice the angle at the circumference","y = 2 \xd7 64 = 128\xb0"]},{type:"num",s:1,q:"Points A, B, C and D lie on a circle. Angle ACB = 41\xb0. Find angle ADB, where D is on the same side of AB as C.",a:41,unit:"\xb0",work:["ACB and ADB stand on the same chord AB, from the same side","Angles in the same segment are equal: 41\xb0"]}]},S7:{name:"More circle theorems",ex:[{type:"teach",title:"Cyclic quadrilaterals",text:"A cyclic quadrilateral has all four corners on a circle. Its opposite angles add to 180\xb0.",svg:{k:"fig",P:{O:[0,0],A:[-2.598,1.5],B:[-1.928,-2.298],C:[2.598,-1.5],D:[1.5,2.598]},circ:[{c:"O",r:3}],poly:["ABCD"],angs:[["DAB","a"],["BCD","c"]],hide:["O"],alt:"A cyclic quadrilateral"},eq:"a + c = 180\xb0",we:{q:"One angle of a cyclic quadrilateral is 74\xb0. Find the opposite angle.",s:["Opposite angles add to 180\xb0","180 \u2212 74"],a:"106\xb0"}},{type:"num",q:"ABCD is a cyclic quadrilateral. Angle ABC = 97\xb0. Find angle ADC.",a:83,unit:"\xb0",work:["Opposite angles of a cyclic quadrilateral add to 180\xb0","180 \u2212 97 = 83\xb0"]},{type:"teach",title:"Tangents and chords",text:"Three more facts.",bullets:["Alternate segment theorem: the angle between a tangent and a chord equals the angle in the alternate segment.","Two tangents from the same outside point are equal in length.","The perpendicular from the centre to a chord cuts the chord in half."],svg:{k:"fig",P:{O:[0,0],A:[0,-3],B:[2.598,1.5],C:[-2.121,2.121]},circ:[{c:"O",r:3}],poly:["ABC"],tan:[{at:"A",c:"O",len:4,names:["S","T"]}],angs:[["TAB","x"],["ACB","x"]],hide:["O"],alt:"Alternate segment theorem"}},{type:"num",q:"ST is a tangent at A. Angle TAB = 58\xb0. Find angle ACB.",svg:{k:"fig",P:{O:[0,0],A:[0,-3],B:[2.598,1.5],C:[-2.121,2.121]},circ:[{c:"O",r:3}],poly:["ABC"],tan:[{at:"A",c:"O",len:4,names:["S","T"]}],angs:[["TAB","58\xb0"],["ACB","y"]],hide:["O"]},a:58,unit:"\xb0",work:["Alternate segment theorem: the angle between tangent and chord AB equals the angle in the alternate segment","y = 58\xb0"]},{type:"num",q:"PA and PB are tangents from P to a circle with centre O. Angle APB = 60\xb0. Find angle AOB.",svg:{k:"fig",P:{O:[0,0],A:[-2.598,-1.5],B:[2.598,-1.5],P:[0,-6]},circ:[{c:"O",r:3}],seg:["PA","PB","OA","OB"],right:["OAP","PBO"],angs:[["APB","60\xb0"],["AOB","z"]],dots:["O"]},a:120,unit:"\xb0",work:["Angles OAP and OBP are 90\xb0 (tangent meets radius)","Quadrilateral OAPB: z = 360 \u2212 90 \u2212 90 \u2212 60 = 120\xb0"]},{type:"num",q:"A circle has radius 10 cm. A chord is 16 cm long. How far is the chord from the centre?",svg:{k:"fig",P:{O:[0,0],A:[-8,-6],B:[8,-6],M:[0,-6]},circ:[{c:"O",r:10}],seg:["AB","OM","OB"],right:["OMB"],lab:{OB:"10 cm",MB:"8 cm",OM:"d"},pos:{M:"s"}},a:6,unit:"cm",work:["The perpendicular from O bisects the chord, so MB = 8 cm","d\xb2 + 8\xb2 = 10\xb2","d = \u221a{100 \u2212 64} = 6 cm"]},{type:"mc",q:"Which fact explains why PA = PB, when PA and PB are tangents from P?",options:["Tangents from an outside point are equal","The angle in a semicircle is 90\xb0","Opposite angles of a cyclic quadrilateral add to 180\xb0","Angles in the same segment are equal"],a:0,why:"Two tangents drawn to a circle from the same point outside it are always the same length."}]},S8:{name:"Units of measure",ex:[{type:"teach",title:"Length, area and volume",text:"Area and volume conversions are not the same as length conversions.",bullets:["Length: 1 m = 100 cm, 1 cm = 10 mm, 1 km = 1000 m.","Area: 1 m\xb2 = 100 \xd7 100 = 10 000 cm\xb2.","Volume: 1 m\xb3 = 100 \xd7 100 \xd7 100 = 1 000 000 cm\xb3.","Capacity: 1 cm\xb3 = 1 ml, 1000 cm\xb3 = 1 litre."],we:{q:"Convert 3.5 m\xb2 to cm\xb2.",s:["1 m\xb2 = 10 000 cm\xb2","3.5 \xd7 10 000"],a:"35 000 cm\xb2"},warn:"1 m\xb2 is 10 000 cm\xb2, not 100 cm\xb2. Square the length factor for areas and cube it for volumes."},{type:"num",q:"Convert 3.5 m\xb2 to cm\xb2.",a:35e3,unit:"cm\xb2",work:["1 m\xb2 = 100\xb2 cm\xb2 = 10 000 cm\xb2","3.5 \xd7 10 000 = 35 000 cm\xb2"]},{type:"num",q:"Convert 650 mm\xb2 to cm\xb2.",a:6.5,unit:"cm\xb2",work:["1 cm\xb2 = 10\xb2 = 100 mm\xb2","650 \xf7 100 = 6.5 cm\xb2"]},{type:"num",q:"Convert 45 000 cm\xb3 to m\xb3.",a:.045,unit:"m\xb3",work:["1 m\xb3 = 1 000 000 cm\xb3","45 000 \xf7 1 000 000 = 0.045 m\xb3"]},{type:"num",q:"A jug holds 2.4 litres. How many cm\xb3 is that?",a:2400,unit:"cm\xb3",work:["1 litre = 1000 cm\xb3","2.4 \xd7 1000 = 2400 cm\xb3"]},{type:"num",q:"Convert 72 km/h to m/s.",a:20,unit:"m/s",work:["72 km = 72 000 m and 1 hour = 3600 s","72 000 \xf7 3600 = 20 m/s"]},{type:"fill",q:"Write 2.4 hours in hours and minutes.",t:"@ hours @ minutes",a:[2,24],work:["0.4 of an hour = 0.4 \xd7 60 = 24 minutes","2 hours 24 minutes"]},{type:"num",q:"Write 3 hours 45 minutes as a decimal number of hours.",a:3.75,unit:"hours",work:["45 minutes = {{45//60}} = 0.75 hours","3.75 hours"]}]},S9:{name:"Area & perimeter",ex:[{type:"teach",title:"Area formulas",text:"Always use the perpendicular height: the one at right angles to the base.",svg:{k:"fig",P:{A:[0,0],B:[10,0],C:[8,4.5],D:[2,4.5],E:[2,0]},poly:["ABCD"],seg:[{s:"DE",c:"gd"}],right:["DEB"],lab:{AB:"b",DC:"a","DE*":"h"},names:!1,alt:"A trapezium with parallel sides a and b and height h"},bullets:["Rectangle: length \xd7 width. Triangle: \xbd \xd7 base \xd7 height.","Parallelogram: base \xd7 height.","Trapezium: \xbd(a + b)h, where a and b are the parallel sides."],we:{q:"A trapezium has parallel sides 5 cm and 9 cm, 4 cm apart. Find its area.",s:["\xbd \xd7 (5 + 9) \xd7 4","= \xbd \xd7 14 \xd7 4"],a:"28 cm\xb2"}},{type:"num",q:"A triangle has base 12 cm and perpendicular height 7 cm. Find its area.",a:42,unit:"cm\xb2",work:["\xbd \xd7 12 \xd7 7 = 42 cm\xb2"]},{type:"num",q:"Find the area of the parallelogram.",svg:{k:"fig",P:{A:[0,0],B:[8,0],C:[10,5],D:[2,5],E:[2,0]},poly:["ABCD"],seg:[{s:"DE",c:"gd"}],right:["DEB"],lab:{AB:"8 cm",BC:"6 cm","DE*":"5 cm"},names:!1},a:40,unit:"cm\xb2",work:["Area = base \xd7 perpendicular height","8 \xd7 5 = 40 cm\xb2 (the 6 cm sloping side isn't needed)"]},{type:"num",q:"Find the area of the trapezium.",svg:{k:"fig",P:{A:[0,0],B:[10,0],C:[8,4.5],D:[2,4.5],E:[2,0]},poly:["ABCD"],seg:[{s:"DE",c:"gd"}],right:["DEB"],lab:{AB:"10 cm",DC:"6 cm","DE*":"4.5 cm"},names:!1},a:36,unit:"cm\xb2",work:["\xbd \xd7 (6 + 10) \xd7 4.5","= 8 \xd7 4.5 = 36 cm\xb2"]},{type:"num",q:"Find the area of the shape.",svg:{k:"fig",P:{A:[0,0],B:[10,0],C:[10,5],D:[6,5],E:[6,8],F:[0,8]},poly:["ABCDEF"],right:["FAB","ABC","BCD","DEF","EFA"],lab:{AB:"10 cm",AF:"8 cm",BC:"5 cm",CD:"4 cm"},names:!1,alt:"An L-shape"},a:68,unit:"cm\xb2",work:["Split into a 10 \xd7 5 rectangle and a 6 \xd7 3 rectangle","50 + 18 = 68 cm\xb2"]},{type:"num",q:"Find the perimeter of the same L-shape: sides 10, 5, 4, 3, 6 and 8 cm.",a:36,unit:"cm",work:["10 + 5 + 4 + 3 + 6 + 8 = 36 cm"]},{type:"num",q:"A rectangle has area 48 cm\xb2 and length 8 cm. Find its width.",a:6,unit:"cm",work:["48 \xf7 8 = 6 cm"]}]},S10:{name:"Circles, arcs & sectors",ex:[{type:"teach",title:"Circles",text:"\u03c0 is about 3.14. Use the \u03c0 key on your calculator.",eq:"C = \u03c0d = 2\u03c0r     A = \u03c0r\xb2",we:{q:"Find the circumference of a circle with diameter 9 cm.",s:["C = \u03c0 \xd7 9","= 28.274\u2026"],a:"28.3 cm (3 s.f.)"},warn:"Check whether you are given the radius or the diameter. r is half of d."},{type:"num",q:"Find the area of a circle with radius 5 cm. Give your answer to 3 significant figures.",a:"78.5",unit:"cm\xb2",work:["A = \u03c0 \xd7 5\xb2","= 78.539\u2026 = 78.5 cm\xb2"]},{type:"num",q:"Find the circumference of a circle with diameter 9 cm, to 3 significant figures.",a:"28.3",unit:"cm",work:["C = \u03c0 \xd7 9 = 28.27\u2026 = 28.3 cm"]},{type:"num",q:"Find the perimeter of a semicircle with radius 4 cm, to 3 significant figures.",a:"20.6",unit:"cm",work:["Curved part: \xbd \xd7 2\u03c0 \xd7 4 = 4\u03c0 = 12.566\u2026","Add the straight diameter: 12.566 + 8","= 20.6 cm"]},{type:"teach",title:"Arcs and sectors",text:"A sector is a slice of a circle. Its arc and area are the fraction {{\u03b8//360}} of the whole circle.",svg:{k:"fig",P:{O:[0,0],A:[3,0],B:[.521,2.954]},sector:[{c:"O",r:3,a0:0,a1:80}],circ:[{c:"O",r:3,cls:"gd"}],seg:["OA","OB"],angs:[["AOB","\u03b8"]],lab:{OA:"r"},alt:"A sector with angle \u03b8"},eq:"arc = {{\u03b8//360}} \xd7 2\u03c0r     sector = {{\u03b8//360}} \xd7 \u03c0r\xb2",we:{q:"Find the arc length of a sector with radius 6 cm and angle 80\xb0.",s:["{{80//360}} \xd7 2 \xd7 \u03c0 \xd7 6","= 8.377\u2026"],a:"8.38 cm"}},{type:"num",q:"A sector has radius 10 cm and angle 72\xb0. Find its arc length, to 3 significant figures.",a:"12.6",unit:"cm",work:["{{72//360}} \xd7 2\u03c0 \xd7 10 = 4\u03c0","= 12.566\u2026 = 12.6 cm"]},{type:"num",q:"A sector has radius 9 cm and angle 120\xb0. Find its area, to 3 significant figures.",a:"84.8",unit:"cm\xb2",work:["{{120//360}} \xd7 \u03c0 \xd7 9\xb2 = 27\u03c0","= 84.823\u2026 = 84.8 cm\xb2"]},{type:"expr",s:1,q:"A sector has radius 6 cm and angle 60\xb0. Find its area, in terms of \u03c0.",a:"6\u03c0",show:"6\u03c0",unit:"cm\xb2",work:["{{60//360}} \xd7 \u03c0 \xd7 36","= {{36\u03c0//6}} = 6\u03c0 cm\xb2"]},{type:"num",s:1,q:"A sector has radius 8 cm and arc length 10 cm. Find the angle, to 3 significant figures.",a:"71.6",unit:"\xb0",work:["{{\u03b8//360}} \xd7 2\u03c0 \xd7 8 = 10","\u03b8 = {{10 \xd7 360//16\u03c0}}","= 71.619\u2026 = 71.6\xb0"]}]},S11:{name:"Prisms & cylinders",ex:[{type:"teach",title:"Volume of a prism",text:"A prism has the same cross-section all the way along. A cylinder is a prism with a circular cross-section.",svg:{k:"solid",s:"cylinder",r:"r",h:"h",alt:"A cylinder"},eq:"V = area of cross-section \xd7 length     cylinder: V = \u03c0r\xb2h",bullets:["Curved surface of a cylinder = 2\u03c0rh (the label, unrolled into a rectangle).","Total surface of a closed cylinder = 2\u03c0rh + 2\u03c0r\xb2."],we:{q:"A cylinder has radius 4 cm and height 10 cm. Find its volume.",s:["V = \u03c0 \xd7 4\xb2 \xd7 10","= 160\u03c0 = 502.65\u2026"],a:"503 cm\xb3 (3 s.f.)"}},{type:"num",q:"Find the volume of the cuboid.",svg:{k:"solid",s:"cuboid",l:"8 cm",w:"5 cm",h:"3 cm"},a:120,unit:"cm\xb3",work:["8 \xd7 5 \xd7 3 = 120 cm\xb3"]},{type:"num",q:"Find the total surface area of the same cuboid: 8 cm by 5 cm by 3 cm.",a:158,unit:"cm\xb2",work:["Pairs of faces: 8 \xd7 5 = 40, 8 \xd7 3 = 24, 5 \xd7 3 = 15","2 \xd7 (40 + 24 + 15) = 158 cm\xb2"]},{type:"num",q:"Find the volume of the triangular prism.",svg:{k:"solid",s:"prism",b:"6 cm",h:"4 cm",l:"12 cm"},a:144,unit:"cm\xb3",work:["Cross-section: \xbd \xd7 6 \xd7 4 = 12 cm\xb2","12 \xd7 12 = 144 cm\xb3"]},{type:"num",q:"A cylinder has radius 3 cm and height 7 cm. Find its volume, to 3 significant figures.",a:198,tol:.5,unit:"cm\xb3",work:["V = \u03c0 \xd7 3\xb2 \xd7 7 = 63\u03c0","= 197.92\u2026 = 198 cm\xb3"]},{type:"num",q:"A closed cylinder has radius 5 cm and height 8 cm. Find its total surface area, to 3 significant figures.",a:408,tol:.5,unit:"cm\xb2",work:["Curved: 2\u03c0 \xd7 5 \xd7 8 = 80\u03c0","Two ends: 2 \xd7 \u03c0 \xd7 5\xb2 = 50\u03c0","130\u03c0 = 408.4\u2026 = 408 cm\xb2"]},{type:"num",q:"A tank is a cuboid 50 cm by 40 cm by 30 cm. How many litres does it hold?",a:60,unit:"litres",work:["50 \xd7 40 \xd7 30 = 60 000 cm\xb3","60 000 \xf7 1000 = 60 litres"]},{type:"expr",s:1,q:"A cylinder has radius 3 cm and height 4 cm. Find its volume in terms of \u03c0.",a:"36\u03c0",show:"36\u03c0",unit:"cm\xb3",work:["V = \u03c0 \xd7 3\xb2 \xd7 4 = 36\u03c0 cm\xb3"]},{type:"num",s:1,q:"A cylinder has volume 500 cm\xb3 and radius 5 cm. Find its height, to 3 significant figures.",a:"6.37",unit:"cm",work:["\u03c0 \xd7 5\xb2 \xd7 h = 500","h = {{500//25\u03c0}}","= 6.366\u2026 = 6.37 cm"]}]},S12:{name:"Cones, pyramids & spheres",ex:[{type:"teach",title:"Pointed solids and spheres",text:"A pyramid or cone holds one third of the prism with the same base and height.",svg:{k:"solid",s:"cone",r:"r",h:"h",l:"l",alt:"A cone with radius r, height h and slant height l"},eq:"cone: V = \u2153\u03c0r\xb2h, curved surface = \u03c0rl     sphere: V = {{4//3}}\u03c0r\xb3, surface = 4\u03c0r\xb2",bullets:["Pyramid: V = \u2153 \xd7 base area \xd7 height."],we:{q:"A cone has radius 5 cm and height 12 cm. Find its slant height.",s:["l\xb2 = r\xb2 + h\xb2 = 25 + 144 = 169","l = \u221a{169}"],a:"13 cm"},warn:"l is the slant height along the sloping side; h is the vertical height. The curved surface uses l, the volume uses h."},{type:"num",q:"A pyramid has a rectangular base 8 cm by 6 cm and height 10 cm. Find its volume.",svg:{k:"solid",s:"pyramid",b:"8 cm",w:"6 cm",h:"10 cm"},a:160,unit:"cm\xb3",work:["Base area: 8 \xd7 6 = 48 cm\xb2","\u2153 \xd7 48 \xd7 10 = 160 cm\xb3"]},{type:"num",q:"A cone has radius 5 cm and height 12 cm. Find its volume, to 3 significant figures.",svg:{k:"solid",s:"cone",r:"5 cm",h:"12 cm"},a:314,tol:.5,unit:"cm\xb3",work:["\u2153 \xd7 \u03c0 \xd7 5\xb2 \xd7 12 = 100\u03c0","= 314.15\u2026 = 314 cm\xb3"]},{type:"num",q:"A cone has radius 5 cm and height 12 cm. Find its curved surface area, to 3 significant figures.",a:204,tol:.5,unit:"cm\xb2",work:["Slant height: l = \u221a{5\xb2 + 12\xb2} = 13 cm","\u03c0rl = \u03c0 \xd7 5 \xd7 13 = 65\u03c0","= 204.2\u2026 = 204 cm\xb2"]},{type:"num",q:"Find the volume of a sphere with radius 6 cm, to 3 significant figures.",svg:{k:"solid",s:"sphere",r:"6 cm"},a:905,tol:.5,unit:"cm\xb3",work:["{{4//3}} \xd7 \u03c0 \xd7 6\xb3 = 288\u03c0","= 904.77\u2026 = 905 cm\xb3"]},{type:"num",q:"Find the surface area of a sphere with radius 6 cm, to 3 significant figures.",a:452,tol:.5,unit:"cm\xb2",work:["4\u03c0 \xd7 6\xb2 = 144\u03c0","= 452.38\u2026 = 452 cm\xb2"]},{type:"num",q:"Find the volume of a hemisphere with radius 3 cm, to 3 significant figures.",svg:{k:"solid",s:"hemi",r:"3 cm"},a:"56.5",unit:"cm\xb3",work:["Half of {{4//3}}\u03c0 \xd7 3\xb3","= 18\u03c0 = 56.548\u2026 = 56.5 cm\xb3"]},{type:"num",s:1,q:"A sphere has volume 1000 cm\xb3. Find its radius, to 3 significant figures.",a:"6.20",unit:"cm",work:["{{4//3}}\u03c0r\xb3 = 1000","r\xb3 = {{3000//4\u03c0}} = 238.73\u2026","r = \u221b{238.73} = 6.20 cm"]}]},S13:{name:"Compound solids",ex:[{type:"teach",title:"Splitting solids",text:"Break a compound solid into parts you know. Add the volumes, or subtract a part that has been cut away.",bullets:["A pipe: outer cylinder minus inner cylinder.","For surface area, count only the faces on the outside: hidden joins don't count.",{s:1,t:"A frustum is a cone with its top cut off: big cone minus small cone."}],we:{q:"A cylinder (radius 3 cm, height 10 cm) has a hemisphere on top. Find its volume.",s:["Cylinder: \u03c0 \xd7 3\xb2 \xd7 10 = 90\u03c0","Hemisphere: \xbd \xd7 {{4//3}}\u03c0 \xd7 3\xb3 = 18\u03c0","Total 108\u03c0 = 339.29\u2026"],a:"339 cm\xb3"}},{type:"num",q:"An ice cream is a cone (radius 3 cm, height 8 cm) with a hemisphere of radius 3 cm on top. Find the total volume, to 3 significant figures.",a:132,tol:.5,unit:"cm\xb3",work:["Cone: \u2153 \xd7 \u03c0 \xd7 9 \xd7 8 = 24\u03c0","Hemisphere: \xbd \xd7 {{4//3}}\u03c0 \xd7 27 = 18\u03c0","42\u03c0 = 131.9\u2026 = 132 cm\xb3"]},{type:"num",q:"A pipe is 20 cm long. Its outer radius is 5 cm and its inner radius is 4 cm. Find the volume of material, to 3 significant figures.",a:565,tol:.5,unit:"cm\xb3",work:["\u03c0 \xd7 5\xb2 \xd7 20 \u2212 \u03c0 \xd7 4\xb2 \xd7 20","= \u03c0 \xd7 20 \xd7 (25 \u2212 16) = 180\u03c0","= 565.48\u2026 = 565 cm\xb3"]},{type:"num",q:"A solid hemisphere has radius 4 cm. Find its total surface area, to 3 significant figures.",a:151,tol:.5,unit:"cm\xb2",work:["Curved part: \xbd \xd7 4\u03c0 \xd7 4\xb2 = 32\u03c0","Flat circle: \u03c0 \xd7 4\xb2 = 16\u03c0","48\u03c0 = 150.79\u2026 = 151 cm\xb2"]},{type:"num",q:"Find the perimeter of a quarter circle with radius 6 cm, to 3 significant figures.",a:"21.4",unit:"cm",work:["Arc: \xbc \xd7 2\u03c0 \xd7 6 = 3\u03c0 = 9.42\u2026","Add two radii: 9.42 + 12","= 21.4 cm"]},{type:"num",s:1,q:"A cone of radius 6 cm and height 12 cm has the top 6 cm cut off, leaving a frustum. The small cone removed has radius 3 cm. Find the volume of the frustum, to 3 significant figures.",svg:{k:"solid",s:"frustum",r:"6 cm",r2:"3 cm",alt:"A frustum"},a:396,tol:.5,unit:"cm\xb3",work:["Big cone: \u2153\u03c0 \xd7 6\xb2 \xd7 12 = 144\u03c0","Small cone: \u2153\u03c0 \xd7 3\xb2 \xd7 6 = 18\u03c0","126\u03c0 = 395.8\u2026 = 396 cm\xb3"]},{type:"mc",s:1,q:"A sphere fits exactly inside a cylinder (same radius, height = diameter). What fraction of the cylinder does the sphere fill?",options:["{{2//3}}","{{1//2}}","{{3//4}}","{{1//3}}"],a:0,why:"Sphere: {{4//3}}\u03c0r\xb3. Cylinder: \u03c0r\xb2 \xd7 2r = 2\u03c0r\xb3. {{4//3}} \xf7 2 = {{2//3}}."}]}});const r=(e,t,a)=>Object.assign({k:"fig",P:{A:[0,0],B:[4,0],C:[4,3]},poly:["ABC"],right:["ABC"],lab:e,angs:t||[],names:!1,alt:"A right-angled triangle"},a||{}),l={k:"graph",xmin:0,xm:360,ymin:-1.5,ym:1.5,xs:90,ys:.5,ph:150,lines:[{p:a(e=>Math.sin(e*Math.PI/180),0,360,90),lab:"y = sin x",at:[350,1.2]}],alt:"Graph of y = sin x from 0\xb0 to 360\xb0"},c={k:"graph",xmin:0,xm:360,ymin:-1.5,ym:1.5,xs:90,ys:.5,ph:150,lines:[{p:a(e=>Math.cos(e*Math.PI/180),0,360,90),lab:"y = cos x",at:[350,1.2]}],alt:"Graph of y = cos x from 0\xb0 to 360\xb0"};e.push({id:"trig",tab:"E6\u20137",title:"Trigonometry & vectors",units:[{code:"6.1\u20136.2",title:"Right-angled triangles",sub:"Pythagoras, SOH CAH TOA and bearings",lessons:["T1","T2","T3","T4"],guide:["Pythagoras: a\xb2 + b\xb2 = c\xb2, where c is the hypotenuse (the longest side, opposite the right angle).","To find a shorter side, subtract: a\xb2 = c\xb2 \u2212 b\xb2.","SOH CAH TOA: sin \u03b8 = {{opp//hyp}}, cos \u03b8 = {{adj//hyp}}, tan \u03b8 = {{opp//adj}}.","To find an angle, use the inverse: \u03b8 = tan\u207b\xb9({{opp//adj}}).","Bearings are measured clockwise from North and written with three figures: 065\xb0.","The bearing back the other way differs by 180\xb0."]},{code:"6.3\u20136.5",s:1,title:"Further trigonometry",sub:"Exact values, trig graphs, sine and cosine rules, 3D",lessons:["T5","T6","T7"],guide:["sin 30\xb0 = cos 60\xb0 = \xbd, sin 60\xb0 = cos 30\xb0 = {{\u221a{3}//2}}, sin 45\xb0 = cos 45\xb0 = {{\u221a{2}//2}}, tan 45\xb0 = 1.","sin x = k has two solutions from 0\xb0 to 360\xb0: x and 180\xb0 \u2212 x.","Sine rule: {{a//sin A}} = {{b//sin B}} = {{c//sin C}}. Use it with a side and its opposite angle.","Cosine rule: a\xb2 = b\xb2 + c\xb2 \u2212 2bc cos A. Use it with two sides and the angle between, or all three sides.","Area of any triangle = \xbdab sin C.","In 3D, find a right-angled triangle inside the shape and use Pythagoras or trig on it."]},{code:"7.1",title:"Transformations",sub:"Reflection, rotation, translation and enlargement",lessons:["T8","T9"],guide:['Reflection: give the mirror line, e.g. "reflection in the line y = 2".',"Rotation: give the centre, the angle and the direction (clockwise or anticlockwise).","Translation: give the column vector: top number across, bottom number up.","Enlargement: give the scale factor and the centre.",{s:1,t:"A negative scale factor puts the image on the other side of the centre, upside down."}]},{code:"7.2\u20137.4",title:"Vectors",sub:"Column vectors, magnitude and vector geometry",lessons:["T10","T11"],guide:["Add or subtract vectors by adding or subtracting the top numbers and the bottom numbers.","ka multiplies both numbers by k. Parallel vectors are multiples of each other.",{s:1,t:"Magnitude: |{{vec:x|y}}| = \u221a{x\xb2 + y\xb2}."},{s:1,t:"To find a vector, follow a route of known vectors. Going backwards along a vector changes its sign: BA = \u2212AB."},{s:1,t:"If OA = a and OB = b, then AB = b \u2212 a."}]}]}),Object.assign(t,{T1:{name:"Pythagoras",ex:[{type:"teach",title:"Pythagoras' theorem",text:"In a right-angled triangle, the square on the hypotenuse equals the sum of the squares on the other two sides.",svg:r({AB:"a",BC:"b",CA:"c"},[],{alt:"Right-angled triangle with hypotenuse c"}),eq:"a\xb2 + b\xb2 = c\xb2",we:{q:"The two shorter sides are 6 cm and 8 cm. Find the hypotenuse.",s:["c\xb2 = 6\xb2 + 8\xb2 = 36 + 64 = 100","c = \u221a{100}"],a:"10 cm"},warn:"To find a shorter side, subtract: a\xb2 = c\xb2 \u2212 b\xb2. Adding would give a side longer than the hypotenuse."},{type:"num",q:"The two shorter sides of a right-angled triangle are 5 cm and 12 cm. Find the hypotenuse.",svg:r({AB:"12 cm",BC:"5 cm",CA:"x"}),a:13,unit:"cm",work:["x\xb2 = 5\xb2 + 12\xb2 = 169","x = 13 cm"]},{type:"num",q:"A right-angled triangle has hypotenuse 10 cm and one side 6 cm. Find the other side.",a:8,unit:"cm",work:["x\xb2 = 10\xb2 \u2212 6\xb2 = 64","x = 8 cm"]},{type:"num",q:"The two shorter sides of a right-angled triangle are 7 cm and 4 cm. Find the hypotenuse, to 3 significant figures.",a:"8.06",unit:"cm",work:["x\xb2 = 49 + 16 = 65","x = \u221a{65} = 8.062\u2026 = 8.06 cm"]},{type:"num",q:"A 5 m ladder leans against a wall. Its foot is 1.5 m from the wall. How high up the wall does it reach, to 3 significant figures?",a:"4.77",unit:"m",work:["h\xb2 = 5\xb2 \u2212 1.5\xb2 = 25 \u2212 2.25 = 22.75","h = \u221a{22.75} = 4.769\u2026 = 4.77 m"]},{type:"num",q:"A rectangle is 9 cm by 12 cm. Find the length of its diagonal.",a:15,unit:"cm",work:["d\xb2 = 9\xb2 + 12\xb2 = 81 + 144 = 225","d = 15 cm"]},{type:"mc",q:"Is a triangle with sides 7 cm, 24 cm and 25 cm right-angled?",options:["Yes, because 7\xb2 + 24\xb2 = 25\xb2","No, because 7 + 24 \u2260 25","Yes, because 25 is the longest side","No, because 24\xb2 + 25\xb2 \u2260 7\xb2"],a:0,why:"49 + 576 = 625 = 25\xb2. If the squares of the two shorter sides add to the square of the longest, the triangle is right-angled."}]},T2:{name:"Trig: finding sides",ex:[{type:"teach",title:"SOH CAH TOA",text:"Label the sides from the angle \u03b8: the hypotenuse is opposite the right angle, the opposite side faces \u03b8, and the adjacent side is next to \u03b8.",svg:r({AB:"adj",BC:"opp",CA:"hyp"},[["BAC","\u03b8"]]),eq:"sin \u03b8 = {{opp//hyp}}     cos \u03b8 = {{adj//hyp}}     tan \u03b8 = {{opp//adj}}",we:{q:"The hypotenuse is 10 cm and \u03b8 = 35\xb0. Find the opposite side.",s:["sin 35\xb0 = {{opp//10}}","opp = 10 \xd7 sin 35\xb0 = 5.735\u2026"],a:"5.74 cm"},warn:"When the unknown is on the bottom of the fraction, divide: hyp = opp \xf7 sin \u03b8."},{type:"mc",q:"You know the hypotenuse and want the side opposite the angle. Which ratio do you use?",options:["sin","cos","tan","Pythagoras"],a:0,why:"Opposite and hypotenuse: SOH, so sine."},{type:"num",q:"Find x, to 3 significant figures.",svg:r({AB:"8 cm",BC:"x"},[["BAC","40\xb0"]]),a:"6.71",unit:"cm",work:["tan 40\xb0 = {{x//8}}","x = 8 tan 40\xb0 = 6.712\u2026 = 6.71 cm"]},{type:"num",q:"Find y, to 3 significant figures.",svg:r({CA:"12 cm",AB:"y"},[["BAC","25\xb0"]]),a:"10.9",unit:"cm",work:["cos 25\xb0 = {{y//12}}","y = 12 cos 25\xb0 = 10.875\u2026 = 10.9 cm"]},{type:"num",q:"In a right-angled triangle, the side opposite a 30\xb0 angle is 5 cm. Find the hypotenuse.",a:10,unit:"cm",work:["sin 30\xb0 = {{5//h}}","h = {{5//sin 30\xb0}} = {{5//0.5}} = 10 cm"]},{type:"num",q:"Find z, to 3 significant figures.",svg:r({BC:"7 cm",CA:"z"},[["BAC","52\xb0"]]),a:"8.88",unit:"cm",work:["sin 52\xb0 = {{7//z}}","z = {{7//sin 52\xb0}} = 8.883\u2026 = 8.88 cm"]},{type:"num",q:"A ramp rises at 12\xb0 to the horizontal and is 3.5 m long. How high does it rise, to 3 significant figures?",a:"0.728",unit:"m",work:["The ramp is the hypotenuse; the rise is opposite the 12\xb0 angle","rise = 3.5 sin 12\xb0 = 0.7276\u2026 = 0.728 m"]}]},T3:{name:"Trig: finding angles",ex:[{type:"teach",title:"Inverse trig",text:"When you know two sides, use the inverse function to find the angle: sin\u207b\xb9, cos\u207b\xb9 or tan\u207b\xb9 (SHIFT then sin, cos or tan).",svg:r({AB:"8 cm",BC:"5 cm"},[["BAC","\u03b8"]]),we:{q:"Opposite = 5 cm and adjacent = 8 cm. Find \u03b8.",s:["tan \u03b8 = {{5//8}}","\u03b8 = tan\u207b\xb9(0.625) = 32.005\u2026"],a:"32.0\xb0"},bullets:["The angle of elevation is measured up from the horizontal; the angle of depression is measured down from the horizontal."]},{type:"num",q:"In a right-angled triangle the opposite side is 7 cm and the hypotenuse is 12 cm. Find the angle, to 1 decimal place.",a:"35.7",unit:"\xb0",work:["sin \u03b8 = {{7//12}}","\u03b8 = sin\u207b\xb9(0.5833\u2026) = 35.68\u2026 = 35.7\xb0"]},{type:"num",q:"Find \u03b8, to 1 decimal place.",svg:r({AB:"9 cm",CA:"15 cm"},[["BAC","\u03b8"]]),a:"53.1",unit:"\xb0",work:["cos \u03b8 = {{9//15}} = 0.6","\u03b8 = cos\u207b\xb9(0.6) = 53.13\u2026 = 53.1\xb0"]},{type:"num",q:"A tree is 12 m tall. From a point 20 m from its base, find the angle of elevation of the top, to 1 decimal place.",a:"31.0",unit:"\xb0",work:["tan \u03b8 = {{12//20}}","\u03b8 = tan\u207b\xb9(0.6) = 30.96\u2026 = 31.0\xb0"]},{type:"num",q:"From the top of an 80 m cliff, the angle of depression of a boat is 25\xb0. How far is the boat from the foot of the cliff, to 3 significant figures?",a:172,tol:.5,unit:"m",work:["The angle of elevation from the boat is also 25\xb0 (alternate angles)","tan 25\xb0 = {{80//d}}","d = {{80//tan 25\xb0}} = 171.56\u2026 = 172 m"]},{type:"mc",q:"Why is the angle of depression from A to B equal to the angle of elevation from B to A?",options:["They are alternate angles between parallel horizontal lines","They are vertically opposite","They add to 90\xb0","They are angles in a semicircle"],a:0,why:"The horizontal lines at A and B are parallel, so the two angles form a Z shape: alternate angles."}]},T4:{name:"Bearings",ex:[{type:"teach",title:"Three-figure bearings",text:"A bearing gives a direction: the angle measured clockwise from North, written with three figures.",svg:{k:"bearing",deg:65,alt:"Bearing of 065\xb0 from A to B"},bullets:["East is 090\xb0, South is 180\xb0, West is 270\xb0.","The back bearing (from B to A) is the bearing \xb1 180\xb0."],we:{q:"The bearing of B from A is 065\xb0. Find the bearing of A from B.",s:["065 + 180"],a:"245\xb0"}},{type:"num",q:"What is the bearing of B from A?",svg:{k:"bearing",deg:130,lab:!1},a:130,show:"130\xb0",unit:"\xb0",work:["Measure clockwise from North: 130\xb0"]},{type:"num",q:"The bearing of B from A is 140\xb0. Find the bearing of A from B.",a:320,unit:"\xb0",work:["140 + 180 = 320\xb0"]},{type:"num",q:"The bearing of Q from P is 250\xb0. Find the bearing of P from Q.",a:70,show:"070\xb0",unit:"\xb0",work:["250 \u2212 180 = 70","Write it with three figures: 070\xb0"]},{type:"mc",q:"Which bearing is south-west?",options:["225\xb0","135\xb0","315\xb0","045\xb0"],a:0,why:"South is 180\xb0 and west is 270\xb0. South-west is halfway: 225\xb0."},{type:"num",q:"A ship sails 8 km due East, then 6 km due South. How far is it from its starting point?",a:10,unit:"km",work:["The route makes a right-angled triangle","\u221a{8\xb2 + 6\xb2} = \u221a{100} = 10 km"]},{type:"num",q:"A plane flies 20 km on a bearing of 060\xb0. How far east of its start is it, to 3 significant figures?",a:"17.3",unit:"km",work:["The angle between North and the path is 60\xb0, so East is opposite it","east = 20 sin 60\xb0 = 17.32\u2026 = 17.3 km"]}]},T5:{name:"Exact values & trig graphs",ex:[{type:"teach",title:"Exact values",text:"Learn these exact values: they come up without a calculator.",bullets:["sin 30\xb0 = \xbd, cos 30\xb0 = {{\u221a{3}//2}}, tan 30\xb0 = {{1//\u221a{3}}} = {{\u221a{3}//3}}","sin 45\xb0 = cos 45\xb0 = {{\u221a{2}//2}}, tan 45\xb0 = 1","sin 60\xb0 = {{\u221a{3}//2}}, cos 60\xb0 = \xbd, tan 60\xb0 = \u221a{3}","sin 0\xb0 = 0, cos 0\xb0 = 1, sin 90\xb0 = 1, cos 90\xb0 = 0"],we:{q:"Find the exact value of sin 60\xb0 \xd7 tan 60\xb0.",s:["{{\u221a{3}//2}} \xd7 \u221a{3}","= {{3//2}}"],a:"{{3//2}}"}},{type:"mc",q:"What is the exact value of tan 60\xb0?",options:["\u221a{3}","{{\u221a{3}//2}}","\xbd","{{1//\u221a{3}}}"],a:0,why:"tan 60\xb0 = {{sin 60\xb0//cos 60\xb0}} = {{\u221a{3}//2}} \xf7 \xbd = \u221a{3}."},{type:"mc",q:"What is the exact value of cos 45\xb0?",options:["{{\u221a{2}//2}}","\xbd","1","{{\u221a{3}//2}}"],a:0,why:"cos 45\xb0 = sin 45\xb0 = {{1//\u221a{2}}} = {{\u221a{2}//2}}."},{type:"teach",title:"Trig graphs",text:"The sine and cosine graphs are waves between \u22121 and 1 that repeat every 360\xb0. The tan graph repeats every 180\xb0 and has asymptotes at 90\xb0 and 270\xb0.",svg:l,bullets:["sin x = k has two answers from 0\xb0 to 360\xb0: x and 180\xb0 \u2212 x.","cos x = k: x and 360\xb0 \u2212 x.","tan x = k: x and x + 180\xb0."],we:{q:"Solve sin x = 0.5 for 0\xb0 \u2264 x \u2264 360\xb0.",s:["sin\u207b\xb9(0.5) = 30\xb0","The other: 180 \u2212 30 = 150\xb0"],a:"30\xb0, 150\xb0"}},{type:"list",q:"Solve cos x = \u22120.5 for 0\xb0 \u2264 x \u2264 360\xb0.",svg:c,a:[120,240],show:"120\xb0, 240\xb0",work:["cos\u207b\xb9(\u22120.5) = 120\xb0","The other: 360 \u2212 120 = 240\xb0"]},{type:"list",q:"Solve tan x = 1 for 0\xb0 \u2264 x \u2264 360\xb0.",a:[45,225],show:"45\xb0, 225\xb0",work:["tan\u207b\xb9(1) = 45\xb0","tan repeats every 180\xb0: 45 + 180 = 225\xb0"]},{type:"num",q:"sin x = 0.8 and x is obtuse. Find x, to 1 decimal place.",a:"126.9",unit:"\xb0",work:["sin\u207b\xb9(0.8) = 53.13\u2026\xb0, which is acute","The obtuse solution: 180 \u2212 53.13 = 126.87\u2026 = 126.9\xb0"]}]},T6:{name:"Sine & cosine rules",ex:[{type:"teach",title:"Any triangle",text:"For triangles without a right angle. Label the sides a, b, c opposite the angles A, B, C.",svg:{k:"fig",P:{A:[0,0],B:[6,0],C:[2,3.5]},poly:["ABC"],lab:{BC:"a",CA:"b",AB:"c"},alt:"Triangle ABC with sides a, b and c"},eq:"{{a//sin A}} = {{b//sin B}}     a\xb2 = b\xb2 + c\xb2 \u2212 2bc cos A",bullets:["Sine rule: you know a side and the angle opposite it.","Cosine rule: two sides and the angle between them, or all three sides."],we:{q:"b = 7, c = 9 and A = 50\xb0. Find a.",s:["a\xb2 = 49 + 81 \u2212 2 \xd7 7 \xd7 9 \xd7 cos 50\xb0","= 130 \u2212 80.99\u2026 = 49.01\u2026","a = 7.000\u2026"],a:"7.00"}},{type:"mc",q:"You know two sides and the angle between them. Which rule finds the third side?",options:["Cosine rule","Sine rule","Pythagoras","SOH CAH TOA"],a:0,why:"The cosine rule a\xb2 = b\xb2 + c\xb2 \u2212 2bc cos A uses two sides and the angle between them."},{type:"num",q:"In triangle ABC, A = 40\xb0, B = 75\xb0 and a = 8 cm. Find b, to 3 significant figures.",a:"12.0",unit:"cm",work:["{{b//sin 75\xb0}} = {{8//sin 40\xb0}}","b = {{8 sin 75\xb0//sin 40\xb0}} = 12.02\u2026 = 12.0 cm"]},{type:"num",q:"In triangle ABC, b = 5 cm, c = 8 cm and A = 60\xb0. Find a.",a:7,unit:"cm",work:["a\xb2 = 25 + 64 \u2212 2 \xd7 5 \xd7 8 \xd7 cos 60\xb0","= 89 \u2212 40 = 49","a = 7 cm"]},{type:"num",q:"A triangle has sides 7 cm, 5 cm and 8 cm. Find the angle opposite the 7 cm side.",a:60,unit:"\xb0",work:["cos A = {{5\xb2 + 8\xb2 \u2212 7\xb2//2 \xd7 5 \xd7 8}} = {{40//80}} = 0.5","A = 60\xb0"]},{type:"num",q:"In triangle ABC, a = 10 cm, b = 12 cm and A = 50\xb0. Find angle B (acute), to 1 decimal place.",a:"66.8",unit:"\xb0",work:["{{sin B//12}} = {{sin 50\xb0//10}}","sin B = 0.9193\u2026","B = 66.82\u2026 = 66.8\xb0"]},{type:"num",q:"Two ships leave a port. One sails 9 km, the other 14 km, with an angle of 35\xb0 between their paths. How far apart are they, to 3 significant figures?",a:"8.40",unit:"km",work:["d\xb2 = 9\xb2 + 14\xb2 \u2212 2 \xd7 9 \xd7 14 \xd7 cos 35\xb0","= 277 \u2212 206.43\u2026 = 70.57\u2026","d = \u221a{70.57} = 8.400\u2026 = 8.40 km"]}]},T7:{name:"Area & 3D trigonometry",ex:[{type:"teach",title:"Area of any triangle",text:"Use two sides and the angle between them.",eq:"Area = \xbdab sin C",we:{q:"Two sides are 8 cm and 11 cm, with 40\xb0 between them. Find the area.",s:["\xbd \xd7 8 \xd7 11 \xd7 sin 40\xb0","= 44 \xd7 0.6427\u2026"],a:"28.3 cm\xb2"}},{type:"num",q:"A triangle has sides 6 cm and 9 cm with an angle of 120\xb0 between them. Find its area, to 3 significant figures.",a:"23.4",unit:"cm\xb2",work:["\xbd \xd7 6 \xd7 9 \xd7 sin 120\xb0","= 27 \xd7 0.8660\u2026 = 23.38\u2026 = 23.4 cm\xb2"]},{type:"num",q:"A triangle has area 30 cm\xb2 and two sides 8 cm and 10 cm. Find the acute angle between them, to 1 decimal place.",a:"48.6",unit:"\xb0",work:["\xbd \xd7 8 \xd7 10 \xd7 sin C = 30","sin C = {{30//40}} = 0.75","C = 48.59\u2026 = 48.6\xb0"]},{type:"teach",title:"Trigonometry in 3D",text:"Find a right-angled triangle inside the solid. You often need two steps: one across the base, then one up.",svg:{k:"solid",s:"cuboid",l:"l",w:"w",h:"h",diag:1,alt:"A cuboid with its space diagonal"},eq:"diagonal of a cuboid = \u221a{l\xb2 + w\xb2 + h\xb2}",we:{q:"A cuboid is 3 cm by 4 cm by 12 cm. Find its diagonal.",s:["\u221a{3\xb2 + 4\xb2 + 12\xb2} = \u221a{169}"],a:"13 cm"}},{type:"num",q:"A cuboid is 8 cm by 5 cm by 3 cm. Find the length of its space diagonal, to 3 significant figures.",a:"9.90",unit:"cm",work:["\u221a{64 + 25 + 9} = \u221a{98}","= 9.899\u2026 = 9.90 cm"]},{type:"num",q:"For the same cuboid (8 cm by 5 cm by 3 cm), find the angle between the space diagonal and the base, to 1 decimal place.",a:"17.6",unit:"\xb0",work:["Diagonal of the base: \u221a{8\xb2 + 5\xb2} = \u221a{89} = 9.433\u2026","tan \u03b8 = {{3//9.433}}","\u03b8 = 17.64\u2026 = 17.6\xb0"]}]},T8:{name:"Reflect, rotate, translate",ex:[{type:"teach",title:"Describing transformations",text:"Each transformation needs exactly the right details.",svg:{k:"grid",x:[-5,5],y:[-1,5],shapes:[{p:[[1,1],[3,1],[3,2]],lab:"A"},{p:[[-1,1],[-3,1],[-3,2]],c:2,lab:"B"}],alt:"Shape A reflected in the y-axis to make B"},bullets:["Reflection: the mirror line (here the y-axis, x = 0).","Rotation: centre, angle and direction.","Translation: a column vector. {{vec:3|\u22122}} means 3 right and 2 down."],warn:'One transformation only. "Reflected then moved" won\'t get the marks.'},{type:"mc",q:"Describe the single transformation that maps A onto B.",svg:{k:"grid",x:[-5,5],y:[-1,5],shapes:[{p:[[1,1],[3,1],[3,2]],lab:"A"},{p:[[-1,1],[-3,1],[-3,2]],c:2,lab:"B"}]},options:["Reflection in the y-axis","Reflection in the x-axis","Rotation 180\xb0 about (0, 0)","Translation {{vec:\u22124|0}}"],a:0,why:"Every point keeps its height and flips to the other side of the y-axis: a reflection in x = 0."},{type:"fill",vec:1,q:"Write the translation that maps A onto B as a column vector.",svg:{k:"grid",x:[-4,5],y:[-3,4],shapes:[{p:[[-3,1],[-1,1],[-1,3]],lab:"A"},{p:[[1,-2],[3,-2],[3,0]],c:2,lab:"B"}]},a:[4,-3],hint:"Top number: right (+) or left (\u2212). Bottom: up (+) or down (\u2212).",work:["Each corner moves 4 right and 3 down","{{vec:4|\u22123}}"]},{type:"fill",q:"The point (3, 1) is rotated 90\xb0 anticlockwise about the origin. Where does it go?",t:"( @ , @ )",a:[-1,3],work:["Rotating 90\xb0 anticlockwise about (0, 0): (x, y) \u2192 (\u2212y, x)","(3, 1) \u2192 (\u22121, 3)"]},{type:"fill",q:"The point (2, 5) is reflected in the x-axis. Where does it go?",t:"( @ , @ )",a:[2,-5],work:["Reflecting in the x-axis keeps x and changes the sign of y","(2, \u22125)"]},{type:"fill",q:"The point (4, \u22122) is reflected in the line y = x. Where does it go?",t:"( @ , @ )",a:[-2,4],work:["Reflecting in y = x swaps the coordinates","(\u22122, 4)"]},{type:"mc",q:"Which details fully describe a rotation?",options:["Centre, angle and direction","Angle only","Mirror line","Scale factor and centre"],a:0,why:"For example: rotation 90\xb0 clockwise about (1, 2)."}]},T9:{name:"Enlargement",ex:[{type:"teach",title:"Scale factor and centre",text:"An enlargement multiplies every distance from the centre by the scale factor k.",svg:{k:"grid",x:[0,8],y:[0,6],shapes:[{p:[[1,1],[3,1],[1,2]],lab:"A"},{p:[[2,2],[6,2],[2,4]],c:2,lab:"B"}],lines:[{p:[[0,0],[6,2]],c:"gd"},{p:[[0,0],[2,4]],c:"gd"}],pts:[[0,0,"centre","r"]],alt:"Enlargement scale factor 2 from the origin"},bullets:["k = 2 doubles every length. A fraction like \xbd makes the shape smaller.","Angles stay the same.",{s:1,t:"A negative k puts the image on the opposite side of the centre, upside down."}],we:{q:"Enlarge the point (2, 1) by scale factor 3, centre (0, 0).",s:["Multiply each coordinate by 3"],a:"(6, 3)"}},{type:"fill",q:"The point (1, 2) is enlarged by scale factor 2, centre (0, 0). Where does it go?",t:"( @ , @ )",a:[2,4],work:["(1 \xd7 2, 2 \xd7 2) = (2, 4)"]},{type:"fill",q:"The point (4, 6) is enlarged by scale factor \xbd, centre (2, 2). Where does it go?",t:"( @ , @ )",a:[3,4],wor
