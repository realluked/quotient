k:["From the centre the point is 2 right, 4 up","Halve it: 1 right, 2 up","(2 + 1, 2 + 2) = (3, 4)"]},{type:"num",q:"A shape with perimeter 10 cm is enlarged by scale factor 3. Find the new perimeter.",a:30,unit:"cm",work:["Every length \xd7 3","10 \xd7 3 = 30 cm"]},{type:"mc",q:"An enlargement has scale factor \xbd. What happens to the shape?",options:["Every length is halved","It doubles in size","It is reflected","Its angles are halved"],a:0,why:"A fractional scale factor between 0 and 1 makes the shape smaller. Angles never change."},{type:"num",s:1,q:"A shape with area 5 cm\xb2 is enlarged by scale factor 3. Find the new area.",a:45,unit:"cm\xb2",work:["Area factor = 3\xb2 = 9","5 \xd7 9 = 45 cm\xb2"]},{type:"fill",s:1,q:"The point (3, 1) is enlarged by scale factor \u22122, centre (0, 0). Where does it go?",t:"( @ , @ )",a:[-6,-2],work:["Multiply each coordinate by \u22122","(\u22126, \u22122): on the other side of the origin"]}]},T10:{name:"Column vectors",ex:[{type:"teach",title:"Vectors",text:"A vector has a size and a direction. A column vector gives the movement across (top) and up (bottom).",svg:{k:"grid",x:[-1,6],y:[-1,4],vecs:[{at:[0,0],v:[4,3],lab:"a"}],alt:"Vector a = 4 across, 3 up"},bullets:["Add or subtract the top numbers, then the bottom numbers.","2a doubles both numbers and points the same way; \u2212a points the opposite way.",{s:1,t:"Magnitude |a| = \u221a{x\xb2 + y\xb2}: here \u221a{16 + 9} = 5."}],we:{q:"a = {{vec:2|5}} and b = {{vec:\u22121|3}}. Find a + b.",s:["Top: 2 + (\u22121) = 1","Bottom: 5 + 3 = 8"],a:"{{vec:1|8}}"}},{type:"fill",vec:1,q:"a = {{vec:2|5}} and b = {{vec:\u22121|3}}. Find a + b.",t:"a + b = ",a:[1,8],work:["2 + (\u22121) = 1","5 + 3 = 8"]},{type:"fill",vec:1,q:"a = {{vec:2|5}} and b = {{vec:\u22121|3}}. Find 3a \u2212 2b.",t:"3a \u2212 2b = ",a:[8,9],work:["3a = {{vec:6|15}} and 2b = {{vec:\u22122|6}}","6 \u2212 (\u22122) = 8","15 \u2212 6 = 9"]},{type:"fill",vec:1,q:"Write the vector shown as a column vector.",svg:{k:"grid",x:[-1,6],y:[-4,2],vecs:[{at:[0,1],v:[5,-4],lab:"p"}]},t:"p = ",a:[5,-4],work:["5 across to the right, 4 down","{{vec:5|\u22124}}"]},{type:"mc",q:"Which vector is parallel to {{vec:2|\u22123}}?",options:["{{vec:\u22124|6}}","{{vec:3|\u22122}}","{{vec:2|3}}","{{vec:\u22123|2}}"],a:0,why:"{{vec:\u22124|6}} = \u22122 \xd7 {{vec:2|\u22123}}. Parallel vectors are multiples of each other."},{type:"num",s:1,q:"Find the magnitude of the vector {{vec:6|\u22128}}.",a:10,work:["\u221a{6\xb2 + (\u22128)\xb2} = \u221a{36 + 64} = \u221a{100} = 10"]},{type:"num",s:1,q:"Find |a| when a = {{vec:3|7}}, to 3 significant figures.",a:"7.62",work:["\u221a{9 + 49} = \u221a{58} = 7.615\u2026 = 7.62"]}]},T11:{name:"Vector geometry",ex:[{type:"teach",title:"Routes and midpoints",text:"To find a vector, follow a route made of vectors you know.",svg:{k:"fig",P:{O:[0,0],A:[1,3],B:[5,1],M:[3,2]},seg:["OA","OB","AB"],vec:["OA","OB"],dots:["M"],lab:{OA:"a",OB:"b"},alt:"Triangle OAB with M the midpoint of AB"},bullets:["AB = AO + OB = \u2212a + b = b \u2212 a.","M is the midpoint of AB, so AM = \xbdAB.","OM = OA + AM = a + \xbd(b \u2212 a) = \xbda + \xbdb."],we:{q:"OA = a and OB = b. P is on AB with AP : PB = 1 : 2. Find OP.",s:["AP = \u2153AB = \u2153(b \u2212 a)","OP = a + \u2153(b \u2212 a)","= \u2154a + \u2153b"],a:"\u2154a + \u2153b"}},{type:"expr",q:"OA = a and OB = b. Find the vector AB in terms of a and b.",a:"b-a",show:"b \u2212 a",keys:["a","b","\u2212","(",")","/"],work:["AB = AO + OB","= \u2212a + b = b \u2212 a"]},{type:"expr",q:"OA = a and OB = b. M is the midpoint of AB. Find OM in terms of a and b.",a:"(a+b)/2",show:"\xbda + \xbdb",keys:["a","b","\u2212","(",")","/"],work:["AM = \xbd(b \u2212 a)","OM = a + \xbd(b \u2212 a)","= \xbda + \xbdb"]},{type:"expr",q:"OABC is a parallelogram with OA = a and OC = c. Find the diagonal AC in terms of a and c.",a:"c-a",show:"c \u2212 a",keys:["a","c","\u2212","(",")"],work:["AC = AO + OC","= \u2212a + c = c \u2212 a"]},{type:"expr",q:"OA = a and OB = b. P is on AB so that AP : PB = 1 : 3. Find OP in terms of a and b.",a:"(3a+b)/4",show:"\xbea + \xbcb",keys:["a","b","\u2212","(",")","/"],work:["AP = \xbc(b \u2212 a)","OP = a + \xbc(b \u2212 a)","= \xbea + \xbcb"]},{type:"mc",q:"PQ = 2a + b and RS = 6a + 3b. What does this show?",options:["RS is parallel to PQ and 3 times as long","RS is perpendicular to PQ","P, Q, R and S lie on a circle","RS is the same length as PQ"],a:0,why:"6a + 3b = 3(2a + b), so RS is a multiple of PQ: parallel, and 3 times the length."}]}});const h={k:"venn",v:{a:12,ab:5,b:8,o:5},alt:"Venn diagram: 12 in A only, 5 in both, 8 in B only, 5 in neither"},d={k:"tree",h1:"1st",h2:"2nd",b:[{l:"R",p:"3/5",n:[{l:"R",p:"3/5"},{l:"B",p:"2/5"}]},{l:"B",p:"2/5",n:[{l:"R",p:"3/5"},{l:"B",p:"2/5"}]}],alt:"Tree diagram for two picks with replacement"},u={k:"graph",x:"hours revised",y:"test score",xm:10,ym:100,xs:1,ys:10,ph:170,pts:[[1,32],[2,40],[3,45],[4,50],[5,58],[6,61],[7,70],[8,74],[9,80]],lines:[{p:[[0,27],[10,87]],c:"gdr"}],alt:"Scatter graph showing positive correlation"},m={k:"graph",x:"time (minutes)",y:"cumulative frequency",xm:50,ym:50,xs:10,ys:10,minor:2,ph:180,lines:[{p:[[0,0],[10,5],[20,17],[30,35],[40,45],[50,50]]}],alt:"Cumulative frequency graph"},p={k:"hist",x:"length (cm)",bins:[[0,10,1.2],[10,15,3],[15,20,4],[20,40,.5]],xs:5,ym:4.5,ys:.5,alt:"Histogram with unequal class widths"};e.push({id:"data",tab:"E8\u20139",title:"Probability & statistics",units:[{code:"8.1\u20138.2",title:"Probability",sub:"The probability scale, relative and expected frequency",lessons:["P1","P2"],guide:["P(event) = {{number of ways it can happen//total number of equally likely outcomes}}.","Probabilities go from 0 (impossible) to 1 (certain). P(not A) = 1 \u2212 P(A).","Relative frequency = {{frequency//number of trials}}: an estimate of the probability.","Expected number = probability \xd7 number of trials."]},{code:"8.3",title:"Combined events",sub:"Sample spaces, Venn diagrams and tree diagrams",lessons:["P3","P4"],guide:["Two dice give 6 \xd7 6 = 36 equally likely outcomes. List or draw them in a sample space.","Mutually exclusive (can't both happen): P(A or B) = P(A) + P(B).","Independent (one doesn't affect the other): P(A and B) = P(A) \xd7 P(B).","Tree diagrams: multiply along the branches, then add the outcomes you want.",{s:1,t:"Without replacement, the second branches change: one fewer item in the bag."}]},{code:"8.4",s:1,title:"Conditional probability",sub:"Given that\u2026",lessons:["P5"],guide:["P(A given B) means: of the outcomes in B, what fraction are also in A?","P(A given B) = {{P(A and B)//P(B)}}.","From a Venn diagram: {{number in A \u2229 B//number in B}}."]},{code:"9.1\u20139.3",title:"Averages and spread",sub:"Mean, median, mode, range and frequency tables",lessons:["P6","P7"],guide:["Mean = {{total//number of values}}. Median: the middle value once they are in order. Mode: the most common. Range = largest \u2212 smallest.","From a frequency table: mean = {{\u03a3fx//\u03a3f}}.","Grouped data: use the midpoint of each group. The answer is an estimate.",{s:1,t:"Quartiles split ordered data into quarters. Interquartile range = upper quartile \u2212 lower quartile."}]},{code:"9.4\u20139.5",title:"Charts and scatter graphs",sub:"Bar, pie and stem-and-leaf charts, correlation",lessons:["P8","P9"],guide:["Pie chart angle = {{frequency//total}} \xd7 360\xb0.","Stem-and-leaf diagrams need a key, like 2 | 3 = 23.","Correlation: positive (both go up), negative (one up, one down) or none.","A line of best fit follows the trend with about as many points above it as below. Only trust estimates inside the range of the data."]},{code:"9.6\u20139.7",s:1,title:"Cumulative frequency & histograms",sub:"Medians and quartiles from graphs, frequency density",lessons:["P10","P11"],guide:["Cumulative frequency: running totals, plotted at the upper end of each class.","Median at {{n//2}}, lower quartile at {{n//4}}, upper quartile at {{3n//4}} on the cumulative frequency axis.","Histogram: frequency density = {{frequency//class width}}. The area of each bar is the frequency."]}]}),Object.assign(t,{P1:{name:"Probability",ex:[{type:"teach",title:"Chance as a number",text:"If every outcome is equally likely, the probability of an event is the fraction of outcomes that give it.",eq:"P(event) = {{favourable outcomes//total outcomes}}",bullets:["0 means impossible, 1 means certain.","The probabilities of all the outcomes add to 1, so P(not A) = 1 \u2212 P(A)."],we:{q:"A bag has 3 red and 5 blue counters. One is picked at random. Find P(red).",s:["3 red out of 8 counters"],a:"{{3//8}}"}},{type:"num",q:"A bag has 3 red and 5 blue counters. One is picked at random. Find the probability that it is NOT red.",a:"5/8",show:"{{5//8}}",work:["P(not red) = 1 \u2212 {{3//8}} = {{5//8}}"]},{type:"num",q:"A fair spinner has 5 equal sections numbered 1 to 5. Find the probability of landing on a prime number.",a:"3/5",show:"{{3//5}}",work:["The primes are 2, 3 and 5","3 out of 5"]},{type:"num",q:"The probability that it rains tomorrow is 0.35. What is the probability that it doesn't rain?",a:.65,work:["1 \u2212 0.35 = 0.65"]},{type:"num",q:"A spinner lands on A, B, C or D. P(A) = 0.2, P(B) = 0.35 and P(D) = 0.15. Find P(C).",table:[["Letter","A","B","C","D"],["Probability","0.2","0.35","x","0.15"]],a:.3,work:["The probabilities add to 1","1 \u2212 0.2 \u2212 0.35 \u2212 0.15 = 0.3"]},{type:"mc",q:"Which probability means an event is impossible?",options:["0","1","0.5","\u22121"],a:0,why:"Probabilities go from 0 (impossible) to 1 (certain). They are never negative."},{type:"num",q:"A letter is chosen at random from the word PROBABILITY. Find P(B).",a:"2/11",show:"{{2//11}}",work:["PROBABILITY has 11 letters, and 2 of them are B","{{2//11}}"]}]},P2:{name:"Relative & expected frequency",ex:[{type:"teach",title:"Experiments",text:"When you can't work out a probability, do an experiment and use the relative frequency.",eq:"relative frequency = {{frequency//number of trials}}     expected number = P \xd7 trials",bullets:["More trials give a more reliable estimate."],we:{q:"A fair dice is rolled 300 times. How many sixes would you expect?",s:["P(6) = {{1//6}}","{{1//6}} \xd7 300"],a:"50"}},{type:"num",q:"A coin is thrown 200 times and lands heads 112 times. Find the relative frequency of heads.",a:.56,work:["{{112//200}} = 0.56"]},{type:"num",q:"The probability that a traffic light is red when Ana arrives is 0.3. She passes it on 50 days. On how many days would you expect it to be red?",a:15,work:["0.3 \xd7 50 = 15"]},{type:"num",q:"A spinner lands on blue 45 times in 120 spins. Estimate the probability of blue.",a:.375,work:["{{45//120}} = 0.375"]},{type:"num",q:"A bag has 20 counters. In many draws (putting each counter back), the relative frequency of red was 0.35. Estimate how many red counters are in the bag.",a:7,work:["0.35 \xd7 20 = 7"]},{type:"mc",q:"Four students roll the same dice to estimate P(6). Whose estimate is most reliable?",options:["Dev: 500 rolls","Ama: 20 rolls","Leo: 60 rolls","Kim: 6 rolls"],a:0,why:"The more trials, the closer the relative frequency is likely to be to the true probability."},{type:"mc",q:"A dice was rolled 600 times and showed 6 on 240 of them. What does this suggest?",options:["The dice is probably biased","The dice is fair","A 6 is impossible","Each number came up 100 times"],a:0,why:"You would expect about {{1//6}} \xd7 600 = 100 sixes. 240 is far more than that."}]},P3:{name:"Combined events",ex:[{type:"teach",title:"Two things at once",text:"List every outcome in a sample space, or use a Venn diagram to sort them.",svg:h,bullets:["Two dice: 6 \xd7 6 = 36 outcomes.","Independent events: P(A and B) = P(A) \xd7 P(B).","Mutually exclusive events: P(A or B) = P(A) + P(B)."],we:{q:"Using the Venn diagram (30 people), find P(A).",s:["In A: 12 + 5 = 17","17 out of 30"],a:"{{17//30}}"}},{type:"num",q:"Two fair dice are rolled. Find the probability that the total is 7.",a:"1/6",show:"{{1//6}}",work:["Ways to make 7: 1+6, 2+5, 3+4, 4+3, 5+2, 6+1","{{6//36}} = {{1//6}}"]},{type:"num",q:"A coin is thrown and a dice is rolled. Find P(head and a 6).",a:"1/12",show:"{{1//12}}",work:["Independent: \xbd \xd7 {{1//6}} = {{1//12}}"]},{type:"num",q:"Use the Venn diagram. A person is chosen at random. Find P(A \u2229 B).",svg:h,a:"1/6",show:"{{1//6}}",work:["A \u2229 B (in both): 5 people","{{5//30}} = {{1//6}}"]},{type:"num",q:"Use the Venn diagram. Find P(A \u222a B).",svg:h,a:"5/6",show:"{{5//6}}",work:["A \u222a B (in A or B or both): 12 + 5 + 8 = 25","{{25//30}} = {{5//6}}"]},{type:"num",q:"A and B are independent. P(A) = 0.3 and P(B) = 0.5. Find P(A and B).",a:.15,work:["0.3 \xd7 0.5 = 0.15"]},{type:"num",q:"A counter is picked from a bag. P(red) = 0.2 and P(blue) = 0.45. Find P(red or blue).",a:.65,work:["A counter can't be both colours, so add","0.2 + 0.45 = 0.65"]}]},P4:{name:"Tree diagrams",ex:[{type:"teach",title:"Multiply along, add down",text:"A tree diagram shows two (or more) events one after the other.",svg:d,bullets:["Multiply along the branches to get the probability of each route.","Add the routes that give what you want.","The branches from each point add to 1."],we:{q:"A bag has 3 red and 2 blue counters. One is taken, replaced, then another is taken. Find P(both red).",s:["{{3//5}} \xd7 {{3//5}}"],a:"{{9//25}}"}},{type:"num",q:"Using the same bag (with replacement), find P(one red and one blue, in either order).",svg:d,a:"12/25",show:"{{12//25}}",work:["RB: {{3//5}} \xd7 {{2//5}} = {{6//25}}","BR: {{2//5}} \xd7 {{3//5}} = {{6//25}}","Add: {{12//25}}"]},{type:"num",q:"Using the same bag (with replacement), find P(at least one blue).",a:"16/25",show:"{{16//25}}",work:["The only route with no blue is RR: {{9//25}}","1 \u2212 {{9//25}} = {{16//25}}"]},{type:"num",q:"The probability it rains on any day is 0.3, independently. Find the probability it rains on both Saturday and Sunday.",a:.09,work:["0.3 \xd7 0.3 = 0.09"]},{type:"num",q:"The probability it rains on any day is 0.3, independently. Find the probability it rains on neither day.",a:.49,work:["P(no rain) = 0.7","0.7 \xd7 0.7 = 0.49"]},{type:"teach",s:1,title:"Without replacement",text:"If the first item isn't put back, the bag changes: the second branches have one fewer item.",we:{q:"3 red and 2 blue counters. Two are taken without replacement. Find P(both red).",s:["First red: {{3//5}}","Then 2 red are left out of 4: {{2//4}}","{{3//5}} \xd7 {{2//4}} = {{6//20}}"],a:"{{3//10}}"},warn:"Check the numbers on the second branches: both the top and the bottom of the fraction may go down by 1."},{type:"num",s:1,q:"3 red and 2 blue counters. Two are taken without replacement. Find P(both blue).",a:"1/10",show:"{{1//10}}",work:["{{2//5}} \xd7 {{1//4}} = {{2//20}} = {{1//10}}"]},{type:"num",s:1,q:"A box has 4 lemon and 6 orange sweets. Two are eaten without replacement. Find P(one of each).",a:"8/15",show:"{{8//15}}",work:["LO: {{4//10}} \xd7 {{6//9}} = {{24//90}}","OL: {{6//10}} \xd7 {{4//9}} = {{24//90}}","{{48//90}} = {{8//15}}"]}]},P5:{name:"Conditional probability",ex:[{type:"teach",title:"Given that\u2026",text:'"Given that B happened" shrinks the outcomes to just those in B.',svg:h,eq:"P(A given B) = {{P(A and B)//P(B)}}",we:{q:"Using the Venn diagram, find P(A given B).",s:["B has 5 + 8 = 13 people","5 of them are also in A"],a:"{{5//13}}"}},{type:"num",q:"Use the Venn diagram. A person in A is chosen at random. Find the probability that they are also in B.",svg:h,a:"5/17",show:"{{5//17}}",work:["A has 12 + 5 = 17 people","5 of them are in B","{{5//17}}"]},{type:"num",q:"Of 40 students, 25 study French. 10 of the French students also study Spanish. A French student is chosen at random. Find the probability that they also study Spanish.",a:"2/5",show:"{{2//5}}",work:["Only the 25 French students count","{{10//25}} = {{2//5}}"]},{type:"num",q:"P(A and B) = 0.12 and P(B) = 0.4. Find P(A given B).",a:.3,work:["{{0.12//0.4}} = 0.3"]},{type:"num",q:"A bag has 10 sweets: 4 lemon and 6 orange. Tom eats a lemon one. Find the probability that the next sweet he takes is lemon.",a:"1/3",show:"{{1//3}}",work:["After eating one lemon, 3 lemon are left out of 9","{{3//9}} = {{1//3}}"]},{type:"mc",q:"P(A given B) = P(A). What does this tell you?",options:["A and B are independent","A and B are mutually exclusive","P(B) = 0","A always happens"],a:0,why:"Knowing B happened doesn't change the chance of A, so A doesn't depend on B."}]},P6:{name:"Averages & range",ex:[{type:"teach",title:"Mean, median, mode and range",text:"Three kinds of average, and one measure of spread.",bullets:["Mean: add them up and divide by how many there are.","Median: put them in order and take the middle. With two middle values, take halfway between them.","Mode: the most common value.","Range: largest \u2212 smallest. It measures how spread out the data is."],we:{q:"Find the mean, median, mode and range of 3, 7, 7, 2, 9.",s:["Mean: 28 \xf7 5 = 5.6","In order: 2, 3, 7, 7, 9, so median = 7","Mode = 7, range = 9 \u2212 2 = 7"],a:"5.6, 7, 7, 7"}},{type:"num",q:"Find the mean of 4, 8, 6, 5, 7.",a:6,work:["4 + 8 + 6 + 5 + 7 = 30","30 \xf7 5 = 6"]},{type:"num",q:"Find the median of 12, 5, 9, 3, 15, 8.",a:8.5,work:["In order: 3, 5, 8, 9, 12, 15","The middle two are 8 and 9","Median = 8.5"]},{type:"num",q:"Find the range of 3, 5, 5, 6, 8, 8, 8, 9.",a:6,work:["9 \u2212 3 = 6"]},{type:"num",q:"The mean of five numbers is 12. Four of them are 10, 15, 9 and 14. Find the fifth.",a:12,work:["Total of all five: 5 \xd7 12 = 60","60 \u2212 (10 + 15 + 9 + 14) = 60 \u2212 48 = 12"]},{type:"num",q:"The mean of 4 numbers is 20. When one more number is added, the mean becomes 22. What number was added?",a:30,work:["Before: 4 \xd7 20 = 80","After: 5 \xd7 22 = 110","110 \u2212 80 = 30"]},{type:"mc",q:"Which average is best for data with one very large value, like house prices?",options:["Median","Mean","Range","Mode"],a:0,why:"One huge value drags the mean up. The median just takes the middle, so it isn't affected."},{type:"num",s:1,q:"Find the interquartile range of 3, 5, 7, 8, 10, 12, 15.",a:7,work:["7 values, already in order","Lower quartile: the 2nd value = 5","Upper quartile: the 6th value = 12","IQR = 12 \u2212 5 = 7"]}]},P7:{name:"Averages from tables",ex:[{type:"teach",title:"Frequency tables",text:"The frequency tells you how many times each value appears.",table:[["x","0","1","2","3"],["Frequency f","4","6","7","3"],["fx","0","6","14","9"]],eq:"mean = {{\u03a3fx//\u03a3f}}",we:{q:"Find the mean from the table.",s:["\u03a3f = 4 + 6 + 7 + 3 = 20","\u03a3fx = 0 + 6 + 14 + 9 = 29","29 \xf7 20"],a:"1.45"},bullets:["Grouped data: multiply each frequency by the midpoint of its group. The mean is then an estimate."]},{type:"num",q:"The table shows how many pets 20 students have. Find the mean.",table:[["Pets","0","1","2","3","4"],["Frequency","5","8","4","2","1"]],a:1.3,work:["\u03a3fx = 0 + 8 + 8 + 6 + 4 = 26","26 \xf7 20 = 1.3"]},{type:"num",q:"Using the same pets table, find the median.",table:[["Pets","0","1","2","3","4"],["Frequency","5","8","4","2","1"]],a:1,work:["20 values: the median is between the 10th and 11th","The 1st\u20135th are 0, the 6th\u201313th are 1","Both are 1, so the median is 1"]},{type:"num",q:"Using the same pets table, what is the mode?",table:[["Pets","0","1","2","3","4"],["Frequency","5","8","4","2","1"]],a:1,work:["1 pet has the highest frequency (8)"]},{type:"num",q:"Calculate an estimate of the mean time.",table:[["Time t (min)","Frequency"],["0 < t \u2264 10","4"],["10 < t \u2264 20","9"],["20 < t \u2264 30","5"],["30 < t \u2264 40","2"]],a:17.5,unit:"min",work:["Midpoints: 5, 15, 25, 35","\u03a3fx = 20 + 135 + 125 + 70 = 350","350 \xf7 20 = 17.5 minutes"]},{type:"mc",q:"Which is the modal class of the times?",table:[["Time t (min)","Frequency"],["0 < t \u2264 10","4"],["10 < t \u2264 20","9"],["20 < t \u2264 30","5"],["30 < t \u2264 40","2"]],options:["10 < t \u2264 20","0 < t \u2264 10","20 < t \u2264 30","30 < t \u2264 40"],a:0,why:"It has the highest frequency, 9."},{type:"mc",q:"Why is the mean from grouped data only an estimate?",options:["We don't know the exact values inside each group","The frequencies might be wrong","The groups are too big to add","The midpoints are always too high"],a:0,why:"Using the midpoint assumes the values are spread evenly through each group."}]},P8:{name:"Charts & types of data",ex:[{type:"teach",title:"Pie charts and stem-and-leaf",text:"A pie chart shows how a whole is shared out. The full circle is 360\xb0.",svg:{k:"pie",parts:[["Walk",12],["Bus",16],["Car",8],["Cycle",4]],deg:1,alt:"Pie chart of how 40 students travel"},eq:"angle = {{frequency//total}} \xd7 360\xb0",bullets:["Stem-and-leaf: the stem is the tens, the leaves are the units, with a key like 2 | 3 = 23.","Discrete data is counted (number of pets). Continuous data is measured (height, time)."],we:{q:"12 of 40 students walk to school. Find the angle for walking.",s:["{{12//40}} \xd7 360"],a:"108\xb0"}},{type:"num",q:"In a survey of 60 people, 15 chose tea. Find the angle for tea in a pie chart.",a:90,unit:"\xb0",work:["{{15//60}} \xd7 360 = 90\xb0"]},{type:"num",q:"In a pie chart of 90 people, the sector for football is 72\xb0. How many people chose football?",a:18,work:["{{72//360}} \xd7 90 = 18"]},{type:"num",q:"The bar chart shows visitors to a museum. How many more came on Wednesday than on Friday?",svg:{k:"bar",cats:["Mon","Tue","Wed","Thu","Fri"],vals:[12,8,15,10,5],ym:16,ys:2,y:"visitors"},a:10,work:["Wednesday 15, Friday 5","15 \u2212 5 = 10"]},{type:"num",q:"Find the median from the stem-and-leaf diagram. Key: 1 | 2 = 12.",table:[["Stem","Leaves"],["1","2  5  8"],["2","0  3  3  7"],["3","1  4"]],a:23,work:["9 values: 12, 15, 18, 20, 23, 23, 27, 31, 34","The 5th is the middle: 23"]},{type:"num",q:"Find the range of the same stem-and-leaf data.",table:[["Stem","Leaves"],["1","2  5  8"],["2","0  3  3  7"],["3","1  4"]],a:22,work:["34 \u2212 12 = 22"]},{type:"mc",q:"Which of these is continuous data?",options:["The time taken to run 100 m","The number of goals scored","Shoe size","Favourite colour"],a:0,why:"Time is measured and can take any value. Goals and shoe sizes come in steps (discrete); colour isn't a number at all."}]},P9:{name:"Scatter graphs",ex:[{type:"teach",title:"Correlation",text:"A scatter graph plots two measurements for each person or thing, to see if they are linked.",svg:u,bullets:["Positive correlation: as one goes up, so does the other.","Negative correlation: as one goes up, the other goes down.","No correlation: no pattern.","Use the line of best fit to estimate, but only inside the range of the data."],warn:"Correlation doesn't prove one thing causes the other."},{type:"mc",q:"What type of correlation does the scatter graph show?",svg:u,options:["Positive","Negative","None","Perfect negative"],a:0,why:"Students who revised for longer tended to score higher: both go up together."},{type:"num",q:"Use the line of best fit to estimate the score of a student who revised for 5.5 hours.",svg:u,a:60,tol:3,work:["Go up from 5.5 on the hours axis to the line, then across","About 60"]},{type:"mc",q:"Why would it be unreliable to use the line to estimate the score for 15 hours of revision?",options:["15 hours is outside the range of the data","The correlation is negative","The line doesn't go through the origin","Scores can't be estimated"],a:0,why:"The data only goes up to 9 hours. Beyond that (extrapolation) the pattern may not continue: scores can't go above 100."},{type:"mc",q:"As the outside temperature rises, sales of hot chocolate fall. What correlation is this?",options:["Negative","Positive","None","It depends on the price"],a:0,why:"One goes up while the other goes down."},{type:"mc",q:"Shoe size and reading age are positively correlated in children. Which is the best explanation?",options:["Both increase as children get older","Big feet help you read","Reading makes your fee
